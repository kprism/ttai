name: Patch core service showcase
on:
  push:
    paths:
      - '.github/workflows/patch_core_showcase.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add section 05 and normalize briefing sequence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('brief/teacher.html')
          s=p.read_text(encoding='utf-8')

          # Remove the old standalone Gyeongnam status section; its role is absorbed into the domestic-platform overview.
          s,n=re.subn(r'<section id="s4" class="section">.*?</section>','',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f's4 remove count={n}')

          # Remove the old 7-service summary because section 05 becomes the richer six-core-service showcase.
          s,n=re.subn(r'<section id="s9" class="section">.*?</section>','',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f's9 remove count={n}')

          # Normalize top navigation.
          nav='''<nav class="tabs"><a href="#s1">소개</a><a href="#s2">왜 만들었나</a><a href="#s3">생각자국 AI</a><a href="#s5">국내플랫폼</a><a href="#s5core">실체</a><a href="#s6">하이러닝 비교</a><a href="#s7">연구근거</a><a href="#s8">교육모델</a><a href="#s10">학생시연</a><a href="#s11">질문학교</a><a href="#s12">스터디그룹</a><a href="#s13">성장·성취</a><a href="#s14">퀘스트</a><a href="#s15">선생님지원</a><a href="#s16">학부모</a><a href="#s17">진로</a><a href="#s18">기관분석</a><a href="#s19">의견</a></nav>'''
          s,n=re.subn(r'<nav class="tabs">.*?</nav>',nav,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'nav replace count={n}')

          # Shift the three following visible numbers by one.
          s=s.replace('05 · 하이러닝 vs 생각자국 AI','06 · 하이러닝 vs 생각자국 AI')
          s=s.replace('06 · 연구근거','07 · 연구근거')
          s=s.replace('07 · 교육모델','08 · 교육모델')

          core=r'''<section id="s5core" class="section"><style>
          #s5core .coreGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:13px}
          #s5core .coreCard{position:relative;height:285px;border-radius:20px;overflow:hidden;border:1px solid #d5e3ed;background:#071d55;cursor:pointer;box-shadow:0 10px 25px #0b2a510f;transition:.2s}
          #s5core .coreCard:hover{transform:translateY(-3px);box-shadow:0 16px 36px #0b2a5120}
          #s5core .coreShot{position:absolute;inset:0;overflow:hidden;background:#fff}
          #s5core .coreShot iframe{width:150%;height:150%;border:0;transform:scale(.67);transform-origin:0 0;pointer-events:none;background:#fff}
          #s5core .coreShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,23,74,.14),rgba(3,36,102,.55) 54%,rgba(2,25,78,.94));z-index:2}
          #s5core .coreText{position:absolute;z-index:3;left:22px;right:22px;bottom:20px;color:#fff}
          #s5core .coreText b{display:block;font-size:30px;letter-spacing:-.03em;margin-bottom:6px}
          #s5core .coreText span{display:block;color:#eaf5ff;font-size:13px;line-height:1.55}
          #s5core .coreBadge{position:absolute;z-index:4;top:16px;left:16px;padding:7px 10px;border-radius:999px;background:#ffffffdf;color:#07317c;font-size:11px;font-weight:950}
          #s5core .coreOpen{position:absolute;z-index:4;right:16px;top:16px;padding:8px 10px;border-radius:11px;background:#0a78cde8;color:#fff;font-size:11px;font-weight:950}
          @media(max-width:850px){#s5core .coreGrid{grid-template-columns:1fr}#s5core .coreCard{height:250px}}
          </style><div class="kicker">05 · 생각자국의 실체</div><h2>생각자국의 실체를 보여드리겠습니다</h2><p class="lead">질문, 사고, 성장, 진로, 지역 프로젝트, 교사 지원까지. 여섯 핵심 서비스를 실제 화면으로 확인하고, 빨간 포인트를 눌러 핵심 작동방식을 짚어볼 수 있습니다.</p><div class="coreGrid">
          <article class="coreCard" data-url="../services/core-services-showcase.html?service=question"><div class="coreShot"><iframe loading="lazy" src="../services/socratic-question-school.html"></iframe></div><div class="coreShade"></div><div class="coreBadge">01 · 질문 훈련</div><div class="coreOpen">핵심 포인트 보기 ↗</div><div class="coreText"><b>질문학교</b><span>소크라테스식 질문법을 통해 학생이 개념의 경계를 스스로 다듬고 다시 세우는 질문 훈련 서비스</span></div></article>
          <article class="coreCard" data-url="../services/core-services-showcase.html?service=studio"><div class="coreShot"><iframe loading="lazy" src="../services/scenario-demo.html?v=20260811&amp;type=electric"></iframe></div><div class="coreShade"></div><div class="coreBadge">02 · 융합 사고</div><div class="coreOpen">핵심 포인트 보기 ↗</div><div class="coreText"><b>생각스튜디오</b><span>하나의 질문을 여러 교과 성취기준과 연결하고, 역질문으로 오개념을 깨우며 융합학습 이수기록까지 이어가는 AI 학습 공간</span></div></article>
          <article class="coreCard" data-url="../services/core-services-showcase.html?service=growth"><div class="coreShot"><iframe loading="lazy" src="../services/growth-compass.html"></iframe></div><div class="coreShade"></div><div class="coreBadge">03 · 성장 조정</div><div class="coreOpen">핵심 포인트 보기 ↗</div><div class="coreText"><b>성장·성취</b><span>교과 성취와 질문력·학습흥미의 변화를 함께 보고 학생별 난이도 조정까지 연결하는 성장 관리 서비스</span></div></article>
          <article class="coreCard" data-url="../services/core-services-showcase.html?service=career"><div class="coreShot"><iframe loading="lazy" src="../services/career-growth-ai.html"></iframe></div><div class="coreShade"></div><div class="coreBadge">04 · 활동 기반 진로</div><div class="coreOpen">핵심 포인트 보기 ↗</div><div class="coreText"><b>진로성장 AI</b><span>한 번의 검사가 아니라 학생이 실제로 해온 질문·학습·프로젝트 활동에서 진로역량의 단서를 찾는 서비스</span></div></article>
          <article class="coreCard" data-url="../services/core-services-showcase.html?service=quest"><div class="coreShot"><iframe loading="lazy" src="../services/local-quest.html"></iframe></div><div class="coreShade"></div><div class="coreBadge">05 · 지역문제 해결</div><div class="coreOpen">핵심 포인트 보기 ↗</div><div class="coreText"><b>로컬퀘스트</b><span>지역의 실제 문제를 팀 프로젝트로 조사·협업·대안제시·기관연결까지 이어가는 실천형 학습 서비스</span></div></article>
          <article class="coreCard" data-url="../services/core-services-showcase.html?service=teacher"><div class="coreShot"><iframe loading="lazy" src="../services/teacher-tasks.html"></iframe></div><div class="coreShade"></div><div class="coreBadge">06 · 교사 업무지원</div><div class="coreOpen">핵심 포인트 보기 ↗</div><div class="coreText"><b>선생님 지원</b><span>난이도 조정, 프로젝트 승인, 수행평가, 성장리포트와 학급 안내를 한곳에서 처리하는 교사 업무 코파일럿</span></div></article>
          </div><div class="msgbox">설명만 듣는 서비스가 아니라, 실제 화면에서 어디를 보고 무엇을 판단하는지 직접 확인할 수 있도록 구성했습니다.</div></section>'''

          # Insert after the domestic-platform section.
          m=re.search(r'(<section id="s5" class="section">.*?</section>)',s,flags=re.S)
          if not m:
              raise SystemExit('s5 not found')
          s=s[:m.end()]+core+s[m.end():]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit teacher briefing update and remove one-time workflow
        run: |
          git config user.name "ttai-builder"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/patch_core_showcase.yml
          git add brief/teacher.html .github/workflows/patch_core_showcase.yml
          git commit -m "Add section 05 annotated six-service showcase"
          git push origin main