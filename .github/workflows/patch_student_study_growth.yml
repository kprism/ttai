name: Patch student study and growth demos
on:
  push:
    paths:
      - '.github/workflows/patch_student_study_growth.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update briefing sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('brief/teacher.html')
          s=p.read_text(encoding='utf-8')

          nav='''<nav class="tabs"><a href="#s1">소개</a><a href="#s2">왜 만들었나</a><a href="#s3">생각자국 AI</a><a href="#s5">국내플랫폼</a><a href="#s5core">실체</a><a href="#s6">하이러닝 비교</a><a href="#s7">연구근거</a><a href="#s8">교육모델</a><a href="#s10">학생시연</a><a href="#s12">스터디그룹</a><a href="#s13">성장·성취</a><a href="#s14">퀘스트</a><a href="#s15">선생님지원</a><a href="#s16">학부모</a><a href="#s17">진로</a><a href="#s18">기관분석</a><a href="#s19">의견</a></nav>'''
          s,n=re.subn(r'<nav class="tabs">.*?</nav>',nav,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'nav replace={n}')

          student=r'''<section id="s10" class="section"><div class="kicker">10 · 중2 학생시연</div><h2>같은 AI라도, 과목마다 다른 사고를 묻습니다</h2><p class="lead">수학·영어·과학·사회의 실제 학습 장면을 나눠 보여드립니다. 각 과목을 누르면 1초 소개 후 실제 시연페이지의 핵심 지점에 빨간 원이 붙고, 클릭하면 연결선과 설명 말풍선이 나타납니다.</p><div class="grid4"><article class="card"><div style="font-size:42px">📐</div><h3>수학</h3><p>정답보다 풀이의 기준과 오개념을 확인하고, 필요하면 그래프·반례·자기설명으로 이어갑니다.</p><button class="demo" data-url="../services/interactive-showcase.html?demo=student&amp;subject=math">수학 시연 보기 ▶</button></article><article class="card"><div style="font-size:42px">🗣️</div><h3>영어</h3><p>문법 교정만 하지 않고 주장·근거·반론을 영어 표현과 함께 다듬어 의사소통 역량으로 연결합니다.</p><button class="demo" data-url="../services/interactive-showcase.html?demo=student&amp;subject=english">영어 시연 보기 ▶</button></article><article class="card"><div style="font-size:42px">🔬</div><h3>과학</h3><p>학생이 놓친 변수와 탐구 범위를 찾아 현상을 더 넓게 보도록 질문하고 자료 탐색으로 연결합니다.</p><button class="demo" data-url="../services/interactive-showcase.html?demo=student&amp;subject=science">과학 시연 보기 ▶</button></article><article class="card"><div style="font-size:42px">🏛️</div><h3>사회</h3><p>하나의 입장을 정답으로 고정하지 않고 권리·공동체·이해관계가 충돌할 때 판단 기준을 세웁니다.</p><button class="demo" data-url="../services/interactive-showcase.html?demo=student&amp;subject=social">사회 시연 보기 ▶</button></article></div><div class="msgbox">교과는 달라도 공통원리는 같습니다. <b>학생의 답 → 이유 확인 → 막힌 사고지점 진단 → 다음 질문·도구 선택</b>의 순환이 이어집니다.</div></section>'''
          s,n=re.subn(r'<section id="s10" class="section">.*?</section>',student,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f's10 replace={n}')

          # 질문학교는 05 실체에서 충분히 시연하므로 독립 섹션 제거
          s,n=re.subn(r'<section id="s11" class="section">.*?</section>','',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f's11 remove={n}')

          study=r'''<section id="s12" class="section"><div class="kicker">11 · 스터디그룹</div><h2>화상회의를 ‘토론학습 데이터’로 바꿉니다</h2><p class="lead">스터디그룹의 특별한 기능은 영상통화 자체가 아니라, 학생의 발화를 실시간 자막으로 바꾸고 주장·근거·질문·대안을 구조화해 학습기록과 교사 피드백으로 연결하는 데 있습니다.</p><div class="grid2"><div class="panel"><h3>🎙️ 실시간 자막 · 토론 분석</h3><div class="steps"><div class="step">① 말하는 학생을 감지하고 <b>실시간 자막</b> 표시</div><div class="step">② 발화를 <b>주장·근거·질문·대안</b>으로 구분</div><div class="step">③ 토론의 핵심 논점과 다음 질문을 자동 요약</div><div class="step">④ 참여와 근거제시 기록을 성장데이터로 연결</div></div><button class="demo" data-url="../services/interactive-showcase.html?demo=study">🎥 실시간 자막 토론 시연 보기</button></div><div class="panel"><h3>📚 2022 개정 교육과정 활용 예시</h3><div class="steps"><div class="step"><b>초등</b><br><span style="color:var(--m);font-weight:600">국어 말하기·듣기, 사회 공동체 문제 토의, 과학 관찰 결과 발표</span></div><div class="step"><b>중등</b><br><span style="color:var(--m);font-weight:600">국어 토론·논증, 영어 이해·표현, 사회 주제 중심 토의·탐구, 과학 탐구활동 발표</span></div><div class="step"><b>고등</b><br><span style="color:var(--m);font-weight:600">화법·작문형 활동, 영어 발표와 토론, 사회 쟁점 토론, 과학·진로 프로젝트 협업</span></div></div><div class="source"><b>교육과정 근거</b> 교육부 고시 제2022-33호 「초·중등학교 교육과정 총론 및 각론」(2022) 및 교육부 「2022 개정 교육과정, 이렇게 바뀝니다! 1편_국어·영어·사회·과학」. 실제 적용 시 학교급·학년별 성취기준과 매핑합니다.</div></div></div><div class="previewFrame" style="height:500px"><iframe src="../services/study-live-caption-demo.html" title="스터디그룹 실시간 자막 시연"></iframe></div><div class="msgbox">말한 내용이 사라지는 화상회의가 아니라, <b>누가 무엇을 주장했고 어떤 근거를 제시했는지</b>가 학습과 성장의 증거가 됩니다.</div></section>'''
          s,n=re.subn(r'<section id="s12" class="section">.*?</section>',study,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f's12 replace={n}')

          growth=r'''<section id="s13" class="section"><div class="kicker">12 · 성장·성취</div><h2>난이도 조정은 ‘AI 자동결정’이 아니라 교사의 판단으로 완성됩니다</h2><p class="lead">조정 필요 학생을 클릭하면 날짜·시간, 과정, 실제 활동, 평가 근거를 먼저 확인합니다. 그 아래 AI 권고 이유를 짧게 제시하고, 선생님이 상향·유지·하향 중 최종 결정을 선택합니다.</p><div class="grid3"><div class="card"><h3>① 활동 이력</h3><p>년월일시 · 과정 · 어떤 활동 · 평가를 표로 보여줘 왜 조정이 필요한지 추적할 수 있습니다.</p></div><div class="card"><h3>② AI 권고 설명</h3><p>정답률 하나가 아니라 질문력, 자기설명, 힌트 의존도, 최근 활동 변화를 함께 요약합니다.</p></div><div class="card"><h3>③ 교사 최종 선택</h3><p><b>상향 · 유지 · 하향</b>을 교사가 직접 결정하고 선택 결과를 학생의 다음 학습단계에 반영합니다.</p></div></div><div class="previewFrame" style="height:570px"><iframe src="../services/growth-adjustment-demo.html" title="성장성취 난이도 조정 시연"></iframe></div><button class="demo" data-url="../services/growth-adjustment-demo.html">📊 학생별 활동근거와 난이도 조정 직접 보기</button><div class="msgbox">AI는 학생의 상태를 정리하고 권고합니다. <b>교육적 판단과 최종 결정권은 교사에게 남깁니다.</b></div></section>'''
          s,n=re.subn(r'<section id="s13" class="section">.*?</section>',growth,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f's13 replace={n}')

          # 질문학교 제거에 따라 이후 표시 번호를 한 칸 당김. 내부 id는 링크 안정성을 위해 유지.
          nums={'s14':'13','s15':'14','s16':'15','s17':'16','s18':'17','s19':'18'}
          for sid,num in nums.items():
              pat=rf'(<section id="{sid}" class="section">.*?<div class="kicker">)\d+'
              s,n=re.subn(pat,rf'\g<1>{num}',s,count=1,flags=re.S)
              if n!=1: print(f'warning: {sid} renumber={n}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit briefing patch and remove workflow
        run: |
          git config user.name "ttai-builder"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/patch_student_study_growth.yml
          git add brief/teacher.html .github/workflows/patch_student_study_growth.yml
          git commit -m "Upgrade student study and growth briefing demos"
          git push origin main
