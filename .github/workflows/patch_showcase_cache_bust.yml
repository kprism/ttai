name: Patch showcase modal cache bust
on:
  push:
    paths:
      - '.github/workflows/patch_showcase_cache_bust.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add cache-busting version to showcase iframe URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('brief/teacher.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('../services/core-services-showcase.html?service=', '../services/core-services-showcase.html?v=20260811fix1&service=')
          s=s.replace('../services/interactive-showcase.html?demo=', '../services/interactive-showcase.html?v=20260811fix1&demo=')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "ttai-builder"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/patch_showcase_cache_bust.yml
          git add brief/teacher.html .github/workflows/patch_showcase_cache_bust.yml
          git commit -m "Bust cache for fixed showcase modal wrappers"
          git push origin main
