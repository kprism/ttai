name: Fix briefing numbering and localquest preview
on:
  push:
    paths:
      - '.github/workflows/fix_brief_numbering_localquest_preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch teacher brief
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('brief/teacher.html')
          s=p.read_text(encoding='utf-8')

          # 1) 로컬퀘스트 카드 미리보기는 스크립트를 실행하지 않는 정적 실제 HTML 미리보기로 고정.
          #    카드 클릭 후 열리는 실제 서비스/시연 페이지는 그대로 유지한다.
          old='<iframe loading="lazy" src="../services/local-quest.html"></iframe>'
          new='<iframe loading="lazy" src="../services/local-quest.html" sandbox="allow-same-origin" title="로컬퀘스트 정적 미리보기"></iframe>'
          if old in s:
              s=s.replace(old,new,1)

          # 2) 삭제 후 남아 있는 발표 섹션의 화면 표시 번호를 메뉴 순서대로 연속 재번호화.
          replacements={
              '<div class="kicker">10 · 중2 학생시연</div>':'<div class="kicker">06 · 중2 학생시연</div>',
              '<div class="kicker">11 · 스터디그룹</div>':'<div class="kicker">07 · 스터디그룹</div>',
              '<div class="kicker">13 · 퀘스트</div>':'<div class="kicker">08 · 퀘스트</div>',
              '<div class="kicker">15 · 학부모</div>':'<div class="kicker">09 · 학부모</div>',
              '<div class="kicker">17 · 기관분석</div>':'<div class="kicker">10 · 기관분석</div>',
              '<div class="kicker" style="color:#8feeff">19 · 현장 의견</div>':'<div class="kicker" style="color:#8feeff">11 · 현장 의견</div>',
          }
          for a,b in replacements.items():
              s=s.replace(a,b)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('brief/teacher.html').read_text(encoding='utf-8')
          checks=[
            '06 · 중2 학생시연','07 · 스터디그룹','08 · 퀘스트','09 · 학부모','10 · 기관분석','11 · 현장 의견',
            'src="../services/local-quest.html" sandbox="allow-same-origin"'
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('MISSING: '+repr(missing))
          print('PATCH_VERIFY_OK')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "ttai-builder"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix_brief_numbering_localquest_preview.yml
          git add brief/teacher.html .github/workflows/fix_brief_numbering_localquest_preview.yml
          git commit -m "Fix localquest preview flicker and renumber briefing sections"
          git push origin main
