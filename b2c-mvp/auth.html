<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각자국AI · 로그인</title><style>:root{--bg:#f6f8fc;--panel:#fff;--text:#172033;--muted:#778198;--line:#e5e9f1;--brand:#4666ff;--soft:#eef1ff;--red:#c85159}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text)}header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}.brand{display:flex;align-items:center;gap:9px;font-weight:850;font-size:18px;text-decoration:none;color:var(--text)}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#657dff,#384ed9);color:#fff}.wrap{width:min(760px,calc(100% - 28px));margin:34px auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 16px 48px rgba(35,46,81,.07)}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.eyebrow{font-size:11px;color:#66738b;font-weight:800;margin:0 0 4px}.head h1{font-size:25px;letter-spacing:-.04em;margin:0}.tabs{display:flex;background:#f2f4f8;border-radius:11px;padding:3px;gap:3px}.tabs button{border:0;background:transparent;border-radius:8px;height:32px;padding:0 12px;font-weight:800;font-size:11px;color:#6c778c;cursor:pointer}.tabs button.active{background:#fff;color:#3348c8;box-shadow:0 2px 8px rgba(31,45,83,.09)}form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:#7b869a;font-weight:800;margin:0 0 4px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 11px;font:inherit;font-size:13px;outline:0}.field input:focus,.field select:focus{border-color:#9facff;box-shadow:0 0 0 3px rgba(70,102,255,.06)}.avatars{display:flex;gap:6px}.avatars button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:21px;cursor:pointer}.avatars button.active{border-color:#9facff;background:var(--soft)}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.actions button{height:41px;border:0;background:var(--brand);color:#fff;border-radius:11px;padding:0 18px;font-weight:850;cursor:pointer}.status{font-size:11px;color:#778198}.status.error{color:var(--red)}.api{margin-top:12px;padding:10px 12px;border-radius:11px;background:#f8f9fc;font-size:10px;color:#8a94a7}.api summary{cursor:pointer;font-weight:800}.api input{margin-top:8px;width:100%;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 9px;font-size:11px}.hidden{display:none!important}@media(max-width:620px){.wrap{margin:18px auto}.card{padding:17px}.head{display:block}.tabs{margin-top:12px;width:max-content}form{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}}</style></head><body><header><a class="brand" href="./home.html"><span class="mark">✦</span>생각자국AI</a></header><main class="wrap"><section class="card"><div class="head"><div><p class="eyebrow">실제 계정으로 시작하기</p><h1 id="title">생각자국AI 가입</h1></div><div class="tabs"><button id="joinTab" class="active" type="button">회원가입</button><button id="loginTab" type="button">로그인</button></div></div><form id="authForm"><div class="field join"><label>이름 또는 닉네임</label><input id="name" value="민준" required></div><div class="field join"><label>이용 유형</label><select id="role"><option value="student">학생</option><option value="parent">학부모</option><option value="coach">학습코치</option></select></div><div class="field full"><label>이메일</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field full"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="8자 이상" required></div><div class="field join"><label>학년</label><select id="grade"><option value="">해당 없음</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option selected>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option></select></div><div class="field join"><label>캐릭터</label><div class="avatars"><button type="button" data-avatar="👦" class="active">👦</button><button type="button" data-avatar="👧">👧</button><button type="button" data-avatar="🧑">🧑</button><button type="button" data-avatar="🧒">🧒</button></div></div></form><div class="actions"><div id="status" class="status">계정 정보는 실제 백엔드 DB에 저장됩니다.</div><button id="submit" type="button">가입하고 시작하기</button></div><details class="api"><summary>개발용 API 주소</summary><input id="apiBase" placeholder="예: https://api.example.com"></details></section></main><script src="./api-client.js?v=260815-1"></script><script>const $=id=>document.getElementById(id);let mode='join';const joinFields=[...document.querySelectorAll('.join')];function setMode(next){mode=next;const join=next==='join';$('joinTab').classList.toggle('active',join);$('loginTab').classList.toggle('active',!join);joinFields.forEach(x=>x.classList.toggle('hidden',!join));$('title').textContent=join?'생각자국AI 가입':'다시 만나서 반가워';$('submit').textContent=join?'가입하고 시작하기':'로그인';$('password').autocomplete=join?'new-password':'current-password';$('status').textContent='계정 정보는 실제 백엔드 DB에 저장됩니다.';$('status').className='status'}$('joinTab').onclick=()=>setMode('join');$('loginTab').onclick=()=>setMode('login');document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('apiBase').value=TTAI.base();$('apiBase').onchange=()=>TTAI.setApiBase($('apiBase').value.trim());function go(user){if(user.role==='parent')location.href='./parent.html';else if(user.role==='coach')location.href='./teacher.html';else location.href='./home.html'}$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;const s=$('status');s.textContent='서버에 연결 중...';s.className='status';$('submit').disabled=true;try{let result;if(mode==='join'){const name=$('name').value.trim()||'사용자',role=$('role').value,grade=role==='student'?$('grade').value:null,avatar=document.querySelector('[data-avatar].active')?.dataset.avatar||'👦';result=await TTAI.register({email,password,name,role,grade,avatar});}else result=await TTAI.login({email,password});s.textContent='완료! 이동합니다.';go(result.user);}catch(e){s.textContent=e.message;s.className='status error'}finally{$('submit').disabled=false}};if(TTAI.isLoggedIn())TTAI.me().then(go).catch(()=>{});</script></body></html>
