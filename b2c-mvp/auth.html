<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각자국AI · 로그인</title><style>:root{--bg:#f6f8fc;--text:#172033;--muted:#778198;--line:#e5e9f1;--brand:#4666ff;--soft:#eef1ff;--red:#c85159}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text)}header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}.brand{display:flex;align-items:center;gap:9px;font-weight:850;font-size:18px;text-decoration:none;color:var(--text)}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#657dff,#384ed9);color:#fff}.wrap{width:min(760px,calc(100% - 28px));margin:26px auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 16px 48px rgba(35,46,81,.07)}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.eyebrow{font-size:11px;color:#66738b;font-weight:800;margin:0 0 4px}.head h1{font-size:25px;letter-spacing:-.04em;margin:0}.tabs{display:flex;background:#f2f4f8;border-radius:11px;padding:3px;gap:3px}.tabs button{border:0;background:transparent;border-radius:8px;height:32px;padding:0 12px;font-weight:800;font-size:11px;color:#6c778c;cursor:pointer}.tabs button.active{background:#fff;color:#3348c8;box-shadow:0 2px 8px rgba(31,45,83,.09)}form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:#7b869a;font-weight:800;margin:0 0 4px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 11px;font:inherit;font-size:13px;outline:0}.field input:focus,.field select:focus{border-color:#9facff;box-shadow:0 0 0 3px rgba(70,102,255,.06)}.identity{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fbfcff}.photo-preview{width:58px;height:58px;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:28px;border:1px solid #dfe4f4}.photo-preview img{width:100%;height:100%;object-fit:cover}.identity-main{min-width:0}.identity-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.identity-title{font-size:11px;font-weight:850}.identity-actions{display:flex;gap:6px}.mini-btn{height:30px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#536079;font-weight:800;font-size:10px;padding:0 9px;cursor:pointer}.avatars{display:flex;gap:5px;margin-top:7px;align-items:center}.avatars button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:18px;cursor:pointer}.avatars button.active{border-color:#9facff;background:var(--soft)}.photo-note{font-size:9px;color:#8a94a7;margin-top:5px}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:13px}.actions button{height:41px;border:0;background:var(--brand);color:#fff;border-radius:11px;padding:0 18px;font-weight:850;cursor:pointer}.status{font-size:11px;color:#778198}.status.error{color:var(--red)}.api{margin-top:10px;padding:9px 11px;border-radius:11px;background:#f8f9fc;font-size:10px;color:#8a94a7}.api summary{cursor:pointer;font-weight:800}.api input{margin-top:7px;width:100%;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 9px;font-size:11px}.hidden{display:none!important}.camera-modal{position:fixed;inset:0;background:rgba(18,25,45,.62);display:grid;place-items:center;padding:18px;z-index:100}.camera-modal[hidden]{display:none}.camera-card{width:min(520px,100%);background:#fff;border-radius:18px;padding:14px;box-shadow:0 25px 80px rgba(0,0,0,.25)}.camera-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.camera-head strong{font-size:14px}.camera-head button{border:0;background:#f2f4f8;border-radius:9px;width:32px;height:32px;font-size:18px;cursor:pointer}.camera-view{aspect-ratio:4/3;background:#111;border-radius:14px;overflow:hidden}.camera-view video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.camera-actions{display:flex;justify-content:center;gap:8px;margin-top:10px}.camera-actions button{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 14px;font-weight:850;cursor:pointer}.camera-actions .capture{background:var(--brand);border-color:var(--brand);color:#fff}@media(max-width:620px){.wrap{margin:14px auto}.card{padding:16px}.head{display:block}.tabs{margin-top:10px;width:max-content}form{grid-template-columns:1fr}.field.full,.identity{grid-column:auto}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}.identity{grid-template-columns:auto 1fr}.identity-top{align-items:flex-start;flex-direction:column}.identity-actions{width:100%}.mini-btn{flex:1}}</style></head><body><header><a class="brand" href="./home.html"><span class="mark">✦</span>생각자국AI</a></header><main class="wrap"><section class="card"><div class="head"><div><p class="eyebrow">실제 계정으로 시작하기</p><h1 id="title">생각자국AI 가입</h1></div><div class="tabs"><button id="joinTab" class="active" type="button">회원가입</button><button id="loginTab" type="button">로그인</button></div></div><form id="authForm"><div class="field join"><label>이름 또는 닉네임</label><input id="name" value="민준" required></div><div class="field join"><label>이용 유형</label><select id="role"><option value="student">학생</option><option value="parent">학부모</option><option value="coach">학습코치</option></select></div><div class="identity join"><div class="photo-preview" id="photoPreview">👦</div><div class="identity-main"><div class="identity-top"><span class="identity-title">내 모습</span><div class="identity-actions"><button class="mini-btn" id="choosePhoto" type="button">사진 선택</button><button class="mini-btn" id="openCamera" type="button">📷 촬영</button></div></div><div class="avatars"><button type="button" data-avatar="👦" class="active">👦</button><button type="button" data-avatar="👧">👧</button><button type="button" data-avatar="🧑">🧑</button><button type="button" data-avatar="🧒">🧒</button></div><div class="photo-note">사진은 선택사항이야. 사진을 쓰지 않으면 선택한 캐릭터가 보여.</div></div><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="cameraFallback" type="file" accept="image/*" capture="user" hidden></div><div class="field full"><label>이메일</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field full"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="8자 이상" required></div><div class="field join"><label>학년</label><select id="grade"><option value="">해당 없음</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option selected>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option></select></div></form><div class="actions"><div id="status" class="status">계정과 사진은 실제 백엔드에 저장됩니다.</div><button id="submit" type="button">가입하고 시작하기</button></div><details class="api"><summary>개발용 API 주소</summary><input id="apiBase" placeholder="예: https://api.example.com"></details></section></main><div class="camera-modal" id="cameraModal" hidden><div class="camera-card"><div class="camera-head"><strong>프로필 사진 촬영</strong><button id="closeCamera" type="button">×</button></div><div class="camera-view"><video id="cameraVideo" autoplay playsinline muted></video></div><div class="camera-actions"><button id="cancelCamera" type="button">취소</button><button class="capture" id="captureCamera" type="button">촬영하기</button></div><canvas id="cameraCanvas" hidden></canvas></div></div><script src="./api-client.js?v=260815-2"></script><script>const $=id=>document.getElementById(id);let mode='join',photoFile=null,photoUrl='',stream=null;const joinFields=[...document.querySelectorAll('.join')];function setMode(next){mode=next;const join=next==='join';$('joinTab').classList.toggle('active',join);$('loginTab').classList.toggle('active',!join);joinFields.forEach(x=>x.classList.toggle('hidden',!join));$('title').textContent=join?'생각자국AI 가입':'다시 만나서 반가워';$('submit').textContent=join?'가입하고 시작하기':'로그인';$('password').autocomplete=join?'new-password':'current-password';$('status').textContent=join?'계정과 사진은 실제 백엔드에 저장됩니다.':'이메일과 비밀번호를 입력해 주세요.';$('status').className='status'}$('joinTab').onclick=()=>setMode('join');$('loginTab').onclick=()=>setMode('login');function selectedAvatar(){return document.querySelector('[data-avatar].active')?.dataset.avatar||'👦'}function renderIdentity(){const p=$('photoPreview');p.innerHTML='';if(photoUrl){const img=new Image();img.src=photoUrl;p.appendChild(img)}else p.textContent=selectedAvatar()}document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(!photoUrl)renderIdentity()});function useFile(file){if(!file)return;if(!file.type.startsWith('image/'))return;photoFile=file;if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(file);renderIdentity()}$('choosePhoto').onclick=()=>$('photoInput').click();$('photoInput').onchange=()=>{useFile($('photoInput').files[0]);$('photoInput').value=''};$('cameraFallback').onchange=()=>{useFile($('cameraFallback').files[0]);$('cameraFallback').value=''};function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('cameraVideo').srcObject=null;$('cameraModal').hidden=true}async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){$('cameraFallback').click();return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});$('cameraVideo').srcObject=stream;$('cameraModal').hidden=false}catch(e){$('cameraFallback').click()}}$('openCamera').onclick=startCamera;$('closeCamera').onclick=stopCamera;$('cancelCamera').onclick=stopCamera;$('captureCamera').onclick=()=>{const v=$('cameraVideo'),c=$('cameraCanvas');if(!v.videoWidth)return;c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext('2d');ctx.translate(c.width,0);ctx.scale(-1,1);ctx.drawImage(v,0,0,c.width,c.height);c.toBlob(blob=>{if(blob){useFile(new File([blob],`profile-${Date.now()}.jpg`,{type:'image/jpeg'}));stopCamera()}},'image/jpeg',.88)};$('apiBase').value=TTAI.base();$('apiBase').onchange=()=>TTAI.setApiBase($('apiBase').value.trim());function go(user){if(user.role==='parent')location.href='./parent.html';else if(user.role==='coach')location.href='./teacher.html';else location.href='./home.html'}$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,s=$('status');s.textContent='서버에 연결 중...';s.className='status';$('submit').disabled=true;try{let result;if(mode==='join'){const name=$('name').value.trim()||'사용자',role=$('role').value,grade=role==='student'?$('grade').value:null,avatar=selectedAvatar();result=await TTAI.register({email,password,name,role,grade,avatar});if(photoFile){s.textContent='프로필 사진 저장 중...';const uploaded=await TTAI.uploadProfilePhoto(photoFile);if(uploaded?.user)result.user=uploaded.user}}else result=await TTAI.login({email,password});s.textContent='완료! 이동합니다.';go(result.user)}catch(e){s.textContent=e.message;s.className='status error'}finally{$('submit').disabled=false}};window.addEventListener('beforeunload',()=>{if(photoUrl)URL.revokeObjectURL(photoUrl);if(stream)stream.getTracks().forEach(t=>t.stop())});if(TTAI.isLoggedIn())TTAI.me().then(go).catch(()=>{});</script></body></html>
