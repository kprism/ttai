<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각자국AI · 프로필 설정</title><style>:root{--bg:#f6f8fc;--panel:#fff;--text:#172033;--muted:#7a8498;--line:#e5e9f1;--brand:#4666ff;--soft:#eef1ff}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text)}header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}.brand{display:flex;align-items:center;gap:9px;font-weight:850;font-size:18px;text-decoration:none;color:var(--text)}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#657dff,#384ed9);color:#fff}.wrap{width:min(900px,calc(100% - 28px));margin:16px auto 28px}.steps{display:flex;justify-content:center;gap:6px;margin:0 0 12px}.steps i{width:30px;height:4px;background:#e3e7ef;border-radius:99px}.steps i.on{background:var(--brand)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:0 14px 42px rgba(35,46,81,.06)}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px}.eyebrow{color:#63718b;font-size:12px;font-weight:800;margin:0 0 5px}.title{font-size:25px;letter-spacing:-.04em;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0}.role{display:flex;gap:7px;flex:0 0 auto}.role button,.avatar button,.grade button,.mode button{border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;color:#45516a}.role button{padding:10px 14px;font-weight:800;white-space:nowrap}.role button.active,.avatar button.active,.grade button.active,.mode button.active{border-color:#aab6ff;background:var(--soft);color:#344bc7;box-shadow:0 0 0 2px rgba(70,102,255,.05)}.content{display:grid;grid-template-columns:250px 1fr;gap:22px;border-top:1px solid var(--line);padding-top:18px}.section h2{font-size:14px;margin:0 0 10px}.avatar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.avatar button{height:60px;font-size:27px}.photo{font-size:11px!important;font-weight:750}.tip{font-size:11px;line-height:1.5;color:var(--muted);margin:9px 0 0}.right{display:grid;gap:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:11px;color:#788398;font-weight:750;margin:0 0 5px}.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font:inherit;outline:none}.field input:focus{border-color:#9eabff;box-shadow:0 0 0 3px rgba(70,102,255,.06)}.grade{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.grade button{height:36px;font-size:12px;font-weight:750}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button{height:40px;font-weight:750}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.actions a,.actions button{height:42px;border-radius:12px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800;font-size:13px}.ghost{border:1px solid var(--line);background:#fff;color:#536079}.next{border:0;background:var(--brand);color:#fff;cursor:pointer;box-shadow:0 8px 18px rgba(70,102,255,.18)}@media(max-width:760px){.head{display:block}.role{margin-top:12px}.content{grid-template-columns:1fr}.avatar{grid-template-columns:repeat(6,1fr)}.fields{grid-template-columns:1fr}.grade{grid-template-columns:repeat(3,1fr)}.title{font-size:22px}}@media(max-width:520px){.card{padding:18px 15px}.avatar{grid-template-columns:repeat(3,1fr)}.role{display:grid;grid-template-columns:1fr 1fr}.role button{padding:10px 8px}.mode{grid-template-columns:1fr}.actions{justify-content:stretch}.actions a,.actions button{flex:1}}</style></head><body><header><a class="brand" href="./"><span class="mark">✦</span>생각자국AI</a></header><main class="wrap"><div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div><section class="card"><div class="head"><div><p class="eyebrow">나를 알려줘</p><h1 class="title">어떤 모습으로 공부할까?</h1><p class="sub">필요한 것만 간단히 정하면 바로 시작할 수 있어.</p></div><div class="role"><button class="active" data-role="student">학생</button><button data-role="parent">학부모</button></div></div><div class="content"><section class="section"><h2>내 캐릭터</h2><div class="avatar"><button class="active" data-avatar="👦">👦</button><button data-avatar="👧">👧</button><button data-avatar="🧑">🧑</button><button data-avatar="🧒">🧒</button><button data-avatar="🧑‍🦱">🧑‍🦱</button><button class="photo" type="button">＋ 사진</button></div><p class="tip">사진은 선택사항이야. 캐릭터만 골라도 충분해.</p></section><div class="right"><section class="section"><h2>기본 정보</h2><div class="fields"><div class="field"><label>이름 또는 닉네임</label><input id="name" value="민준" placeholder="어떻게 불러줄까?"></div><div class="field"><label>학교 또는 지역 · 선택</label><input placeholder="예: 창원"></div></div></section><section class="section"><h2>학년</h2><div class="grade"><button>초4</button><button>초5</button><button>초6</button><button>중1</button><button class="active">중2</button><button>중3</button><button>고1</button><button>고2</button><button>고3</button></div></section><section class="section"><h2>편한 학습 방식</h2><div class="mode"><button class="active">✍️ 글로 생각하기</button><button>🎤 말로 설명하기</button></div></section></div></div><div class="actions"><a class="ghost" href="./index.html">나중에</a><button class="next" id="finish">설정 완료</button></div></section></main><script>document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('.grade button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.grade button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('finish').onclick=()=>{const name=document.getElementById('name').value.trim()||'학생';const avatar=document.querySelector('[data-avatar].active')?.dataset.avatar||'👦';localStorage.setItem('ttai-profile',JSON.stringify({name,avatar}));location.href='./home.html'};</script></body></html>
