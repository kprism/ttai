<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각자국AI · 프로필 설정</title><style>:root{--bg:#f6f8fc;--panel:#fff;--text:#172033;--muted:#7a8498;--line:#e5e9f1;--brand:#4666ff;--soft:#eef1ff}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text)}header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;text-decoration:none;color:var(--text)}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#657dff,#384ed9);color:white}.wrap{width:min(920px,calc(100% - 32px));margin:34px auto 60px}.steps{display:flex;justify-content:center;gap:8px;margin-bottom:22px}.steps i{width:38px;height:6px;background:#e3e7ef;border-radius:99px}.steps i.on{background:var(--brand)}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 60px rgba(35,46,81,.08)}.eyebrow{color:#63718b;font-size:13px;font-weight:800;margin:0 0 8px}.title{font-size:30px;letter-spacing:-.04em;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 28px}.role{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}.role button,.avatar button,.grade button{border:1px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;color:#45516a}.role button{padding:18px;font-weight:800}.role button.active,.avatar button.active,.grade button.active{border-color:#aab6ff;background:var(--soft);color:#344bc7;box-shadow:0 0 0 3px rgba(70,102,255,.06)}.section{border-top:1px solid var(--line);padding-top:24px;margin-top:24px}.section h2{font-size:17px;margin:0 0 14px}.avatar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.avatar button{height:82px;font-size:34px}.photo{font-size:13px!important;font-weight:750}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:#788398;font-weight:750;margin:0 0 7px}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;outline:none}.field input:focus{border-color:#9eabff;box-shadow:0 0 0 4px rgba(70,102,255,.07)}.grade{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.grade button{height:44px;font-weight:750}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:30px}.actions a,.actions button{height:48px;border-radius:15px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800}.ghost{border:1px solid var(--line);background:#fff;color:#536079}.next{border:0;background:var(--brand);color:#fff;cursor:pointer;box-shadow:0 10px 24px rgba(70,102,255,.2)}@media(max-width:700px){.card{padding:24px 18px}.avatar{grid-template-columns:repeat(3,1fr)}.fields{grid-template-columns:1fr}.grade{grid-template-columns:repeat(3,1fr)}.title{font-size:25px}}</style></head><body><header><a class="brand" href="./"><span class="mark">✦</span>생각자국AI</a></header><main class="wrap"><div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div><section class="card"><p class="eyebrow">나를 알려줘</p><h1 class="title">생각자국AI에서 어떤 모습으로 공부할까?</h1><p class="sub">사진은 선택사항이야. 캐릭터만 골라도 충분해.</p><div class="role"><button class="active" data-role="student">학생으로 시작</button><button data-role="parent">학부모로 시작</button></div><div class="section"><h2>내 캐릭터</h2><div class="avatar"><button class="active" data-avatar="👦">👦</button><button data-avatar="👧">👧</button><button data-avatar="🧑">🧑</button><button data-avatar="🧒">🧒</button><button data-avatar="🧑‍🦱">🧑‍🦱</button><button class="photo" type="button">＋ 사진 사용</button></div></div><div class="section"><h2>기본 정보</h2><div class="fields"><div class="field"><label>이름 또는 닉네임</label><input id="name" value="민준" placeholder="어떻게 불러줄까?"></div><div class="field"><label>학교 또는 지역 · 선택</label><input placeholder="예: 창원"></div></div></div><div class="section"><h2>학년</h2><div class="grade"><button>초4</button><button>초5</button><button>초6</button><button>중1</button><button class="active">중2</button><button>중3</button><button>고1</button><button>고2</button><button>고3</button></div></div><div class="section"><h2>내가 편한 학습 방식</h2><div class="role"><button class="active">✍️ 글로 생각하기</button><button>🎤 말로 설명하기</button></div></div><div class="actions"><a class="ghost" href="./index.html">나중에</a><button class="next" id="finish">설정 완료</button></div></section></main><script>document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('.grade button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.grade button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('finish').onclick=()=>{const name=document.getElementById('name').value.trim()||'학생';const avatar=document.querySelector('[data-avatar].active')?.dataset.avatar||'👦';localStorage.setItem('ttai-profile',JSON.stringify({name,avatar}));location.href='./home.html'};</script></body></html>
