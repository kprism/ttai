<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각자국AI · 프로필 설정</title><style>:root{--bg:#f6f8fc;--panel:#fff;--text:#172033;--muted:#7a8498;--line:#e5e9f1;--brand:#4666ff;--soft:#eef1ff}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text)}header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}.brand{display:flex;align-items:center;gap:9px;font-weight:850;font-size:18px;text-decoration:none;color:var(--text)}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#657dff,#384ed9);color:#fff}.wrap{width:min(860px,calc(100% - 28px));margin:14px auto 24px}.steps{display:flex;justify-content:center;gap:6px;margin:0 0 10px}.steps i{width:28px;height:4px;background:#e3e7ef;border-radius:99px}.steps i.on{background:var(--brand)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:0 12px 36px rgba(35,46,81,.06)}.head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:14px}.eyebrow{color:#63718b;font-size:11px;font-weight:800;margin:0 0 4px}.title{font-size:24px;letter-spacing:-.04em;margin:0 0 3px}.sub{color:var(--muted);font-size:12px;margin:0}.content{display:grid;grid-template-columns:230px 1fr;gap:18px;border-top:1px solid var(--line);padding-top:16px}.section h2{font-size:13px;margin:0 0 9px}.avatar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.avatar button{height:56px;border:1px solid var(--line);background:#fff;border-radius:11px;cursor:pointer;color:#45516a;font-size:26px}.avatar button.active{border-color:#aab6ff;background:var(--soft);color:#344bc7;box-shadow:0 0 0 2px rgba(70,102,255,.05)}.photo{font-size:11px!important;font-weight:750}.tip{font-size:10px;line-height:1.45;color:var(--muted);margin:8px 0 0}.right{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:#788398;font-weight:750;margin:0 0 4px}.field input,.field select{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 11px;font:inherit;font-size:13px;outline:none;background:#fff;color:#263249}.field input:focus,.field select:focus{border-color:#9eabff;box-shadow:0 0 0 3px rgba(70,102,255,.06)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}.actions a,.actions button{height:40px;border-radius:11px;padding:0 17px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800;font-size:12px}.ghost{border:1px solid var(--line);background:#fff;color:#536079}.next{border:0;background:var(--brand);color:#fff;cursor:pointer;box-shadow:0 7px 16px rgba(70,102,255,.17)}@media(max-width:720px){.head{display:block}.content{grid-template-columns:1fr}.avatar{grid-template-columns:repeat(6,1fr)}.right{grid-template-columns:1fr 1fr}.title{font-size:21px}}@media(max-width:520px){.card{padding:17px 14px}.avatar{grid-template-columns:repeat(3,1fr)}.right{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{justify-content:stretch}.actions a,.actions button{flex:1}}</style></head><body><header><a class="brand" href="./"><span class="mark">✦</span>생각자국AI</a></header><main class="wrap"><div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div><section class="card"><div class="head"><div><p class="eyebrow">나를 알려줘</p><h1 class="title">어떤 모습으로 공부할까?</h1><p class="sub">필요한 것만 선택하면 바로 시작할 수 있어.</p></div></div><div class="content"><section class="section"><h2>내 캐릭터</h2><div class="avatar"><button class="active" data-avatar="👦">👦</button><button data-avatar="👧">👧</button><button data-avatar="🧑">🧑</button><button data-avatar="🧒">🧒</button><button data-avatar="🧑‍🦱">🧑‍🦱</button><button class="photo" type="button">＋ 사진</button></div><p class="tip">사진은 선택사항이야. 캐릭터만 골라도 충분해.</p></section><section class="right"><div class="field"><label>이용 유형</label><select id="role"><option value="student">학생</option><option value="parent">학부모</option></select></div><div class="field"><label>학년</label><select id="grade"><optgroup label="초등"><option>초4</option><option>초5</option><option>초6</option></optgroup><optgroup label="중등"><option>중1</option><option selected>중2</option><option>중3</option></optgroup><optgroup label="고등"><option>고1</option><option>고2</option><option>고3</option></optgroup></select></div><div class="field"><label>이름 또는 닉네임</label><input id="name" value="민준" placeholder="어떻게 불러줄까?"></div><div class="field"><label>학교 또는 지역 · 선택</label><input id="region" placeholder="예: 창원"></div><div class="field full"><label>주 학습 방식</label><select id="mode"><option value="write">✍️ 글로 생각하기</option><option value="voice">🎤 말로 설명하기</option><option value="mixed">✍️+🎤 둘 다 사용하기</option></select></div></section></div><div class="actions"><a class="ghost" href="./index.html">나중에</a><button class="next" id="finish">설정 완료</button></div></section></main><script>document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-avatar]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('finish').onclick=()=>{const name=document.getElementById('name').value.trim()||'사용자';const avatar=document.querySelector('[data-avatar].active')?.dataset.avatar||'👦';const role=document.getElementById('role').value;const grade=document.getElementById('grade').value;const region=document.getElementById('region').value.trim();const mode=document.getElementById('mode').value;localStorage.setItem('ttai-profile',JSON.stringify({name,avatar,role,grade,region,mode}));location.href=role==='parent'?'./parent.html':'./home.html'};</script></body></html>
