<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00288a">
  <title>대시보드 | 생각자국 AI</title>
  <link rel="stylesheet" href="./css/brand.css?v=20260803b">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10233f}body{background:radial-gradient(circle at 8% 8%,rgba(0,177,216,.12),transparent 28%),#f5f8fc}.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;padding:12px clamp(16px,4vw,52px);border-bottom:1px solid rgba(220,231,241,.9);background:rgba(255,255,255,.88);backdrop-filter:blur(18px)}.logo{width:210px}.user{display:flex;align-items:center;gap:11px}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:#eaf4ff;font-size:23px}.meta{text-align:right}.meta strong,.meta small{display:block}.meta small{margin-top:3px;color:#7b8b9e}.logout{padding:10px 13px;border:1px solid #dce7f1;border-radius:12px;background:#fff;color:#53657a;font-weight:750;cursor:pointer}.main{width:min(1440px,100%);margin:0 auto;padding:clamp(22px,4vw,52px)}.hero{position:relative;overflow:hidden;padding:clamp(27px,5vw,48px);border-radius:30px;color:#fff;background:linear-gradient(135deg,#02134d,#00288a 58%,#017bc5);box-shadow:0 12px 35px rgba(0,40,138,.12)}.hero:after{content:"";position:absolute;width:270px;height:270px;right:-80px;top:-100px;border-radius:50%;background:rgba(0,177,216,.22)}.hero>*{position:relative;z-index:1}.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;font-weight:800}.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:#78edff}.hero h1{margin:15px 0 10px;font-size:clamp(31px,5vw,52px);letter-spacing:-.055em}.hero p{max-width:760px;margin:0;color:rgba(255,255,255,.8);line-height:1.72}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.tags span{padding:9px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:750}.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:34px 0 16px}.sectionhead h2{margin:0;font-size:clamp(23px,3vw,32px);letter-spacing:-.04em}.sectionhead p{margin:6px 0 0;color:#53657a}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.service{padding:21px;border:1px solid #dce7f1;border-radius:22px;background:#fff;box-shadow:0 8px 24px rgba(16,35,63,.08)}.metric small{color:#7b8b9e}.metric strong{display:block;margin-top:8px;color:#00288a;font-size:28px;letter-spacing:-.04em}.metric span{display:block;margin-top:7px;color:#53657a;font-size:13px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.service{min-height:205px;transition:.18s}.service:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(0,40,138,.14)}.sicon{display:grid;place-items:center;width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#fff,#eaf4ff);box-shadow:8px 9px 18px rgba(0,40,138,.13),inset -5px -5px 9px rgba(0,40,138,.06);font-size:31px}.service h3{margin:18px 0 8px;font-size:20px}.service p{margin:0;color:#53657a;font-size:14px;line-height:1.62}.service footer{margin-top:17px;color:#017bc5;font-size:13px;font-weight:850}.help{position:fixed;right:20px;bottom:20px;z-index:40}.help button{width:58px;height:58px;border:0;border-radius:19px;color:#fff;background:linear-gradient(145deg,#017bc5,#00b1d8);box-shadow:0 15px 30px rgba(0,123,197,.28);font-size:23px;cursor:pointer}.helppanel{position:absolute;right:0;bottom:70px;width:min(360px,calc(100vw - 32px));padding:19px;border:1px solid #dce7f1;border-radius:20px;background:#fff;box-shadow:0 20px 50px rgba(16,35,63,.22)}.helppanel[hidden]{display:none}.helppanel h3{margin:0 0 8px}.helppanel p,.helppanel li{color:#53657a;font-size:14px;line-height:1.6}.helppanel ul{padding-left:20px;margin-bottom:0}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.services{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.header{padding:10px 14px}.logo{width:160px}.meta{display:none}.main{padding:18px 14px 90px}.metrics,.services{grid-template-columns:1fr}.hero{border-radius:24px}.sectionhead{align-items:flex-start;flex-direction:column}}@media(max-width:390px){.logo{width:145px}.logout{padding:9px 10px;font-size:13px}}
  </style>
</head>
<body>
  <header class="header"><a href="./login.html"><img class="logo" src="./assets/images/brand/saenggakjaguk-ai-logo.png" alt="생각자국 AI"></a><div class="user"><div class="avatar" id="avatar"></div><div class="meta"><strong id="userName"></strong><small id="roleName"></small></div><button class="logout" id="logoutBtn">로그아웃</button></div></header>
  <main class="main">
    <section class="hero"><span class="badge">프로토타입 시연 모드</span><h1 id="heroTitle"></h1><p id="heroDesc"></p><div class="tags" id="heroTags"></div></section>
    <section><header class="sectionhead"><div><h2>오늘의 핵심 현황</h2><p>로그인 역할에 따라 볼 수 있는 정보가 달라집니다.</p></div></header><div class="metrics" id="metrics"></div></section>
    <section><header class="sectionhead"><div><h2>생각자국 AI 6개 서비스</h2><p>각 서비스는 하나의 학생 성장데이터를 공유합니다.</p></div></header><div class="services" id="services"></div></section>
  </main>
  <div class="help"><section class="helppanel" id="helpPanel" hidden><h3 id="helpTitle"></h3><p>현재 수치는 시연을 위해 준비된 예시 데이터입니다.</p><ul><li>역할에 따라 대시보드 정보가 달라집니다.</li><li>학생은 학년에 맞는 안내 문장으로 진입합니다.</li><li>다음 단계에서 생각스튜디오의 클릭형 학습 시나리오를 연결합니다.</li></ul></section><button id="helpBtn">?</button></div>
  <script>
    const params=new URLSearchParams(location.search);let session;try{session=JSON.parse(localStorage.getItem("ttai_demo_session"))}catch(e){}if(!session){location.href="./login.html"}
    const gradeGreeting={e1:"오늘은 무엇이 궁금해? 놀이처럼 하나씩 해보자!",e2:"모르는 건 부끄러운 게 아니야. 오늘도 한 걸음 자라보자!",e3:"네 생각에는 멋진 단서가 숨어 있어. 같이 찾아보자!",e4:"정답보다 생각한 과정이 더 중요해. 오늘의 단서를 찾아보자!",e5:"배운 내용을 다른 문제에도 쓸 수 있는지 확인해보자.",e6:"중학교로 이어질 튼튼한 생각의 기초를 만들어보자.",m1:"규칙을 외우는 데서 멈추지 말고 왜 그런지 이해해보자.",m2:"틀린 답은 실패가 아니라 다음 성장을 알려주는 자료야.",m3:"고등 학습으로 이어질 자기주도 학습방법을 만들어보자.",h1:"정답보다 재사용할 수 있는 사고방법을 남겨보세요.",h2:"문제의 겉모습이 아니라 내부 구조를 읽는 힘을 길러보세요.",h3:"입시 이후에도 남는 학습전략과 사고력을 완성해보세요."};
    const configs={
      student:{avatar:"🧑‍🎓",name:`${session.grade.toUpperCase()} 학생 데모`,title:gradeGreeting[session.grade],desc:"학습, 질문, 교사 피드백, 진로와 프로젝트가 하나의 성장 흐름으로 이어집니다.",tags:["학년 맞춤 안내","교과 자동분류","성장과정 기록"],metrics:[["오늘의 목표","2개","내가 직접 정한 학습목표"],["이어갈 생각","4개","지난 활동에서 남은 질문"],["교사 피드백","3개","확인할 새로운 피드백"],["성장기록","18개","이번 학기에 쌓인 변화"]]},
      teacher:{avatar:"👩‍🏫",name:"김생각 선생님",title:"학생의 답보다 생각의 변화를 살펴봅니다",desc:"AI 초안을 검토하고 학생별 피드백과 수업 지원자료를 준비합니다.",tags:["AI 초안은 교사 검토","학급 변화","업무시간 절감"],metrics:[["담당 학생","126명","4개 학급"],["피드백 대기","14건","오늘 확인할 활동"],["도움 필요","7명","반복 오개념 감지"],["이번 주 절감","3.8시간","요약·자료작성 기준"]]},
      parent:{avatar:"👨‍👩‍👧",name:"이성장 학부모",title:"점수가 아니라 자녀의 변화를 함께 봅니다",desc:"최근 관심, 도전, 교사 피드백과 가정에서 도울 수 있는 방법을 확인합니다.",tags:["비교 없는 리포트","가정 대화","교사 확인 정보"],metrics:[["새 성장소식","4개","이번 주 변화"],["함께할 질문","3개","자녀와 나눌 대화"],["진행 프로젝트","1개","통학로 안전 탐구"],["다음 목표","2개","자녀가 직접 설정"]]},
      school:{avatar:"🏫",name:"박미래 관리자",title:"학교 전체의 사용과 성장을 한눈에 봅니다",desc:"학급별 참여, 교사 활용, 동의 현황과 프로젝트 운영을 관리합니다.",tags:["학교 통합관리","권한·동의","활용현황"],metrics:[["활성 학생","583명","전체의 87%"],["활성 교사","42명","전체의 91%"],["진행 프로젝트","12개","학급·동아리 포함"],["지원 요청","3건","처리 대기"]]},
      district:{avatar:"🗺️",name:"최지원 담당자",title:"지역의 초·중학교 성장을 연결합니다",desc:"관할 학교의 도입, 활용, 교사업무 개선과 지역 퀘스트를 운영합니다.",tags:["지역 통합","초·중 연계","로컬퀘스트"],metrics:[["참여 학교","38교","초 24 · 중 14"],["활성 학생","18,420명","월간 기준"],["교사 업무개선","18%","자료작성 시간"],["지역 퀘스트","27개","진행·완료 포함"]]},
      province:{avatar:"🏛️",name:"정정책 담당자",title:"초·중·고를 잇는 도 단위 교육정책을 봅니다",desc:"교육지원청별 활용성과, AI 안전, 예산과 장기 성장지표를 확인합니다.",tags:["도 단위 통합","정책성과","AI 안전·보안"],metrics:[["참여 지원청","6곳","단계적 확산"],["활성 학생","104,379명","초·중·고 합계"],["서비스 가동률","99.8%","최근 30일"],["보안 이상","0건","중대사고 기준"]]},
      admin:{avatar:"⚙️",name:"생각자국 운영자",title:"전체 기관과 AI 정책을 안전하게 운영합니다",desc:"회원기관, 서비스 상태, 접근권한과 프로토타입 시나리오를 관리합니다.",tags:["멀티테넌트","감사로그","AI 정책"],metrics:[["회원기관","47곳","시연 데이터"],["전체 계정","124,860개","학생·교직원"],["AI 시나리오","36개","학년·교과별"],["서비스 상태","정상","전체 모듈"]]}
    };
    const role=params.get("role")||session.role||"student";const c=configs[role]||configs.student;document.getElementById("avatar").textContent=c.avatar;document.getElementById("userName").textContent=c.name;document.getElementById("roleName").textContent=session.roleName||role;document.getElementById("heroTitle").textContent=c.title;document.getElementById("heroDesc").textContent=c.desc;document.getElementById("heroTags").innerHTML=c.tags.map(x=>`<span>${x}</span>`).join("");document.getElementById("metrics").innerHTML=c.metrics.map(x=>`<article class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></article>`).join("");
    const services=[["💡","생각스튜디오","과목을 먼저 고르지 않아도 질문을 분석해 학년과 학습 흐름에 맞춰 시작합니다."],["🧭","성장나침반","점수가 아니라 질문, 수정, 설명과 재도전의 변화를 장기간 연결합니다."],["🚀","진로성장 AI","검사 한 번이 아니라 실제 학습과 프로젝트 경험으로 진로가설을 발전시킵니다."],["📍","로컬퀘스트","학교와 지역의 실제 문제를 조사하고 협력해 해결안을 만드는 활동입니다."],["🧑‍🏫","교사 코파일럿","학생 활동을 요약하고 교사가 검토할 피드백 초안과 상담자료를 준비합니다."],["💞","학부모 성장리포트","자녀를 다른 학생과 비교하지 않고 과거와 현재의 변화를 함께 확인합니다."]];document.getElementById("services").innerHTML=services.map(x=>`<article class="service"><div class="sicon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><footer>다음 단계에서 실제 기능 연결 →</footer></article>`).join("");
    document.getElementById("helpTitle").textContent=(session.roleName||"역할")+" 화면 안내";document.getElementById("logoutBtn").onclick=()=>{localStorage.removeItem("ttai_demo_session");location.href="./login.html"};document.getElementById("helpBtn").onclick=()=>{const p=document.getElementById("helpPanel");p.hidden=!p.hidden;document.getElementById("helpBtn").textContent=p.hidden?"?":"×"};
  </script>
</body>
</html>
