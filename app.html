<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>대시보드 | 생각자국 AI</title>
  <link rel="stylesheet" href="./css/brand.css?v=20260803c">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10233f}button{font:inherit;cursor:pointer}body{background:radial-gradient(circle at 8% 8%,rgba(0,177,216,.12),transparent 28%),#f5f8fc}.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;padding:12px clamp(16px,4vw,52px);border-bottom:1px solid rgba(220,231,241,.9);background:rgba(255,255,255,.88);backdrop-filter:blur(18px)}.logo{width:210px}.user{display:flex;align-items:center;gap:11px}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#fff,#eaf4ff);box-shadow:5px 7px 13px rgba(0,40,138,.1);font-size:23px}.meta{text-align:right}.meta strong,.meta small{display:block}.meta small{margin-top:3px;color:#7b8b9e}.logout{padding:10px 13px;border:1px solid #dce7f1;border-radius:12px;background:#fff;color:#53657a;font-weight:750}.main{width:min(1440px,100%);margin:0 auto;padding:clamp(22px,4vw,52px)}.hero{position:relative;overflow:hidden;padding:clamp(27px,5vw,48px);border-radius:30px;color:#fff;background:linear-gradient(135deg,#02134d,#00288a 58%,#017bc5);box-shadow:0 12px 35px rgba(0,40,138,.12)}.hero:after{content:"";position:absolute;width:270px;height:270px;right:-80px;top:-100px;border-radius:50%;background:rgba(0,177,216,.22)}.hero>*{position:relative;z-index:1}.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;font-weight:800}.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:#78edff}.hero h1{margin:15px 0 10px;font-size:clamp(31px,5vw,52px);letter-spacing:-.055em}.hero p{max-width:760px;margin:0;color:rgba(255,255,255,.8);line-height:1.72}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.tags span{padding:9px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:750}.hero-action{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:13px 17px;border-radius:15px;color:#00288a;background:#fff;text-decoration:none;font-weight:900;box-shadow:0 12px 24px rgba(0,0,0,.15)}.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:34px 0 16px}.sectionhead h2{margin:0;font-size:clamp(23px,3vw,32px);letter-spacing:-.04em}.sectionhead p{margin:6px 0 0;color:#53657a}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.service{padding:21px;border:1px solid #dce7f1;border-radius:22px;background:#fff;box-shadow:0 8px 24px rgba(16,35,63,.08)}.metric small{color:#7b8b9e}.metric strong{display:block;margin-top:8px;color:#00288a;font-size:28px;letter-spacing:-.04em}.metric span{display:block;margin-top:7px;color:#53657a;font-size:13px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.service{position:relative;min-height:225px;transition:.18s}.service.active{cursor:pointer}.service.active:hover{transform:translateY(-4px);border-color:rgba(1,123,197,.38);box-shadow:0 18px 36px rgba(0,40,138,.14)}.service.disabled{opacity:.72}.sicon{display:grid;place-items:center;width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#fff,#eaf4ff);box-shadow:8px 9px 18px rgba(0,40,138,.13),inset -5px -5px 9px rgba(0,40,138,.06);font-size:31px}.service h3{margin:18px 0 8px;font-size:20px}.service p{margin:0;color:#53657a;font-size:14px;line-height:1.62}.service footer{margin-top:17px;color:#017bc5;font-size:13px;font-weight:850}.service-state{position:absolute;right:15px;top:15px;padding:6px 8px;border-radius:999px;color:#53657a;background:#f0f4f8;font-size:10px;font-weight:900}.service.active .service-state{color:#006a85;background:#e9fbff}.help{position:fixed;right:20px;bottom:20px;z-index:40}.help button{width:58px;height:58px;border:0;border-radius:19px;color:#fff;background:linear-gradient(145deg,#017bc5,#00b1d8);box-shadow:0 15px 30px rgba(0,123,197,.28);font-size:23px}.helppanel{position:absolute;right:0;bottom:70px;width:min(360px,calc(100vw - 32px));padding:19px;border:1px solid #dce7f1;border-radius:20px;background:#fff;box-shadow:0 20px 50px rgba(16,35,63,.22)}.helppanel[hidden]{display:none}.helppanel h3{margin:0 0 8px}.helppanel p,.helppanel li{color:#53657a;font-size:14px;line-height:1.6}.helppanel ul{padding-left:20px;margin-bottom:0}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.services{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.header{padding:10px 14px}.logo{width:160px}.meta{display:none}.main{padding:18px 14px 90px}.metrics,.services{grid-template-columns:1fr}.hero{border-radius:24px}.sectionhead{align-items:flex-start;flex-direction:column}}@media(max-width:390px){.logo{width:145px}.logout{padding:9px 10px;font-size:13px}}
  </style>
</head>
<body>
  <header class="header">
    <a href="./login.html"><img class="logo" src="./assets/images/brand/saenggakjaguk-ai-logo.png" alt="생각자국 AI"></a>
    <div class="user"><div class="avatar" id="avatar"></div><div class="meta"><strong id="userName"></strong><small id="roleName"></small></div><button class="logout" id="logoutBtn">로그아웃</button></div>
  </header>

  <main class="main">
    <section class="hero">
      <span class="badge">프로토타입 시연 모드</span>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
      <div class="tags" id="heroTags"></div>
      <a class="hero-action" id="thinkStudioCta" href="./services/think-studio.html">💡 생각스튜디오 시연 시작 →</a>
    </section>

    <section>
      <header class="sectionhead"><div><h2>오늘의 핵심 현황</h2><p>로그인 역할에 따라 볼 수 있는 정보가 달라집니다.</p></div></header>
      <div class="metrics" id="metrics"></div>
    </section>

    <section>
      <header class="sectionhead"><div><h2>생각자국 AI 6개 서비스</h2><p>첫 번째 생각스튜디오부터 실제 클릭형 시연이 가능합니다.</p></div></header>
      <div class="services" id="services"></div>
    </section>
  </main>

  <div class="help">
    <section class="helppanel" id="helpPanel" hidden>
      <h3 id="helpTitle">역할별 대시보드 안내</h3>
      <p>현재 수치는 시연을 위해 준비된 예시 데이터입니다.</p>
      <ul><li>역할에 따라 대시보드 정보가 달라집니다.</li><li>생각스튜디오는 학년별 안내와 분기형 학습 흐름이 작동합니다.</li><li>나머지 5개 서비스는 다음 단계에서 순서대로 연결합니다.</li></ul>
    </section>
    <button id="helpBtn" aria-label="화면 설명">?</button>
  </div>

  <script>
    (()=>{
      "use strict";
      let session=null;try{session=JSON.parse(localStorage.getItem("ttai_demo_session"))}catch(error){session=null}if(!session){location.href="./login.html";return}
      const gradeGreeting={e1:"오늘은 무엇이 궁금해? 놀이처럼 하나씩 해보자!",e2:"모르는 것은 부끄러운 게 아니야. 오늘도 한 걸음 자라보자!",e3:"네 생각에는 멋진 단서가 숨어 있어. 같이 찾아보자!",e4:"정답보다 생각한 과정이 더 중요해. 오늘의 단서를 찾아보자!",e5:"배운 내용을 다른 문제에도 쓸 수 있는지 확인해보자.",e6:"중학교로 이어질 튼튼한 생각의 기초를 만들어보자.",m1:"규칙을 외우는 데서 멈추지 말고 왜 그런지 이해해보자.",m2:"틀린 답은 실패가 아니라 다음 성장을 알려주는 자료야.",m3:"고등 학습으로 이어질 자기주도 학습방법을 만들어보자.",h1:"정답보다 재사용할 수 있는 사고방법을 남겨보세요.",h2:"문제의 겉모습이 아니라 내부 구조를 읽는 힘을 길러보세요.",h3:"입시 이후에도 남는 학습전략과 사고력을 완성해보세요."};
      const roleNames={student:"학생",teacher:"선생님",parent:"학부모",school:"학교 관리자",district:"교육지원청 담당자",province:"시·도교육청 담당자",admin:"플랫폼 관리자"};
      const configs={
        student:{avatar:"🧑‍🎓",name:`${(session.grade||"m2").toUpperCase()} 학생 데모`,title:gradeGreeting[session.grade]||gradeGreeting.m2,desc:"학습, 질문, 교사 피드백, 진로와 프로젝트가 하나의 성장 흐름으로 이어집니다.",tags:["학년 맞춤 안내","과목 자동 연결","성장과정 기록"],metrics:[["오늘의 목표","2개","내가 직접 정한 학습목표"],["이어갈 생각","4개","지난 활동에서 남은 질문"],["교사 피드백","3개","확인할 새로운 피드백"],["성장기록","18개","이번 학기에 쌓인 변화"]]},
        teacher:{avatar:"👩‍🏫",name:"김생각 선생님",title:"학생의 답보다 생각의 변화를 살펴봅니다",desc:"AI 초안을 검토하고 학생별 피드백과 수업 지원자료를 준비합니다.",tags:["AI 초안 교사 검토","학급 변화","업무시간 절감"],metrics:[["담당 학생","126명","4개 학급"],["피드백 대기","14건","오늘 확인할 활동"],["도움 필요","7명","반복 오개념 감지"],["이번 주 절감","3.8시간","요약·자료작성 기준"]]},
        parent:{avatar:"👨‍👩‍👧",name:"이성장 학부모",title:"점수가 아니라 자녀의 변화를 함께 봅니다",desc:"최근 관심, 도전, 교사 피드백과 가정에서 도울 수 있는 방법을 확인합니다.",tags:["비교 없는 리포트","가정 대화","교사 확인 정보"],metrics:[["새 성장소식","4개","이번 주 변화"],["함께할 질문","3개","자녀와 나눌 대화"],["진행 프로젝트","1개","통학로 안전 탐구"],["다음 목표","2개","자녀가 직접 설정"]]},
        school:{avatar:"🏫",name:"박미래 관리자",title:"학교 전체의 사용과 성장을 한눈에 봅니다",desc:"학급별 참여, 교사 활용, 동의 현황과 프로젝트 운영을 관리합니다.",tags:["학교 통합관리","권한·동의","활용현황"],metrics:[["활성 학생","583명","전체의 87%"],["활성 교사","42명","전체의 91%"],["진행 프로젝트","12개","학급·동아리 포함"],["지원 요청","3건","처리 대기"]]},
        district:{avatar:"🗺️",name:"최지원 담당자",title:"지역의 초·중학교 성장을 연결합니다",desc:"관할 학교의 도입, 활용, 교사업무 개선과 지역 퀘스트를 운영합니다.",tags:["지역 통합","초·중 연계","로컬퀘스트"],metrics:[["참여 학교","38교","초 24 · 중 14"],["활성 학생","18,420명","월간 기준"],["교사 업무개선","18%","자료작성 시간"],["지역 퀘스트","27개","진행·완료 포함"]]},
        province:{avatar:"🏛️",name:"정정책 담당자",title:"초·중·고를 잇는 도 단위 교육정책을 봅니다",desc:"교육지원청별 활용성과, AI 안전, 예산과 장기 성장지표를 확인합니다.",tags:["도 단위 통합","정책성과","AI 안전·보안"],metrics:[["참여 지원청","6곳","단계적 확산"],["활성 학생","104,379명","초·중·고 합계"],["서비스 가동률","99.8%","최근 30일"],["보안 이상","0건","중대사고 기준"]]},
        admin:{avatar:"⚙️",name:"생각자국 운영자",title:"전체 기관과 AI 정책을 안전하게 운영합니다",desc:"회원기관, 서비스 상태, 접근권한과 프로토타입 시나리오를 관리합니다.",tags:["멀티테넌트","감사로그","AI 정책"],metrics:[["회원기관","6곳","교육지원청 기준"],["등록 사용자","104,962명","학생·교사·관리자"],["AI 시나리오","5개","현재 시연 가능"],["시스템 상태","정상","중대장애 없음"]]}
      };
      const serviceItems=[
        {icon:"💡",title:"생각스튜디오",desc:"학습 질문, 오답 진단, 단계별 힌트, 자기설명과 새 문제 적용을 지원합니다.",state:"시연 가능",href:"./services/think-studio.html",active:true},
        {icon:"🧭",title:"성장나침반",desc:"학생의 질문·도전·피드백·성찰이 어떻게 달라졌는지 장기 변화로 보여줍니다.",state:"다음 단계"},
        {icon:"🚀",title:"진로성장 AI",desc:"검사 한 번이 아니라 실제 활동과 관심 변화를 바탕으로 진로가설을 만들어갑니다.",state:"다음 단계"},
        {icon:"🗺️",title:"로컬퀘스트",desc:"학교와 지역의 실제 문제를 조사하고 협력해 해결안으로 만드는 프로젝트 공간입니다.",state:"준비 중"},
        {icon:"🧑‍🏫",title:"교사 코파일럿",desc:"학생 활동요약과 피드백 초안을 제공하되 최종 판단은 교사가 수행합니다.",state:"준비 중"},
        {icon:"💚",title:"학부모 성장리포트",desc:"점수 비교가 아닌 자녀의 관심·도전·변화와 가정의 지원방법을 안내합니다.",state:"준비 중"}
      ];
      const config=configs[session.role]||configs.student;
      document.getElementById("avatar").textContent=config.avatar;document.getElementById("userName").textContent=config.name;document.getElementById("roleName").textContent=roleNames[session.role]||"학생";document.getElementById("heroTitle").textContent=config.title;document.getElementById("heroDesc").textContent=config.desc;document.getElementById("heroTags").innerHTML=config.tags.map(tag=>`<span>${tag}</span>`).join("");document.getElementById("metrics").innerHTML=config.metrics.map(item=>`<article class="metric"><small>${item[0]}</small><strong>${item[1]}</strong><span>${item[2]}</span></article>`).join("");
      const services=document.getElementById("services");serviceItems.forEach(item=>{const card=document.createElement(item.active?"a":"article");card.className=`service ${item.active?"active":"disabled"}`;if(item.active){card.href=item.href;card.style.textDecoration="none";card.style.color="inherit"}card.innerHTML=`<span class="service-state">${item.state}</span><div class="sicon">${item.icon}</div><h3>${item.title}</h3><p>${item.desc}</p><footer>${item.active?"클릭하여 시연 시작 →":"기능 구조 설계 완료"}</footer>`;services.appendChild(card)});
      if(session.role!=="student"){document.getElementById("thinkStudioCta").innerHTML="💡 학생 생각스튜디오 미리보기 →"}
      document.getElementById("logoutBtn").addEventListener("click",()=>{localStorage.removeItem("ttai_demo_session");location.href="./login.html"});const helpBtn=document.getElementById("helpBtn"),helpPanel=document.getElementById("helpPanel");helpBtn.addEventListener("click",()=>{helpPanel.hidden=!helpPanel.hidden});document.addEventListener("click",event=>{if(!helpPanel.hidden&&!event.target.closest(".help"))helpPanel.hidden=true});
    })();
  </script>
</body>
</html>
