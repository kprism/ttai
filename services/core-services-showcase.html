<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각자국 AI 핵심 서비스 시연</title><style>:root{--n:#072c84;--b:#0b79c9;--c:#10b8d7;--ink:#102641;--muted:#62758b;--line:#d8e4ee;--bg:#eef5fa;--red:#ef3f4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif}.top{padding:18px 22px;color:#fff;background:linear-gradient(135deg,#061d67,#0752b5,#1690d2)}.top small{font-weight:850}.top h1{margin:5px 0 4px;font-size:clamp(25px,3.2vw,40px)}.top p{margin:0;color:#e8f4ff;line-height:1.55}.viewer{padding:14px}.stage{position:relative;width:min(1400px,100%);height:min(76vh,820px);margin:auto;border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 16px 48px #0a27551b}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;pointer-events:none}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,28,87,.04),transparent 24%,transparent 72%,rgba(2,25,75,.09))}.intro{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(135deg,rgba(3,25,85,.88),rgba(11,112,195,.77));transition:.55s}.intro.hide{opacity:0;visibility:hidden}.introBox{max-width:760px;padding:28px 34px;text-align:center;color:#fff}.introBox b{display:block;font-size:clamp(32px,5vw,60px);letter-spacing:-.04em}.introBox p{font-size:17px;line-height:1.7;color:#eaf5ff}.hot{position:absolute;z-index:14;width:28px;height:28px;border:4px solid #fff;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(239,63,74,.3);transform:translate(-50%,-50%);cursor:pointer;opacity:0;transition:opacity .35s,transform .2s}.ready .hot{opacity:1;animation:pulse 1.8s ease-out infinite}.hot:hover{transform:translate(-50%,-50%) scale(1.18)}.hot.active{animation:none;box-shadow:0 0 0 7px rgba(239,63,74,.22)}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,63,74,.52)}70%{box-shadow:0 0 0 15px rgba(239,63,74,0)}100%{box-shadow:0 0 0 0 rgba(239,63,74,0)}}.bubble{position:absolute;z-index:17;width:min(360px,38vw);padding:15px 17px;border-radius:16px;background:#fff;border:2px solid #ff9299;box-shadow:0 14px 34px #071d422b;opacity:0;transform:translateY(10px) scale(.97);transition:.35s;pointer-events:none}.bubble.show{opacity:1;transform:none}.bubble strong{display:block;color:#c92935;font-size:16px;margin-bottom:6px}.bubble span{display:block;color:#43586f;font-size:13px;line-height:1.62}.leader{position:absolute;z-index:16;height:3px;background:linear-gradient(90deg,var(--red),#ff9a9f);transform-origin:0 50%;width:0;border-radius:99px;transition:width .45s ease}.toolbar{width:min(1400px,100%);margin:10px auto 0;display:flex;justify-content:space-between;gap:9px;align-items:center;flex-wrap:wrap}.toolbar .title{font-weight:950;color:var(--n)}.toolbar .hint{color:var(--muted);font-size:12px}.toolbar button{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,var(--n),var(--b))}.ghost{background:#fff;color:#50647a;border:1px solid var(--line)!important}@media(max-width:800px){.stage{height:72vh}.bubble{width:62vw}.introBox{padding:22px}.toolbar{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><small>05 · 생각자국의 실체</small><h1 id="pageTitle">핵심 서비스 시연</h1><p id="pageDesc">실제 서비스 화면에서 핵심 기능만 짚어봅니다.</p></header><main class="viewer"><div class="stage" id="stage"><iframe id="screen" loading="eager"></iframe><div class="shade"></div><div class="intro" id="intro"><div class="introBox"><b id="introTitle"></b><p id="introDesc"></p></div></div><div class="bubble" id="bubble"><strong id="bubbleTitle"></strong><span id="bubbleText"></span></div><div class="leader" id="leader"></div></div><div class="toolbar"><div><div class="title" id="serviceNo"></div><div class="hint">빨간 원을 클릭하면 핵심 설명이 연결선과 함께 나타납니다.</div></div><div><button class="ghost" id="replay">소개 다시보기</button> <button class="primary" id="nextPoint">다음 포인트 ▶</button></div></div></main><script>const qs=new URLSearchParams(location.search);const key=qs.get('service')||'question';const services={question:{name:'질문학교',desc:'소크라테스식 질문법을 자연스럽게 익히며, 학생이 개념의 경계를 스스로 다듬고 다시 세우는 질문 훈련 서비스입니다.',url:'socratic-question-school.html',points:[{x:23,y:39,bx:8,by:58,t:'질문의 순서를 훈련합니다',d:'개념 말해보기 → 근거 확인 → 모순·예외 찾기 → 개념 다시 세우기의 흐름을 반복합니다.'},{x:75,y:45,bx:53,by:65,t:'AI는 바로 답하지 않고 다시 묻습니다',d:'학생이 “무조건”이라고 말하면 예외가 없는지 되묻고, 스스로 개념의 범위를 확인하게 합니다.'},{x:64,y:88,bx:52,by:57,t:'막혀도 정답 대신 질문 힌트',d:'학생이 멈췄을 때 정답을 노출하기보다 다음에 무엇을 생각해야 하는지 방향만 제공합니다.'}]},studio:{name:'생각스튜디오',desc:'학생의 질문 하나를 여러 교과와 연결하고, 막힌 지점과 오개념을 역질문으로 확인하는 융합형 AI 학습 공간입니다.',url:'scenario-demo.html?v=20260811&type=electric',points:[{x:18,y:46,bx:31,by:57,t:'한 질문을 여러 교과 교육과정과 연결',d:'과학·사회·윤리·수학·국어처럼 연결 가능한 교과를 찾고, 교육부·교육청의 해당 과목 성취기준과 매핑합니다. 하나의 질문을 해결하면서 여러 교과의 관련 교육과정을 함께 경험하도록 설계합니다.'},{x:70,y:46,bx:48,by:68,t:'학생의 답에서 막힌 지점을 진단',d:'정오답만 보지 않고 “왜 그렇게 생각했는가”를 묻습니다. 학생이 놓친 기준과 오개념을 찾아 다음 역질문을 바꿉니다.'},{x:78,y:82,bx:47,by:56,t:'융합학습 결과를 교과 이수현황에 반영',d:'대화·과제 결과가 성취기준의 증거 조건을 충족하면 관련 교과별 교육과정 이수현황에 일부 반영합니다. 한 질문의 해결이 여러 교과 성장기록으로 연결됩니다.'}]},growth:{name:'성장·성취',desc:'학교 성취정보와 질문력·학습흥미 같은 사고·태도 변화를 함께 보고, 학생별 난이도 조정까지 연결합니다.',url:'growth-compass.html',points:[{x:25,y:48,bx:37,by:58,t:'성적과 사고의 변화를 함께 봅니다',d:'국어·수학·과학 성취와 질문력·학습흥미 변화를 한 화면에서 확인합니다.'},{x:74,y:43,bx:48,by:58,t:'학생별 난이도 조정 제안',d:'최근 정답률, 질문력, 힌트 의존도 등을 함께 보고 상향·하향 조정이 필요한 학생을 찾아냅니다.'},{x:76,y:69,bx:48,by:52,t:'교사가 최종 처리합니다',d:'AI가 권고하더라도 교사가 확인하고 난이도 변경을 실제 적용하는 통제 구조를 유지합니다.'}]},career:{name:'진로성장 AI',desc:'한 번의 적성검사가 아니라 학생이 실제로 해온 학습·질문·프로젝트 활동에서 반복되는 진로역량의 단서를 찾습니다.',url:'career-growth-ai.html',points:[{x:21,y:49,bx:32,by:62,t:'실제 활동에서 진로역량을 추출',d:'자료분석·수리논리·탐구질문·소통협력 등 학생 행동에서 반복적으로 나타난 역량 신호를 누적합니다.'},{x:62,y:49,bx:57,by:66,t:'왜 그런 진로 단서가 나왔는지 근거를 제시',d:'생각스튜디오·로컬퀘스트 등 실제 활동을 연결해 “어떤 행동 때문에 이 역량을 보았는지”를 설명합니다.'}]},quest:{name:'로컬퀘스트',desc:'학교와 지역의 실제 문제를 팀 프로젝트로 해결하며 조사·협업·대안제시·기관연결까지 경험하는 실천형 학습 서비스입니다.',url:'local-quest.html',points:[{x:35,y:48,bx:31,by:63,t:'문제 발견부터 반영결과까지 한 흐름',d:'문제 바라보기 → 원인 찾기 → 조사 설계 → 대안 만들기 → 기관 연결 → 결과 확인까지 프로젝트 전 과정을 관리합니다.'},{x:72,y:47,bx:48,by:64,t:'역할과 협업도 성장기록이 됩니다',d:'팀장·현장조사·인터뷰·자료정리처럼 실제 역할을 맡고, 팀 화상회의와 협업 과정까지 학습 근거로 남깁니다.'},{x:35,y:72,bx:45,by:54,t:'진행단계를 눈으로 확인',d:'현재 단계와 진행률이 표시되어 학생과 교사가 다음 행동을 바로 확인할 수 있습니다.'}]},teacher:{name:'선생님 지원',desc:'난이도 조정, 프로젝트 승인, 수행평가, 학부모 공유와 학급통지까지 교사가 처리할 일을 한곳에 모은 업무 코파일럿입니다.',url:'teacher-tasks.html',points:[{x:50,y:44,bx:34,by:61,t:'오늘 처리할 일을 한 화면에',d:'난이도 조정·프로젝트 승인·수행평가·성장리포트·학급통지를 업무 우선순위에 따라 모아줍니다.'},{x:84,y:43,bx:51,by:59,t:'알림이 아니라 실제 처리 화면으로 연결',d:'각 “처리하기” 버튼은 해당 학생·과제·프로젝트·리포트의 실제 처리화면으로 바로 이어집니다.'},{x:48,y:80,bx:34,by:54,t:'AI 추천 위에 교사의 최종 판단',d:'학생 상태를 AI가 먼저 정리하되, 승인·수정·반려와 학부모 공유의 최종 결정권은 교사에게 둡니다.'}]}};const s=services[key]||services.question;const stage=document.getElementById('stage'),screen=document.getElementById('screen'),intro=document.getElementById('intro'),bubble=document.getElementById('bubble'),leader=document.getElementById('leader');pageTitle.textContent=s.name;pageDesc.textContent=s.desc;introTitle.textContent=s.name;introDesc.textContent=s.desc;serviceNo.textContent='핵심 포인트 '+s.points.length+'개';screen.src=s.url;let active=-1;const dots=[];s.points.forEach((p,i)=>{const d=document.createElement('button');d.className='hot';d.style.left=p.x+'%';d.style.top=p.y+'%';d.setAttribute('aria-label',p.t);d.onclick=()=>show(i);stage.appendChild(d);dots.push(d)});function introRun(){stage.classList.remove('ready');intro.classList.remove('hide');bubble.classList.remove('show');leader.style.width='0';dots.forEach(x=>x.classList.remove('active'));active=-1;setTimeout(()=>{intro.classList.add('hide');setTimeout(()=>stage.classList.add('ready'),250)},1650)}function show(i){active=i;const p=s.points[i];dots.forEach((x,j)=>x.classList.toggle('active',j===i));bubbleTitle.textContent=p.t;bubbleText.textContent=p.d;bubble.style.left=p.bx+'%';bubble.style.top=p.by+'%';bubble.classList.add('show');requestAnimationFrame(()=>{const sr=stage.getBoundingClientRect(),hr=dots[i].getBoundingClientRect(),br=bubble.getBoundingClientRect();const x1=hr.left+hr.width/2-sr.left,y1=hr.top+hr.height/2-sr.top,x2=br.left+br.width/2-sr.left,y2=br.top+Math.min(br.height/2,34)-sr.top,dx=x2-x1,dy=y2-y1,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;leader.style.left=x1+'px';leader.style.top=y1+'px';leader.style.transform='rotate('+ang+'deg)';leader.style.width='0';requestAnimationFrame(()=>leader.style.width=dist+'px')})}replay.onclick=introRun;nextPoint.onclick=()=>show((active+1)%s.points.length);window.addEventListener('resize',()=>{if(active>=0)show(active)});introRun();</script></body></html>
