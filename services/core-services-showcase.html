<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각자국 AI 핵심 서비스 시연</title><style>:root{--n:#072c84;--b:#0b79c9;--red:#ef3f4a;--ink:#102641;--m:#62758b;--l:#d8e4ee;--bg:#eef5fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif}.top{padding:17px 21px;color:#fff;background:linear-gradient(135deg,#061d67,#0752b5,#1690d2)}.top h1{margin:5px 0 4px;font-size:clamp(25px,3.2vw,40px)}.top p{margin:0;color:#e8f4ff;line-height:1.55}.viewer{padding:12px}.stage{position:relative;width:min(1400px,100%);height:min(78vh,850px);margin:auto;border:1px solid var(--l);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 15px 46px #0826541c}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.intro{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(135deg,rgba(3,25,85,.91),rgba(11,112,195,.82));transition:.45s}.intro.hide{opacity:0;visibility:hidden}.intro div{max-width:760px;padding:28px;text-align:center;color:#fff}.intro b{display:block;font-size:clamp(32px,5vw,60px)}.intro p{font-size:16px;line-height:1.7;color:#eef7ff}.hot{position:absolute;z-index:24;width:29px;height:29px;border:4px solid #fff;border-radius:50%;background:var(--red);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(239,63,74,.3);cursor:pointer;opacity:0;transition:opacity .25s,transform .2s}.ready .hot.visible{opacity:1;animation:pulse 1.75s ease-out infinite}.hot:hover{transform:translate(-50%,-50%) scale(1.14)}.hot.active{animation:none!important;box-shadow:0 0 0 7px rgba(239,63,74,.2)}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,63,74,.55)}70%{box-shadow:0 0 0 15px rgba(239,63,74,0)}100%{box-shadow:0 0 0 0 rgba(239,63,74,0)}}.bubble{position:absolute;z-index:26;width:min(370px,40vw);padding:14px 16px;border:2px solid #ff9299;border-radius:15px;background:#fff;box-shadow:0 13px 32px #071d422d;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}.bubble.show{opacity:1;transform:none}.bubble strong{display:block;color:#cb2c38;margin-bottom:5px}.bubble span{display:block;color:#43586f;font-size:13px;line-height:1.6}.leader{position:absolute;z-index:25;height:3px;background:linear-gradient(90deg,var(--red),#ff9a9f);transform-origin:0 50%;width:0;border-radius:99px;transition:width .4s ease;pointer-events:none}.toolbar{width:min(1400px,100%);margin:9px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar small{color:var(--m)}.toolbar button{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,var(--n),var(--b))}.ghost{background:#fff;color:#516579;border:1px solid var(--l)!important}@media(max-width:800px){.stage{height:76vh}.bubble{width:66vw}}</style></head><body><header class="top"><small>05 · 생각자국의 실체</small><h1 id="title">핵심 서비스 시연</h1><p id="desc"></p></header><main class="viewer"><div class="stage" id="stage"><iframe id="screen"></iframe><div class="intro" id="intro"><div><b id="introTitle"></b><p id="introDesc"></p></div></div><div class="bubble" id="bubble"><strong id="bubbleTitle"></strong><span id="bubbleText"></span></div><div class="leader" id="leader"></div></div><div class="toolbar"><div><b id="count"></b><br><small>빨간 원은 캡처 좌표가 아니라 실제 페이지의 설명 대상 요소에 붙습니다. 페이지를 스크롤해도 함께 이동합니다.</small></div><div><button class="ghost" id="replay">소개 다시보기</button> <button class="primary" id="next">다음 포인트 ▶</button></div></div></main><script>
const key=new URLSearchParams(location.search).get('service')||'question';
const S={
question:{name:'질문학교',desc:'소크라테스식 질문법을 자연스럽게 익히며 학생이 개념의 경계를 스스로 다듬고 다시 세우는 질문 훈련 서비스입니다.',url:'socratic-question-school.html',points:[{text:'소크라테스 질문학교',t:'질문을 배우는 독립 학습공간',d:'정답을 빨리 찾는 대신 생각을 깊게 여는 질문의 렌즈를 배우고 실제 질문으로 전환합니다.'},{text:'1. 질문법 배우기',t:'질문의 구조를 먼저 익힙니다',d:'개념·근거·예외·반례·재구성의 순서를 학습한 뒤 학생이 직접 질문을 만들어봅니다.'},{text:'생각스튜디오에서 실전 대화',t:'배운 질문을 실제 교과 대화에 적용',d:'질문학교에서 익힌 질문법을 생각스튜디오의 실제 학습대화에서 바로 사용하게 연결합니다.'}]},
studio:{name:'생각스튜디오',desc:'하나의 질문에서 시작해 여러 교과의 교육과정과 연결하고 오개념을 역질문으로 확인하는 융합형 AI 학습 공간입니다.',url:'scenario-demo.html?v=20260811&type=smartphone',points:[{text:'교과 연결맵',t:'한 질문을 여러 교과 교육과정과 연결',d:'국어·사회·윤리·과학·수학 등 연결 가능한 과목을 찾고 교육부·교육청의 관련 성취기준과 매핑합니다. 하나의 질문을 해결하면서 여러 교과를 융합해 경험합니다.'},{text:'생각스튜디오 · 막힌 지점 진단형 대화',t:'학생이 막힌 이유를 역질문으로 확인',d:'정오답만 보지 않고 왜 그렇게 생각했는지 묻고, 빠진 근거·기준·반례를 찾아 다음 질문을 바꿉니다.'},{text:'AI의 학습진단',t:'융합학습을 교과별 이수 증거로 연결',d:'대화와 과제가 성취기준의 증거 조건을 충족하면 관련 교과의 이수현황에 일부 반영합니다. 한 질문의 해결이 여러 교과 성장기록으로 이어집니다.'}]},
growth:{name:'성장·성취',desc:'교과 성취와 질문력·학습흥미, 실제 활동 이력을 함께 보고 교사가 난이도를 최종 조정하는 성장 관리 서비스입니다.',url:'growth-adjustment-demo.html',points:[{sel:'[data-spot="summary"]',t:'성적과 사고의 변화를 함께 봅니다',d:'교과 성취정보와 질문력·학습흥미 변화를 한 화면에서 확인합니다.'},{sel:'[data-spot="adjust"]',t:'학생별 활동 근거를 보고 난이도를 결정',d:'년월일시·과정·활동·평가 이력을 보고 AI 권고를 검토한 뒤 교사가 상향·유지·하향을 직접 선택합니다.'}]},
career:{name:'진로성장 AI',desc:'한 번의 적성검사가 아니라 학생이 실제로 해온 학습·질문·프로젝트 활동에서 반복되는 진로역량의 단서를 찾습니다.',url:'career-growth-ai.html',points:[{text:'활동에서 추출한 진로역량',t:'검사 답변보다 실제 행동을 봅니다',d:'자료분석·수리논리·탐구질문·소통협력처럼 활동에서 반복되는 역량 신호를 누적합니다.'},{text:'생각스튜디오',t:'진로판단의 근거를 활동까지 추적',d:'어떤 질문과 프로젝트에서 해당 역량이 관찰됐는지를 함께 보여줘 진로 추천의 근거를 확인할 수 있습니다.'}]},
quest:{name:'로컬퀘스트',desc:'지역의 실제 문제를 팀 프로젝트로 조사·협업·대안제시·기관연결까지 이어가는 실천형 학습 서비스입니다.',url:'local-quest.html',points:[{text:'프로젝트 전체 흐름',t:'문제발견에서 지역 반영까지 연결',d:'문제 바라보기부터 원인·조사·대안·기관 연결·반영 결과까지 프로젝트 전 과정을 한 흐름으로 관리합니다.'},{text:'확정된 팀',t:'역할과 협업도 학습근거가 됩니다',d:'팀장·현장조사·인터뷰·자료정리 등 실제 역할과 협업 과정이 성장기록으로 남습니다.'},{text:'현재 진행단계',t:'현재 위치와 다음 행동이 보입니다',d:'진행률과 단계가 표시되어 학생과 교사가 다음에 해야 할 행동을 바로 확인할 수 있습니다.'}]},
teacher:{name:'선생님 지원',desc:'난이도 조정, 프로젝트 승인, 수행평가, 학부모 공유와 학급통지까지 교사가 처리할 일을 한곳에 모은 업무 코파일럿입니다.',url:'teacher-tasks.html',points:[{text:'처리할 일 6건',t:'오늘 처리할 일을 한 화면에',d:'난이도 조정·프로젝트 승인·수행평가·성장리포트·학급통지를 업무 우선순위에 따라 모아줍니다.'},{text:'난이도 상향 검토',t:'AI 권고를 교사가 최종 판단',d:'학생의 최근 활동과 성취 신호를 AI가 정리하지만 실제 적용은 교사가 확인하고 결정합니다.'},{text:'학부모 성장리포트 확인',t:'학생 지원이 학부모 공유까지 이어집니다',d:'학생 성장정보를 확인한 뒤 교사 피드백을 거쳐 학부모에게 전달하는 흐름으로 연결됩니다.'}]}}
const s=S[key]||S.question;title.textContent=s.name;desc.textContent=s.desc;introTitle.textContent=s.name;introDesc.textContent=s.desc;count.textContent='핵심 포인트 '+s.points.length+'개';screen.src=s.url;
const dots=s.points.map((p,i)=>{const b=document.createElement('button');b.className='hot';b.setAttribute('aria-label',p.t);b.onclick=()=>show(i,true);stage.appendChild(b);return b});let active=-1,doc=null,win=null;
function visible(el){const st=win.getComputedStyle(el);return st.display!=='none'&&st.visibility!=='hidden'&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0}
function findText(t){if(!doc)return null;const list=[...doc.querySelectorAll('h1,h2,h3,h4,b,strong,button,a,div,p,span')].filter(el=>visible(el)&&(el.innerText||'').trim().includes(t));list.sort((a,b)=>((a.innerText||'').length-(b.innerText||'').length)||((a.getBoundingClientRect().width*a.getBoundingClientRect().height)-(b.getBoundingClientRect().width*b.getBoundingClientRect().height)));return list[0]||null}
function target(p){try{return p.sel?doc.querySelector(p.sel):findText(p.text)}catch(e){return null}}
function xy(el){const r=el.getBoundingClientRect(),fr=screen.getBoundingClientRect(),sr=stage.getBoundingClientRect();return{x:fr.left-sr.left+r.left+Math.min(Math.max(r.width/2,12),Math.max(r.width-12,12)),y:fr.top-sr.top+r.top+Math.min(Math.max(r.height/2,12),Math.max(r.height-12,12)),vis:r.bottom>0&&r.right>0&&r.top<(win?.innerHeight||9999)&&r.left<(win?.innerWidth||9999)}}
function place(){if(!doc)return;s.points.forEach((p,i)=>{const el=target(p);if(!el){dots[i].classList.remove('visible');return}const z=xy(el);dots[i].style.left=z.x+'px';dots[i].style.top=z.y+'px';dots[i].classList.toggle('visible',z.vis)});if(active>=0)draw(active)}
function draw(i){const d=dots[i];if(!d.classList.contains('visible')){bubble.classList.remove('show');leader.style.width='0';return}const sr=stage.getBoundingClientRect(),hr=d.getBoundingClientRect(),x=hr.left+hr.width/2-sr.left,y=hr.top+hr.height/2-sr.top,bw=Math.min(370,sr.width*.4);let left=x>sr.width*.58?Math.max(16,x-bw-40):Math.min(sr.width-bw-16,x+40),top=Math.min(sr.height-150,Math.max(18,y-48));bubble.style.left=left+'px';bubble.style.top=top+'px';requestAnimationFrame(()=>{const br=bubble.getBoundingClientRect(),x2=br.left+(x>sr.width*.58?br.width:0)-sr.left,y2=br.top+35-sr.top,dx=x2-x,dy=y2-y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;leader.style.left=x+'px';leader.style.top=y+'px';leader.style.transform='rotate('+ang+'deg)';leader.style.width='0';requestAnimationFrame(()=>leader.style.width=dist+'px')})}
function show(i,scroll){active=i;dots.forEach((d,j)=>d.classList.toggle('active',j===i));const p=s.points[i],el=target(p);bubbleTitle.textContent=p.t;bubbleText.textContent=p.d;bubble.classList.add('show');if(scroll&&el){el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});setTimeout(place,550)}else place()}
function ready(){try{doc=screen.contentDocument;win=screen.contentWindow;win.addEventListener('scroll',place,{passive:true});new ResizeObserver(place).observe(doc.documentElement);place()}catch(e){}setTimeout(()=>{intro.classList.add('hide');stage.classList.add('ready');place()},1050)}screen.addEventListener('load',ready);window.addEventListener('resize',place);replay.onclick=()=>{stage.classList.remove('ready');intro.classList.remove('hide');bubble.classList.remove('show');active=-1;setTimeout(()=>{intro.classList.add('hide');stage.classList.add('ready');place()},1050)};next.onclick=()=>show((active+1)%s.points.length,true);
</script></body></html>
