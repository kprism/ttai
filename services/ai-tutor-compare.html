<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일반 맞춤형 AI 튜터 vs 생각자국 AI 튜터</title><style>:root{--n:#05298c;--b:#1581c4;--c:#05b6d7;--t:#122641;--m:#66788d;--l:#dce6ef;--p:#f3f7fb;--g:#15936a;--r:#dc3944}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--t);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif}main{width:min(1420px,100%);margin:auto;padding:18px}.hero{padding:20px 24px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#031750,var(--n),#2286c9)}.hero h1{margin:5px 0 4px;font-size:clamp(26px,3.2vw,40px)}.hero p{margin:0;color:#dceaff;line-height:1.55}.common{margin-top:12px;padding:14px 18px;border:1px solid var(--l);border-radius:16px;background:#fff}.common b{color:var(--n)}.student{margin-top:7px;padding:10px 13px;border-radius:12px;background:#edf6ff;font-weight:850}.grid{display:grid;grid-template-columns:1fr .72fr 1fr;gap:12px;margin-top:12px}.col{min-height:560px;padding:16px;border:1px solid var(--l);border-radius:18px;background:#fff}.col h2{margin:2px 0 10px;font-size:21px}.left h2{color:#495c71}.right h2{color:var(--n)}.middle{background:linear-gradient(180deg,#fbfdff,#eef7ff)}.middle h2{text-align:center;color:var(--n)}.agent{margin:10px 0;padding:12px;border-radius:14px;background:#f5f8fb;border:1px dashed #b9c9d8}.agent strong{display:block;margin-bottom:7px;color:var(--n);font-size:13px}.agentLine{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #e5ebf0;font-size:12px}.agentLine:last-child{border-bottom:0}.agentLine span:first-child{color:var(--m)}.agentLine span:last-child{text-align:right;font-weight:850}.bubble{padding:12px 14px;border-radius:15px;line-height:1.55;margin:8px 0}.ai{background:#f1f5f8;border:1px solid var(--l)}.tt{background:#edf7ff;border:1px solid #cfe5f4}.stepTitle{font-size:13px;font-weight:950;color:var(--b);margin-bottom:7px}.compareBox{padding:13px;border-radius:14px;background:#fff;border:1px solid #d6e7f3;line-height:1.6;text-align:center}.compareBox b{color:var(--n)}.miniTable{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.miniTable div{padding:8px;border-radius:10px;background:#fff;border:1px solid var(--l);font-size:12px;text-align:center}.miniTable b{display:block;color:var(--n);margin-bottom:3px}.footer{display:flex;justify-content:center;gap:8px;margin-top:12px}.footer button{border:0;border-radius:12px;padding:12px 22px;font-weight:950;cursor:pointer}.next{color:#fff;background:linear-gradient(135deg,var(--n),var(--b))}.reset{background:#fff;border:1px solid var(--l)!important;color:var(--m)}.progress{margin-top:8px;text-align:center;color:var(--m);font-size:12px}.record{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.record div{padding:9px;border-radius:10px;background:#f7fafc;border:1px solid var(--l);font-size:12px}.record b{display:block;color:var(--n);font-size:15px}.graph{margin-top:8px;padding:8px;border-radius:12px;background:#fff;border:1px solid var(--l)}.graph svg{width:100%;height:130px}.warn{color:var(--r);font-weight:900}.good{color:var(--g);font-weight:900}@media(max-width:900px){.grid{grid-template-columns:1fr}.col{min-height:auto}.middle{order:2}.right{order:3}}</style></head><body><main><section class="hero"><small>03 · 생각자국 AI란?</small><h1>같은 학생, 같은 답변. 두 AI는 다음에 무엇을 할까?</h1><p>일반 맞춤형 AI 튜터와 생각자국 AI 튜터가 동일한 학생 응답을 어떻게 해석하고 다음 학습을 결정하는지 동시에 보여주는 시연입니다.</p></section><section class="common"><b>공통 문제</b> · y=2x²와 y=0.5x² 중 어느 그래프의 폭이 더 넓을까?<div class="student">학생: “2x²요. 2가 더 큰 숫자니까 그래프도 더 넓을 것 같아요.”</div></section><div class="grid"><section class="col left"><h2>🤖 일반 맞춤형 AI 튜터</h2><div id="left"></div></section><section class="col middle"><h2>🔍 비교 설명</h2><div id="middle"></div></section><section class="col right"><h2>🧠 생각자국 AI 튜터</h2><div id="right"></div></section></div><div class="footer"><button class="reset" id="reset">처음으로</button><button class="next" id="next">다음 ▶</button></div><div class="progress" id="progress"></div></main><script>const steps=[{l:`<div class="stepTitle">STEP 1 · 수준 판단</div><div class="agent"><strong>ADAPTIVE TUTOR AGENT</strong><div class="agentLine"><span>문항 결과</span><span>오답</span></div><div class="agentLine"><span>현재 단원</span><span>이차함수 y=ax²</span></div><div class="agentLine"><span>성취수준</span><span>중</span></div><div class="agentLine"><span>오답 영역</span><span>계수 a와 그래프 폭</span></div><div class="agentLine"><span>다음 행동</span><span>문제은행 검색</span></div></div><div class="bubble ai">현재 수준과 오답 영역에 맞는 다음 문항을 찾습니다.</div>`,m:`<div class="compareBox"><b>같은 오답을 보는 첫 번째 차이</b><br>일반 맞춤형 튜터는 주로 <b>정오답·단원·성취수준</b>을 기준으로 다음 학습을 찾습니다.<br><br>생각자국 AI는 정오답과 함께 <b>학생이 왜 그렇게 답했는지</b>를 분석대상으로 삼습니다.</div><div class="miniTable"><div><b>일반형</b>수준 → 문제</div><div><b>생각자국</b>이유 → 사고행동</div></div>`,r:`<div class="stepTitle">STEP 1 · 사고상태 판단</div><div class="agent"><strong>THINKTRACE AGENT</strong><div class="agentLine"><span>문항 결과</span><span>오답</span></div><div class="agentLine"><span>학생 주장</span><span>“2가 크므로 더 넓다”</span></div><div class="agentLine"><span>보유개념</span><span>숫자의 크기 이해</span></div><div class="agentLine"><span>추정 오개념</span><span>계수↑ = 폭↑</span></div><div class="agentLine"><span>확인 필요</span><span>암기 오류? 개념 오류?</span></div><div class="agentLine"><span>다음 행동</span><span>역질문</span></div></div><div class="bubble tt">정답을 바로 설명하기 전에 학생의 생각 속 모순을 확인합니다.</div>`},{l:`<div class="stepTitle">STEP 2 · 문제은행에서 다음 문항 선택</div><div class="agent"><strong>ADAPTIVE TUTOR AGENT</strong><div class="agentLine"><span>검색조건</span><span>이차함수·그래프·중</span></div><div class="agentLine"><span>후보문항</span><span>38개</span></div><div class="agentLine"><span>적합도</span><span>92%</span></div><div class="agentLine"><span>선택</span><span>문항 #184</span></div></div><div class="bubble ai"><b>다음 문제</b><br>y=3x²와 y=x² 중 폭이 더 좁은 그래프는 어느 것일까요?</div>`,m:`<div class="compareBox"><b>같은 오답, 다른 다음 행동</b><br><br>왼쪽은 “어떤 문제를 더 풀까?”를 결정합니다.<br>오른쪽은 “어떤 사고를 경험시켜야 할까?”를 결정합니다.</div><div class="miniTable"><div><b>일반형</b>적정 난이도 문항</div><div><b>생각자국</b>적정 사고경험</div></div>`,r:`<div class="stepTitle">STEP 2 · 오개념을 흔드는 역질문</div><div class="agent"><strong>THINKTRACE AGENT</strong><div class="agentLine"><span>판단</span><span>문제 추가보다 오개념 확인 우선</span></div><div class="agentLine"><span>전략</span><span>SOCRATIC_COUNTEREXAMPLE</span></div><div class="agentLine"><span>도구</span><span>비교 그래프 생성</span></div></div><div class="bubble tt"><b>AI 역질문</b><br>그렇다면 y=10x²는 y=x²보다 훨씬 더 넓어져야 할까?</div><div class="graph"><svg viewBox="0 0 420 130"><line x1="210" y1="5" x2="210" y2="122" stroke="#a3b2bf"/><line x1="20" y1="115" x2="400" y2="115" stroke="#a3b2bf"/><path d="M120 8 Q210 218 300 8" fill="none" stroke="#1581c4" stroke-width="4"/><path d="M28 64 Q210 160 392 64" fill="none" stroke="#05b6d7" stroke-width="4"/><text x="288" y="24" font-size="12" fill="#1581c4">y=2x²</text><text x="320" y="76" font-size="12" fill="#058aa4">y=0.5x²</text></svg></div>`},{l:`<div class="stepTitle">STEP 3 · 학생이 정답을 고친 뒤</div><div class="bubble ai"><span class="good">정답입니다.</span><br>좋아요. 다음 문제로 넘어가겠습니다.</div><div class="agent"><strong>ADAPTIVE TUTOR AGENT</strong><div class="agentLine"><span>최근 결과</span><span>정답</span></div><div class="agentLine"><span>성취수준</span><span>중 → 중상</span></div><div class="agentLine"><span>다음 행동</span><span>난이도 상향</span></div></div>`,m:`<div class="compareBox"><b>정답을 맞혔다고 이해한 것은 아닐 수 있습니다</b><br><br>일반형은 정답률과 성취수준을 갱신해 다음 난이도를 조절합니다.<br>생각자국 AI는 <b>왜 정답이 되는지 설명할 수 있는지</b>까지 확인합니다.</div>`,r:`<div class="stepTitle">STEP 3 · 자기설명으로 이해 확인</div><div class="bubble tt">좋아. 그런데 왜 |a|가 커질수록 그래프의 폭이 좁아지는지 <b>네 말로 설명해볼래?</b></div><div class="agent"><strong>THINKTRACE AGENT</strong><div class="agentLine"><span>정오답</span><span>정답</span></div><div class="agentLine"><span>남은 확인</span><span>개념 설명 가능 여부</span></div><div class="agentLine"><span>전략</span><span>SELF_EXPLANATION</span></div></div>`},{l:`<div class="stepTitle">STEP 4 · 학습기록</div><div class="record"><div><b>8개</b>풀이 문항</div><div><b>6개</b>정답</div><div><b>75%</b>정답률</div><div><b>중상</b>성취수준</div></div><div class="bubble ai">기록의 중심은 문제풀이 결과와 성취수준입니다.</div>`,m:`<div class="compareBox"><b>문제를 얼마나 맞혔는가 + 생각이 어떻게 변했는가</b><br><br>생각자국 AI는 성취정보를 버리지 않습니다. 그 위에 주장·근거·오개념·반례·자기설명의 변화를 추가합니다.</div><div class="miniTable"><div><b>공통</b>교과 성취</div><div><b>추가</b>사고 변화</div></div>`,r:`<div class="stepTitle">STEP 4 · 성장기록</div><div class="record"><div><b>75%</b>정답률</div><div><b>4/5</b>개념 이해</div><div><b>3/5</b>근거 설명</div><div><b>4/5</b>반례 이해</div></div><div class="agent"><strong>개념 변화 기록</strong><div class="agentLine"><span>이전</span><span class="warn">큰 수 → 넓은 그래프</span></div><div class="agentLine"><span>이후</span><span class="good">|a| 증가 → 폭 감소</span></div><div class="agentLine"><span>상태</span><span>개념 변화 확인 ✓</span></div></div>`}];let i=0;function render(){const s=steps[i];left.innerHTML=s.l;middle.innerHTML=s.m;right.innerHTML=s.r;progress.textContent=`${i+1} / ${steps.length}`;next.textContent=i===steps.length-1?'다시 보기 ↻':'다음 ▶'}next.onclick=()=>{i=i===steps.length-1?0:i+1;render()};reset.onclick=()=>{i=0;render()};render();</script></body></html>
