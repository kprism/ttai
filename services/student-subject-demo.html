<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 학생 과목 시연 | 생각자국 AI</title><style>:root{--n:#05298c;--b:#1676c7;--c:#00b8d9;--ink:#10233f;--m:#66788d;--l:#dce6ef;--bg:#f3f7fb;--warm:#fff7e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif}.page{width:min(1260px,100%);margin:auto;padding:18px}.hero{padding:27px 30px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#06195f,#08399d,#1b85ca)}.hero small{font-weight:900}.hero h1{margin:8px 0 6px;font-size:clamp(30px,4vw,46px)}.hero p{margin:0;color:#e7f3ff;line-height:1.65}.grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:14px;margin-top:14px}.card{padding:20px;border:1px solid var(--l);border-radius:20px;background:#fff}.card h2{margin:0 0 12px}.curriculum{display:grid;gap:9px}.curr{padding:12px;border-radius:13px;background:#f6f9fc;border:1px solid var(--l)}.curr b{display:block;color:var(--n);margin-bottom:3px}.curr span{font-size:12px;color:var(--m);line-height:1.55}.chat{display:grid;gap:10px}.bubble{max-width:88%;padding:12px 14px;border-radius:15px;line-height:1.6}.bubble small{display:block;font-weight:950;margin-bottom:4px}.student{margin-left:auto;color:#fff;background:linear-gradient(135deg,#16399e,#2579c5)}.ai{background:#f2f7fb;border:1px solid var(--l)}.diagnosis{padding:13px;border-radius:13px;background:var(--warm);border:1px solid #f1c870}.next{display:inline-flex;margin-top:11px;border:0;border-radius:12px;padding:10px 13px;color:#fff;background:linear-gradient(135deg,var(--n),var(--b));font-weight:900;cursor:pointer}.hidden{display:none}.graph{height:170px;border-radius:14px;background:#fbfdff;border:1px solid var(--l);display:grid;place-items:center;margin-top:10px}.graph svg{width:95%;height:150px}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eaf4ff;color:var(--n);font-size:11px;font-weight:900;margin:2px}@media(max-width:820px){.grid{grid-template-columns:1fr}.page{padding:10px}.hero{padding:22px}}</style></head><body><main class="page"><section class="hero" data-spot="hero"><small id="kicker">중2 학생 시연</small><h1 id="title"></h1><p id="desc"></p></section><div class="grid"><section class="card" data-spot="curriculum"><h2>교과·성취기준 연결</h2><div class="curriculum" id="curriculum"></div></section><section class="card" data-spot="dialogue"><h2>생각스튜디오 · 학생과 AI의 실제 흐름</h2><div class="chat" id="chat"></div><div id="extra" class="hidden"></div><button class="next" id="next">다음 질문 받기 ▶</button></section></div></main><script>const S={math:{title:'수학 · 답보다 이유를 먼저 확인합니다',desc:'정답 여부만 보지 않고 왜 그렇게 판단했는지를 확인한 뒤 그래프·반례·자기설명으로 이어갑니다.',curr:[['중학교 수학','함수의 그래프와 변화 관계를 해석하고 설명'],['사고역량','근거 설명 · 반례 확인 · 시각화']],student:'y=2x²가 y=x²보다 더 넓죠? 2가 더 크니까요.',ai:'2가 더 크다는 생각은 이해했어. 그런데 그래프의 “넓다”는 무엇을 기준으로 비교한 거야?',diag:'계수의 수치 크기와 그래프 폭을 같은 방향으로 연결하는 오개념 가능성. 정답 제공보다 시각 비교가 먼저 필요합니다.',next:'그럼 같은 x=1에서 두 함수의 y값을 비교해볼까?',extra:'graph'},english:{title:'영어 · 문법보다 주장과 근거를 함께 봅니다',desc:'영어 표현을 고치는 데서 끝나지 않고, 말하고 쓰는 목적에 맞게 주장·근거·반론까지 정리하도록 돕습니다.',curr:[['중학교 영어','의견을 말하고 이유를 덧붙여 의사소통'],['국어 연계','주장과 근거의 적절성 점검']],student:'I think smartphones should be allowed because it is convenient.',ai:'“convenient”가 누구에게 어떤 점에서 편리한지 한 가지 구체적인 상황을 말해볼래?',diag:'문법은 전달 가능하지만 근거가 추상적입니다. 표현 교정보다 근거 구체화와 반대 입장 검토가 다음 단계입니다.',next:'반대하는 친구가 “수업 집중을 방해한다”고 말하면 영어로 어떻게 답할까?',extra:'english'},science:{title:'과학 · 현상을 더 넓은 범위에서 보게 합니다',desc:'학생이 이미 알고 있는 과학개념의 적용 범위를 확인하고, 놓친 변수와 탐구 기준을 질문으로 확장합니다.',curr:[['중학교 과학','환경 변화와 인간 활동의 관계를 자료로 탐구'],['사회 연계','정책·비용·이해관계까지 융합 탐구']],student:'전기차는 배기가스가 없으니까 무조건 친환경 아닌가요?',ai:'운행 중 배기가스만 보면 그렇게 보일 수 있어. 만들기와 폐기 과정까지 포함하면 판단이 같을까?',diag:'학생이 사용 단계만 기준으로 보고 생산·폐기와 전력 생산을 고려하지 않고 있습니다.',next:'배터리 생산, 전력 생산, 폐기 중 어떤 자료부터 찾아보면 좋을까?',extra:'science'},social:{title:'사회 · 권리와 공동체 기준을 함께 묻습니다',desc:'하나의 입장을 정답처럼 고정하지 않고, 이해관계와 기준이 충돌할 때 판단 근거를 세우게 합니다.',curr:[['중학교 사회','개인의 권리와 공동체 규칙의 관계를 사례로 탐구'],['국어 연계','토론에서 주장·근거·반론 구성']],student:'스마트폰은 내 물건인데 학교가 왜 못 쓰게 해요?',ai:'소유권은 중요한 권리야. 그런데 다른 학생의 수업권과 충돌하면 어떤 기준으로 조정하면 좋을까?',diag:'개인의 소유권은 인식하지만 공동체 규칙이 보호하려는 다른 권리를 함께 고려하지 않고 있습니다.',next:'“완전 금지”와 “조건부 허용” 중 어떤 규칙이 더 공정한지 기준부터 세워볼까?',extra:'social'}};const q=new URLSearchParams(location.search),k=q.get('subject')||'math',s=S[k]||S.math;title.textContent=s.title;desc.textContent=s.desc;curriculum.innerHTML=s.curr.map(x=>`<div class="curr"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');chat.innerHTML=`<div class="bubble student" data-spot="student"><small>학생</small>${s.student}</div><div class="bubble ai" data-spot="ai"><small>생각자국 AI</small>${s.ai}</div><div class="diagnosis" data-spot="diagnosis"><b>AI 학습진단</b><br>${s.diag}</div>`;next.onclick=()=>{extra.classList.remove('hidden');extra.innerHTML=`<div class="bubble ai" style="margin-top:10px"><small>생각자국 AI · 다음 질문</small>${s.next}</div>`+(s.extra==='graph'?`<div class="graph"><svg viewBox="0 0 420 150"><line x1="210" y1="8" x2="210" y2="142" stroke="#8797aa"/><line x1="20" y1="132" x2="400" y2="132" stroke="#8797aa"/><path d="M70 15 Q210 250 350 15" fill="none" stroke="#1e77c4" stroke-width="4"/><path d="M125 15 Q210 185 295 15" fill="none" stroke="#e94d5b" stroke-width="4"/><text x="300" y="35" fill="#1e77c4">y=x²</text><text x="235" y="38" fill="#e94d5b">y=2x²</text></svg></div>`:'');next.textContent='다음 질문이 생성되었습니다 ✓'};</script></body></html>
