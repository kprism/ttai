<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무 처리 | 생각자국 AI</title><style>:root{--n:#00288a;--b:#017bc5;--g:#17a36b;--r:#e84242;--o:#f59e0b;--t:#10233f;--m:#68798e;--l:#dce7f1;--p:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--p);color:var(--t)}main{width:min(980px,100%);margin:auto;padding:20px 14px 70px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:var(--n);font-weight:900;text-decoration:none}.hero{margin-top:13px;padding:24px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#02134d,var(--n),var(--b))}.hero h1{margin:6px 0}.panel{margin-top:12px;padding:18px;border:1px solid var(--l);border-radius:19px;background:#fff}.row{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--l)}.row b{color:var(--n)}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.lv{padding:12px;border:1px solid var(--l);border-radius:13px}.lv.on{border:2px solid var(--b);background:#eef8ff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{padding:10px 13px;border:0;border-radius:11px;font-weight:900}.primary{color:#fff;background:var(--b)}.ghost{color:var(--n);background:#edf4fa}.note{padding:12px;border-radius:12px;background:#fff8e8;color:#745416}.ok{padding:12px;border-radius:12px;background:#eefaf5;color:#27684e}@media(max-width:650px){.row{grid-template-columns:1fr}.levels{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="top"><a href="./teacher-tasks.html">← 처리할 일</a><b id="status">선생님 업무 처리</b></div><section class="hero"><small id="kind">업무</small><h1 id="title">업무를 불러오는 중</h1><p id="desc"></p></section><div id="body"></div></main><script>const q=new URLSearchParams(location.search),t=q.get('task')||'up';const data={up:{kind:'난이도 조정',title:'김생각 · Lv.2 → Lv.3 상향 검토',desc:'최근 교과성취와 질문력 상승을 근거로 AI가 상향을 권고했습니다.',body:`<section class="panel"><div class="row"><b>최근 성취</b><span>국어 A · 수학 B · 과학 A</span></div><div class="row"><b>질문력</b><span>67 → 78 (+11)</span></div><div class="row"><b>근거</b><span>최근 4주 응용문항 정답률 84%, 자기질문 생성 12회</span></div><div class="note">AI 권고는 참고이며 최종 난이도는 선생님이 결정합니다.</div><div class="levels"><div class="lv">Lv.1 기초<br><small>개념·힌트 중심</small></div><div class="lv">Lv.2 기본<br><small>개념 적용</small></div><div class="lv on">Lv.3 응용<br><small>반례·조건변화</small></div><div class="lv">Lv.4 심화<br><small>교과연결·자기검증</small></div></div><div class="actions"><button class="primary" onclick="done('Lv.3 상향 적용')">Lv.3 적용</button><button class="ghost" onclick="done('현 수준 유지')">Lv.2 유지</button></div></section>`},down:{kind:'난이도 조정',title:'박성장 · Lv.3 → Lv.2 하향 검토',desc:'응용 단계에서 반복 정체가 나타나 기초 개념 재확인을 권고했습니다.',body:`<section class="panel"><div class="row"><b>최근 성취</b><span>수학 C · 과학 B</span></div><div class="row"><b>최근 3회</b><span>응용단계 정답률 41%, 힌트 요청 9회</span></div><div class="row"><b>권고</b><span>Lv.2 기본 단계에서 핵심개념 재확인</span></div><div class="levels"><div class="lv">Lv.1 기초</div><div class="lv on">Lv.2 기본</div><div class="lv">Lv.3 응용</div><div class="lv">Lv.4 심화</div></div><div class="actions"><button class="primary" onclick="done('Lv.2 하향 적용')">Lv.2 적용</button><button class="ghost" onclick="done('Lv.3 유지')">Lv.3 유지</button></div></section>`},local:{kind:'로컬퀘스트 승인',title:'중2 지역교통 안전 프로젝트',desc:'학생들이 조사한 통학로 위험구간 프로젝트를 승인하는 시나리오입니다.',body:`<section class="panel"><div class="row"><b>프로젝트</b><span>학교 앞 횡단보도 대기시간과 위험행동 조사</span></div><div class="row"><b>교과연결</b><span>수학 데이터 분석 · 사회 공공정책 · 국어 제안서 · 윤리 공동체</span></div><div class="row"><b>안전검토</b><span>현장조사 시 보호자/선생님 동행 필요</span></div><div class="actions"><button class="primary" onclick="done('로컬퀘스트 승인')">승인</button><button class="ghost" onclick="done('보완 요청')">보완 요청</button></div></section>`},assessment:{kind:'수행평가',title:'국어 주장글쓰기 수행평가 확인',desc:'AI 초안을 참고하되 선생님이 최종 확인하는 시나리오입니다.',body:`<section class="panel"><div class="row"><b>과제</b><span>학교 스마트폰 사용 규칙 제안문</span></div><div class="row"><b>AI 분석</b><span>주장 명확 · 근거 2개 · 반대 관점 반영 부족</span></div><div class="row"><b>추천 피드백</b><span>“반대 입장의 질문을 하나 만들고, 그 질문에 답을 추가해보세요.”</span></div><div class="actions"><button class="primary" onclick="done('피드백 확정')">피드백 확정</button><button class="ghost" onclick="done('수정 후 확정')">수정</button></div></section>`},parent:{kind:'학부모 리포트',title:'김생각 학부모 성장리포트 확인',desc:'AI 초안을 선생님이 확인한 뒤 공식 리포트로 전환합니다.',body:`<section class="panel"><div class="row"><b>학업</b><span>국어 B→A, 과학 탐구 +9점</span></div><div class="row"><b>사고</b><span>질문력 +11, 연결력 +8</span></div><div class="row"><b>가정 대화</b><span>“이번 달에 생각이 가장 많이 바뀐 질문은 무엇이었니?”</span></div><div class="ok">공식 리포트에는 선생님 확인 여부가 표시됩니다.</div><div class="actions"><button class="primary" onclick="done('학부모 리포트 발행 승인')">발행 승인</button><button class="ghost" onclick="done('내용 수정')">수정</button></div></section>`},notice:{kind:'학급통지서',title:'내일 과학 수행평가 준비 안내',desc:'연간 교육계획에서 전날 자동 생성된 처리 업무입니다.',body:`<section class="panel"><div class="row"><b>일정</b><span>8월 8일 과학 수행평가</span></div><div class="row"><b>준비물</b><span>탐구노트, 필기도구, 실험안전 확인</span></div><div class="row"><b>발송대상</b><span>2학년 3반 학생·학부모</span></div><div class="actions"><button class="primary" onclick="done('학급통지서 발송 완료')">발송</button><button class="ghost" onclick="done('내용 저장')">임시저장</button></div></section>`}};const d=data[t]||data.up;kind.textContent=d.kind;title.textContent=d.title;desc.textContent=d.desc;body.innerHTML=d.body;function done(msg){status.textContent='✓ '+msg;localStorage.setItem('ttai_last_teacher_task',JSON.stringify({task:t,result:msg,at:new Date().toISOString()}));}</script></body></html>
