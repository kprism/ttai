<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생각자국 AI 인터랙티브 시연</title>
<style>
:root{--n:#072c84;--b:#0b79c9;--red:#ef3f4a;--ink:#102641;--m:#62758b;--l:#d8e4ee;--bg:#eef5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif}.top{padding:17px 21px;color:#fff;background:linear-gradient(135deg,#061d67,#0752b5,#1690d2)}.top h1{margin:5px 0 4px;font-size:clamp(24px,3vw,38px)}.top p{margin:0;color:#e8f4ff;line-height:1.55}.viewer{padding:12px}.stage{position:relative;width:min(1400px,100%);height:min(78vh,840px);margin:auto;border:1px solid var(--l);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 15px 45px #0826541c}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.intro{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(135deg,rgba(3,25,85,.9),rgba(11,112,195,.82));opacity:1;visibility:visible;transition:opacity .45s,visibility .45s}.intro.hide{opacity:0;visibility:hidden;pointer-events:none}.intro div{max-width:760px;padding:25px;text-align:center;color:#fff}.intro b{display:block;font-size:clamp(30px,5vw,58px)}.intro p{font-size:16px;line-height:1.7;color:#eef7ff}.hot{position:absolute;z-index:24;width:28px;height:28px;border:4px solid #fff;border-radius:50%;background:var(--red);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(239,63,74,.3);cursor:pointer;opacity:0;transition:opacity .25s,transform .2s}.ready .hot.visible{opacity:1;animation:pulse 1.75s ease-out infinite}.hot:hover{transform:translate(-50%,-50%) scale(1.14)}.hot.active{animation:none!important;box-shadow:0 0 0 7px rgba(239,63,74,.2)}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,63,74,.55)}70%{box-shadow:0 0 0 15px rgba(239,63,74,0)}100%{box-shadow:0 0 0 0 rgba(239,63,74,0)}}.bubble{position:absolute;z-index:26;width:min(360px,40vw);padding:14px 16px;border:2px solid #ff9299;border-radius:15px;background:#fff;box-shadow:0 13px 32px #071d422d;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:auto;cursor:pointer}.bubble.show{opacity:1;transform:none}.bubble strong{display:block;color:#cb2c38;margin-bottom:5px}.bubble span{display:block;color:#43586f;font-size:13px;line-height:1.6}.leader{display:none!important}.toolbar{width:min(1400px,100%);margin:9px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar small{color:var(--m)}.toolbar button{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,var(--n),var(--b))}.ghost{background:#fff;color:#516579;border:1px solid var(--l)!important}@media(max-width:800px){.stage{height:76vh}.bubble{width:65vw}}
</style>
</head>
<body>
<header class="top"><small id="eyebrow">시연</small><h1 id="pageTitle">인터랙티브 시연</h1><p id="pageDesc"></p></header>
<main class="viewer">
  <div class="stage" id="stage">
    <iframe id="demoFrame" title="생각자국 AI 인터랙티브 실제 화면" allow="camera; microphone"></iframe>
    <div class="intro" id="intro"><div><b id="introTitle"></b><p id="introDesc"></p></div></div>
    <div class="bubble" id="bubble"><strong id="bubbleTitle"></strong><span id="bubbleText"></span></div>
    <div class="leader" id="leader"></div>
  </div>
  <div class="toolbar"><div><b id="count"></b><br><small>실제 페이지의 요소 위치를 따라 빨간 원이 이동합니다. 페이지를 스크롤해도 같은 지점을 추적합니다.</small></div><div><button class="ghost" id="replay">소개 다시보기</button> <button class="primary" id="nextPoint">다음 포인트 ▶</button></div></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const E={eyebrow:$('eyebrow'),pageTitle:$('pageTitle'),pageDesc:$('pageDesc'),stage:$('stage'),frame:$('demoFrame'),intro:$('intro'),introTitle:$('introTitle'),introDesc:$('introDesc'),bubble:$('bubble'),bubbleTitle:$('bubbleTitle'),bubbleText:$('bubbleText'),leader:$('leader'),count:$('count'),replay:$('replay'),next:$('nextPoint')};
const q=new URLSearchParams(location.search),demo=q.get('demo')||'student',subject=q.get('subject')||'math';
const names={math:'수학',english:'영어',science:'과학',social:'사회'};
const C=demo==='study'?{name:'스터디그룹 · 실시간 자막',desc:'화상 토론의 발화가 실시간 자막·주장·근거·질문으로 구조화되고 교육과정 활동 근거로 남는 과정을 보여드립니다.',url:'study-live-caption-demo.html?v=20260811-mobilemic1',points:[{sel:'[data-spot="caption"]',t:'실시간 자막이 발화와 함께 움직입니다',d:'말하는 학생을 자동으로 표시하고 발화를 즉시 자막화합니다. 듣기 부담을 낮추면서 토론의 흐름을 놓치지 않게 합니다.'},{sel:'[data-spot="analysis"]',t:'AI가 주장·근거·대안을 구분합니다',d:'단순 녹취가 아니라 발화의 역할을 구조화해 교사가 누가 어떤 논거를 냈는지 확인할 수 있게 합니다.'},{sel:'[data-spot="summary"]',t:'토론의 핵심 흐름을 자동 요약합니다',d:'현재까지의 논점을 압축해 다음 질문과 피드백으로 연결합니다. 국어·영어·사회·과학의 토론·발표 수업에 활용할 수 있습니다.'}]}:{name:'중2 '+(names[subject]||names.math)+' 학생 시연',desc:'같은 생각자국 AI 구조가 과목별 교육과정과 학생의 사고 특성에 맞춰 어떻게 다르게 작동하는지 보여드립니다.',url:'student-subject-demo.html?subject='+encodeURIComponent(subject),points:[{sel:'[data-spot="curriculum"]',t:'교과 성취기준에서 출발합니다',d:'AI의 질문은 자유대화로 끝나지 않고 해당 과목의 학습목표·성취기준과 연결됩니다.'},{sel:'[data-spot="ai"]',t:'학생의 답에 맞춰 다음 질문이 달라집니다',d:'정답을 먼저 주기보다 학생이 무엇을 기준으로 판단했는지 확인하는 역질문을 제시합니다.'},{sel:'[data-spot="diagnosis"]',t:'정오답보다 막힌 사고지점을 찾습니다',d:'오개념·근거 부족·변수 누락 등을 진단하고 그래프, 반례, 자기설명 등 다음 교육행동을 결정합니다.'}]};
E.eyebrow.textContent=demo==='study'?'스터디그룹 시연':'학생 과목 시연';E.pageTitle.textContent=C.name;E.pageDesc.textContent=C.desc;E.introTitle.textContent=C.name;E.introDesc.textContent=C.desc;E.count.textContent='핵심 포인트 '+C.points.length+'개';
let active=-1,doc=null,win=null,loaded=false,introStarted=0,introTimer=null,resizeObserver=null;
const dots=C.points.map((p,i)=>{const b=document.createElement('button');b.className='hot';b.type='button';b.setAttribute('aria-label',p.t);b.addEventListener('click',()=>togglePoint(i));E.stage.appendChild(b);return b});
function find(sel){try{return doc&&doc.querySelector(sel)}catch(_){return null}}
function pointXY(el){const r=el.getBoundingClientRect(),fr=E.frame.getBoundingClientRect(),sr=E.stage.getBoundingClientRect();return{x:fr.left-sr.left+r.left+Math.min(Math.max(r.width/2,12),Math.max(r.width-12,12)),y:fr.top-sr.top+r.top+Math.min(Math.max(r.height/2,12),Math.max(r.height-12,12)),visible:r.bottom>0&&r.right>0&&r.top<(win?.innerHeight||9999)&&r.left<(win?.innerWidth||9999)}}
function place(){if(!doc)return;C.points.forEach((p,i)=>{const el=find(p.sel);if(!el){dots[i].classList.remove('visible');return}const z=pointXY(el);dots[i].style.left=z.x+'px';dots[i].style.top=z.y+'px';dots[i].classList.toggle('visible',z.visible)});if(active>=0)draw(active)}
function draw(i){const d=dots[i];if(!d||!d.classList.contains('visible')){E.bubble.classList.remove('show');return}const sr=E.stage.getBoundingClientRect(),hr=d.getBoundingClientRect(),x=hr.left+hr.width/2-sr.left,y=hr.top+hr.height/2-sr.top,bw=Math.min(360,sr.width*.4);const left=x>sr.width*.58?Math.max(16,x-bw-38):Math.min(sr.width-bw-16,x+38);const top=Math.min(sr.height-150,Math.max(18,y-45));E.bubble.style.left=left+'px';E.bubble.style.top=top+'px'}
function hideBubble(){active=-1;dots.forEach(d=>d.classList.remove('active'));E.bubble.classList.remove('show')}
function togglePoint(i){if(active===i&&E.bubble.classList.contains('show')){hideBubble();return}show(i,true)}
function show(i,scroll){active=i;dots.forEach((d,j)=>d.classList.toggle('active',j===i));const p=C.points[i],el=find(p.sel);E.bubbleTitle.textContent=p.t;E.bubbleText.textContent=p.d;E.bubble.classList.add('show');if(scroll&&el){el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});setTimeout(place,520)}else place()}
function finishIntro(){clearTimeout(introTimer);E.intro.classList.add('hide');E.stage.classList.add('ready');place()}
function beginIntro(replay=false){introStarted=Date.now();clearTimeout(introTimer);E.stage.classList.remove('ready');E.intro.classList.remove('hide');E.bubble.classList.remove('show');active=-1;dots.forEach(d=>d.classList.remove('active'));if(replay){introTimer=setTimeout(finishIntro,1050)}else{introTimer=setTimeout(()=>{if(loaded)finishIntro();else introTimer=setTimeout(finishIntro,1800)},1050)}}
function bindFrame(){loaded=true;try{doc=E.frame.contentDocument;win=E.frame.contentWindow;if(win){win.addEventListener('scroll',place,{passive:true});win.addEventListener('resize',place,{passive:true})}if(resizeObserver)resizeObserver.disconnect();if(doc&&window.ResizeObserver){resizeObserver=new ResizeObserver(place);resizeObserver.observe(doc.documentElement)}place()}catch(err){console.warn('interactive showcase frame bind failed',err)}const remain=Math.max(0,1050-(Date.now()-introStarted));setTimeout(finishIntro,remain)}
E.frame.addEventListener('load',bindFrame);
window.addEventListener('resize',place,{passive:true});
E.bubble.addEventListener('click',hideBubble);
E.replay.addEventListener('click',()=>beginIntro(true));
E.next.addEventListener('click',()=>show((active+1)%C.points.length,true));
beginIntro(false);
E.frame.src=C.url;
})();
</script>
</body>
</html>
