<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시나리오 시연 | 생각자국 AI</title><style>:root{--n:#00288a;--b:#1676c7;--c:#00b8d9;--g:#18a36d;--r:#e84444;--o:#f1a51b;--t:#10233f;--m:#64758b;--l:#d9e5ef;--p:#f3f7fb}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:var(--p);color:var(--t)}button{font:inherit;cursor:pointer}main{width:min(1220px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.tag{padding:7px 11px;border-radius:999px;background:#e8f4ff;color:var(--n);font-size:12px;font-weight:900}.hero{margin-top:12px;padding:26px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#04175b,var(--n),#2780ca)}.hero h1{margin:7px 0;font-size:clamp(28px,4vw,44px)}.hero p{margin:0;color:#dce9fb}.grade{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#ffffff20;font-size:12px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{padding:20px;border:1px solid var(--l);border-radius:20px;background:#fff}.panel h2,.panel h3{margin:0 0 10px}.muted{color:var(--m);line-height:1.65}.map{display:flex;flex-wrap:wrap;gap:8px}.node{padding:10px 13px;border:0;border-radius:12px;background:#edf6ff;color:var(--n);font-weight:900}.node.on{color:#fff;background:linear-gradient(135deg,var(--b),var(--c))}.subjectbox{margin-top:14px;padding:16px;border-radius:16px;background:#f7fbff;border:1px solid var(--l)}.chat{display:grid;gap:10px}.bubble{max-width:90%;padding:12px 14px;border-radius:16px;line-height:1.62}.who{display:block;margin-bottom:4px;font-size:11px;font-weight:950;opacity:.8}.student{margin-left:auto;color:#fff;background:linear-gradient(135deg,#12339d,#287ac4)}.ai{background:#f3f8fc;border:1px solid var(--l)}.diagnose{background:#fff8e8;border:1px solid #f1cc78}.hintrow{display:flex;align-items:center;gap:8px;margin-top:12px}.hintbtn{padding:9px 11px;border:1px solid #edc66f;border-radius:11px;background:#fff8e7;color:#75520e;font-weight:900}.hint{display:none;margin-top:9px;padding:12px;border-radius:12px;background:#fff8e8;color:#704f0f;line-height:1.6}.hint.on{display:block}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.flow span{padding:10px 12px;border-radius:12px;background:#edf7ff;color:var(--n);font-weight:900}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--l);text-align:left}.warn{padding:13px;border-radius:13px;background:#fff6e8}.btn{display:inline-block;margin-top:9px;padding:9px 12px;border:0;border-radius:11px;color:#fff;background:var(--b);text-decoration:none;font-weight:900}.game{margin-top:14px;padding:22px;border-radius:22px;background:radial-gradient(circle at top,#264d87,#091a34 68%);color:#fff}.game h2{margin:0}.gameGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}.gamebox{padding:16px;border:1px solid #ffffff25;border-radius:16px;background:#ffffff0d;margin-bottom:14px}.questmap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.qnode{padding:12px;border-radius:12px;background:#ffffff17;border:1px solid #ffffff28;font-weight:900}.qnode.done{background:#f3f8ff;color:#173875}.qnode.current{background:#3199d2}.qnode.lock{opacity:.55}.hp{height:20px;border-radius:999px;background:#dbe5ef;overflow:hidden}.hp i{display:block;height:100%;width:72%;background:linear-gradient(90deg,#37a66e,#80d69b);transition:.3s}.inventory{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.slot{position:relative;min-height:92px;padding:10px;display:grid;place-items:center;text-align:center;border:1px solid #ffffff28;border-radius:13px;background:#ffffff12;color:#fff}.slot.potion{cursor:pointer}.slot.potion:hover:after{content:attr(data-tip);position:absolute;left:50%;bottom:105%;transform:translateX(-50%);width:230px;padding:9px;border-radius:10px;background:#07152a;color:#fff;font-size:11px;line-height:1.5;z-index:5}.gamechat{display:grid;gap:8px;margin-top:10px}.gamechat .bubble{max-width:94%}.action{padding:10px 12px;border:0;border-radius:11px;background:#39a1d9;color:#fff;font-weight:900}.status{margin-top:9px;color:#9de9ff;font-weight:850}.skill{display:inline-block;margin:3px;padding:7px 9px;border-radius:999px;background:#e7f5ff;color:#0d528d;font-size:12px;font-weight:900}@media(max-width:820px){.grid,.gameGrid{grid-template-columns:1fr}.inventory{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="top"><b>생각자국 AI · 시나리오 시연</b><span class="tag" id="tag">프로토타입</span></div><section class="hero"><small id="kicker">시연</small><h1 id="title">시나리오</h1><p id="desc"></p><span class="grade">기준 학년 · 중학교 2학년</span></section><div id="content"></div></main><script>

 '윤리':{q:'환경을 위해서라면 전기차 사용을 의무화해도 되지 않나요?',stuck:'공동체의 환경 이익과 개인의 선택권 사이의 충돌이 빠져 있습니다.',rq:'환경 보호를 위해 개인의 선택을 제한할 수 있는 범위는 어디까지일까?',hint:'공동의 이익과 개인의 자유가 동시에 중요할 때 어떤 기준이 필요한지 질문해 보세요.'},
 '수학':{q:'전기차가 더 싸고 친환경인지 숫자로 확인할 수 있어요?',stuck:'비교하고 싶지만 비교기간과 단위가 정해지지 않았습니다.',rq:'1년 주행거리, 전기요금·연료비, 탄소배출량을 같은 기준으로 맞추려면 어떤 단위가 필요할까?',hint:'기간과 단위를 먼저 통일하세요. 예: 1년, 15,000km, 원/km, kgCO₂/km.'},

 smartphone:{title:'학교에서 스마트폰을 사용해도 될까?',subs:{'국어':{q:'스마트폰 금지에 반대하는 글을 쓰고 싶은데 뭐부터 해야 해요?',stuck:'입장은 있지만 상대가 납득할 근거와 반대의견 검토가 없습니다.',rq:'금지 찬성 측에서 가장 강하게 제시할 근거는 무엇이고, 그 근거에 어떻게 답할 수 있을까?',hint:'내 주장만 쓰지 말고 상대의 가장 강한 근거를 먼저 적어 보세요.'},'사회':{q:'스마트폰은 내 물건인데 학교가 왜 못 쓰게 해요?',stuck:'개인의 권리만 보고 공동체 규칙의 목적을 고려하지 않고 있습니다.',rq:'학생의 소유권과 다른 학생의 수업권이 충돌하면 어떤 기준으로 조정해야 할까?',hint:'권리와 규칙을 따로 보지 말고, 규칙이 보호하려는 다른 권리를 찾아보세요.'},'윤리':{q:'내가 조절해서 쓰면 되는데 왜 모두 제한해야 해요?',stuck:'자율과 책임의 관계를 일반화하지 못하고 있습니다.',rq:'자유롭게 사용할 권리가 있다면 그 사용으로 생기는 피해에 대한 책임은 어디까지일까?',hint:'자유 뒤에 따라오는 책임을 구체적인 상황으로 질문해 보세요.'},'과학':{q:'스마트폰이 집중력을 떨어뜨린다는 건 진짜예요?',stuck:'원인과 느낌을 구분할 자료가 필요합니다.',rq:'알림 횟수, 사용시간, 과제 집중시간을 기록하면 어떤 관계를 확인할 수 있을까?',hint:'측정 가능한 변수를 정해 보세요. 느낌이 아니라 데이터를 모으는 질문이 필요합니다.'},'수학':{q:'스마트폰 사용시간과 성적이 관계있는지 알고 싶어요.',stuck:'두 값의 관계와 인과를 혼동할 가능성이 있습니다.',rq:'사용시간과 성적을 비교할 때 수면시간이나 학습시간 같은 다른 변수도 봐야 하지 않을까?',hint:'두 수치가 같이 움직여도 원인이라고 바로 말할 수 없는 이유를 질문해 보세요.'}}},
 meal:{title:'급식은 원하는 메뉴만 주면 안 될까?',subs:{'과학':{q:'학생들이 좋아하는 메뉴만 주면 잔반도 줄고 좋은 거 아닌가요?',stuck:'기호도는 보지만 영양 균형을 놓치고 있습니다.',rq:'좋아하는 메뉴만 먹었을 때 단백질·비타민·식이섬유가 충분한지도 같이 확인해야 하지 않을까?',hint:'맛, 잔반, 영양을 각각 다른 기준으로 질문해 보세요.'},'사회':{q:'학생 투표로 급식메뉴를 정하면 가장 공정하지 않나요?',stuck:'다수결 외에 예산과 소수의 필요를 고려하지 않고 있습니다.',rq:'알레르기 학생과 한정된 급식예산까지 포함하면 다수결만으로 충분할까?',hint:'공정함이 ‘다수가 원하는 것’과 항상 같은지 질문해 보세요.'},'윤리':{q:'내가 먹기 싫은 반찬은 안 받아도 되는 거 아닌가요?',stuck:'개인 선택과 음식물쓰레기의 공동체 비용을 함께 보지 못합니다.',rq:'개인의 선택 때문에 생긴 음식물쓰레기 비용을 공동체가 함께 부담하는 것은 공정할까?',hint:'개인의 선택이 다른 사람에게 어떤 비용을 만드는지 질문해 보세요.'},'수학':{q:'인기 메뉴를 찾으려면 학생 설문만 하면 되나요?',stuck:'선호도와 실제 잔반량을 함께 비교할 필요가 있습니다.',rq:'메뉴별 만족도와 잔반 비율을 함께 그래프로 나타내면 어떤 차이가 보일까?',hint:'설문점수와 실제 잔반량 두 데이터를 같은 메뉴 기준으로 묶어보세요.'},'국어':{q:'급식 개선 제안서를 학교에 내고 싶어요.',stuck:'요구는 있지만 근거자료와 실행 가능한 제안이 부족합니다.',rq:'학교가 실제로 검토하려면 어떤 조사자료와 대안을 함께 제시해야 할까?',hint:'주장 → 근거자료 → 예상 반론 → 실행 가능한 대안 순으로 구성해 보세요.'}}},
 aihomework:{title:'AI가 숙제를 대신해 주면 왜 안 될까?',subs:{'국어':{q:'AI가 써준 글을 제가 조금 고치면 제 글 아닌가요?',stuck:'수정 여부와 생각의 주체를 같은 것으로 보고 있습니다.',rq:'문장의 핵심 주장과 근거를 스스로 설명하지 못한다면 그 글을 내 생각이라고 할 수 있을까?',hint:'누가 문장을 입력했는지보다 누가 주장과 근거를 만들었는지 질문해 보세요.'},'윤리':{q:'AI 도움도 검색이랑 비슷한데 왜 부정행위가 돼요?',stuck:'정보를 참고하는 것과 평가받을 결과물을 대신 생성하는 것의 차이가 불분명합니다.',rq:'도움받기와 대신하기의 경계는 과제의 어느 단계에서 나뉜다고 생각해?',hint:'자료찾기, 아이디어, 초안, 최종답안 단계로 나눠 허용 범위를 생각해 보세요.'},'사회':{q:'AI 대필이 많아져도 개인 문제 아닌가요?',stuck:'평가와 자격에 대한 사회적 신뢰의 영향을 놓치고 있습니다.',rq:'AI가 대신한 결과로 자격이나 성적을 받는 사람이 많아지면 사회는 그 평가를 계속 믿을 수 있을까?',hint:'개인의 편리함이 학교·자격·채용의 신뢰에 어떤 영향을 주는지 질문해 보세요.'},'수학':{q:'AI를 쓰면 성적이 오르는지 어떻게 확인해요?',stuck:'연습성과와 실제 학습효과를 구분하지 않고 있습니다.',rq:'AI를 사용할 때의 연습점수와 AI 없이 푼 시험점수를 따로 비교해야 하지 않을까?',hint:'‘도움을 받을 때 잘함’과 ‘혼자 할 수 있음’을 서로 다른 지표로 만들어 보세요.'},'정보':{q:'AI가 틀린 답을 왜 자신 있게 말해요?',stuck:'생성형 AI를 사실 데이터베이스처럼 이해하고 있습니다.',rq:'AI가 다음 말을 확률적으로 생성한다면, 사실 여부를 확인하기 위해 어떤 자료가 추가로 필요할까?',hint:'AI 답변과 원문 출처를 구분하고, 검증 가능한 1차 자료를 찾는 질문을 만들어 보세요.'}}}

function topicView(t){const subjects=Object.keys(t.subs);return `<div class="grid"><section class="panel"><h2>교과 연결맵</h2><div class="map">${subjects.map((s,i)=>`<button class="node ${i?'':'on'}" data-sub="${s}">${s}</button>`).join('')}</div><div class="subjectbox" id="subjectBox"></div></section><section class="panel"><h2>생각스튜디오 · 막힌 지점 진단형 대화</h2><div class="chat"><div class="bubble student"><span class="who">학생</span><span id="q1"></span></div><div class="bubble ai"><span class="who">생각자국 AI</span>먼저 네 생각을 조금 더 들어볼게. 왜 그렇게 생각했는지 한 문장으로 설명해 줄래?</div><div class="bubble student"><span class="who">학생</span>제가 알고 있는 기준만 보면 그렇게 보였어요. 그런데 어디까지 확인해야 하는지는 잘 모르겠어요.</div><div class="bubble diagnose"><span class="who">AI의 학습진단</span><span id="diag"></span></div><div class="bubble ai"><span class="who">생각자국 AI · 역질문</span><span id="rq"></span></div></div><div class="hintrow"><button class="hintbtn" id="hintBtn">💡 질문 힌트</button><small class="muted">주제·교과에 맞는 다음 질문 방향</small></div><div class="hint" id="hintBox"></div></section></div>`}
function questionView(){return `<div class="grid"><section class="panel"><h2>소크라테스식 질문 흐름</h2><div class="flow"><span>개념을 말해보기</span>→<span>근거 확인</span>→<span>모순·예외 찾기</span>→<span>개념 다시 세우기</span></div><p class="muted">질문과 답변을 반복하며 학생 스스로 개념의 경계를 정리하도록 돕습니다.</p></section><section class="panel"><h2>중2 학생 채팅</h2><div class="chat"><div class="bubble student"><span class="who">학생</span>학교에서는 스마트폰을 무조건 금지해야 해요.</div><div class="bubble ai"><span class="who">생각자국 AI</span>‘무조건’이라고 했네. 어떤 상황에서도 예외가 없다고 생각해?</div></div><div class="hintrow"><button class="hintbtn" id="hintBtn">💡 질문 힌트</button></div><div class="hint" id="hintBox"><b>이번 단계: 예외를 확인하는 질문</b><br>수업·안전·긴급상황처럼 규칙의 예외가 될 수 있는 상황을 떠올려 스스로 질문을 만들어 보세요.</div></section></div>`}
function growthView(){return `<div class="grid"><section class="panel"><h2>중2 김생각 · 성장나침반</h2><table class="table"><tr><th>국어</th><td>B → A</td><td>서술형 +8점</td></tr><tr><th>수학</th><td>B</td><td>문제해결 +5점</td></tr><tr><th>과학</th><td>B → A</td><td>탐구평가 +9점</td></tr><tr><th>질문력</th><td>67 → 78</td><td>+11</td></tr><tr><th>학습흥미</th><td>74 → 81</td><td>+7</td></tr></table></section><section class="panel"><h2>조정 필요 학생</h2><div class="warn"><b>▲ 김생각 · Lv.2 → Lv.3 상향 권고</b><p class="muted">최근 4주 응용문항 정답률 84%, 질문력 +11, 힌트 의존도 감소.</p><a class="btn" href="./teacher-task-detail.html?task=up">난이도 조정 처리</a></div><div class="warn" style="margin-top:10px"><b>▼ 박성장 · Lv.3 → Lv.2 하향 권고</b><p class="muted">응용단계 정답률 41%, 힌트 요청 증가.</p><a class="btn" href="./teacher-task-detail.html?task=down">난이도 조정 처리</a></div></section></div>`}
function questView(){return `<section class="game"><h2>🎮 중2 수학 · 성취기준 퀘스트 월드</h2><p style="color:#cbd9ec">퀘스트 안에서 실제로 AI와 문답하면 HP가 감소하고, 일정 시간 활동이 없으면 휴식으로 판단해 회복됩니다.</p><div class="gamebox"><b>🗺️ Quest Map</b><div class="questmap" style="margin-top:10px"><span class="qnode done">일차방정식 개념 ✓</span>→<span class="qnode current">방정식 풀이 ⚔</span>→<span class="qnode">실생활 적용</span>→<span class="qnode lock">융합 데이터 탐구 🔒</span></div></div><div class="gameGrid"><div><div class="gamebox"><b>❤️ HP <span id="hpNum">72</span> / 100</b><div class="hp" style="margin-top:9px"><i id="hpBar"></i></div><div class="status" id="hpStatus">학습대화를 시작해 보세요.</div></div><div class="gamebox"><b>🧠 현재 퀘스트: 3x + 5 = 20을 이해하며 풀기</b><div class="gamechat" id="gameChat"><div class="bubble ai"><span class="who">생각자국 AI</span>3x+5=20에서 먼저 없애고 싶은 것은 무엇일까?</div></div><button class="action" id="nextTalk">학생 답변하기 · HP -4</button></div><div class="gamebox"><b>⚡ 분야별 스킬</b><div style="margin-top:8px"><span class="skill">방정식 이해 Lv.3</span><span class="skill">근거 설명 Lv.2</span><span class="skill">자기검증 Lv.2</span></div></div></div><div><div class="gamebox"><b>🎒 인벤토리</b><div class="inventory" style="margin-top:10px"><div class="slot potion" id="potion" data-tip="회복포션은 퀘스트 목표 달성, 학습 후 자기성찰, 규칙적인 휴식, 스터디 협업 등 건강한 학습행동으로 얻습니다.">🧪<br><span style="color:#fff">회복포션 ×<b id="pCount">2</b></span><small>클릭 +20 HP</small></div><div class="slot">🏅<br><span style="color:#fff">질문배지 ×4</span></div><div class="slot">💡<br><span style="color:#fff">아이디어카드 ×3</span></div><div class="slot">📘<br><span style="color:#fff">탐구기록 ×5</span></div></div></div><div class="gamebox"><b>🌿 휴식 규칙</b><p style="color:#cbd9ec;line-height:1.6">5초간 키보드·마우스 활동이 없으면 HP가 실제로 +2씩 회복됩니다. 휴식도 학습전략이라는 점을 게임 규칙으로 경험합니다.</p></div></div></div></section>`}
function institutionView(){return `<div class="grid"><section class="panel"><h2>학교·교육지원청·교육청 AI 분석</h2><p class="muted">집계된 교과성취, 질문력, 학습흥미, 자기주도성, 퀘스트 데이터를 자연어로 질의합니다.</p><button class="btn iq" data-a="질문력은 상승했지만 교과성취가 정체된 학생군은 힌트 의존 감소가 느리고, 복습 간격이 긴 경향을 보였습니다.">질문력↑ · 성취 정체 집단은?</button><button class="btn iq" data-a="난이도 하향 후 4주 안에 성취가 회복된 집단은 기본개념 재확인과 짧은 퀘스트 반복 비율이 높았습니다.">난이도 하향 뒤 회복 집단은?</button></section><section class="panel" id="answer"><h2>AI 분석 결과</h2><p class="muted">왼쪽 질문을 눌러 분석 예시를 확인하세요.</p></section></div>`}
let html='',title='',desc='',tag='시연';if(TOPICS[type]){title=TOPICS[type].title;desc='학생의 질문에서 시작해 AI가 막힌 지점을 추정하고, 오개념을 스스로 확인하도록 역질문하는 중2 생각스튜디오입니다.';tag='학생 시연';html=topicView(TOPICS[type])}else if(type==='question'){title='소크라테스식 질문법을 자연스럽게 익히기';desc='개념을 정립하기 위해 질문과 답변을 반복하는 방식을 생각스튜디오 안에서 자연스럽게 사용합니다.';tag='질문학교';html=questionView()}else if(type==='growth'){title='성취와 사고의 변화를 함께 보는 성장나침반';desc='중2 기준 학교 성취정보와 질문력·학습흥미를 함께 보고 난이도 조정까지 연결합니다.';tag='성장·성취';html=growthView()}else if(type==='quest'){title='공부를 깨고 싶은 도전으로';desc='성취기준 퀘스트, HP, 인벤토리, 분야별 스킬이 실제 학습대화와 연결됩니다.';tag='퀘스트';html=questView()}else{title='기관 데이터 질의';desc='집계된 교육데이터를 질문하고 분석결과를 확인합니다.';tag='기관분석';html=institutionView()}
document.getElementById('tag').textContent=tag;document.getElementById('kicker').textContent=tag;document.getElementById('title').textContent=title;document.getElementById('desc').textContent=desc;document.getElementById('content').innerHTML=html;
if(TOPICS[type]){const t=TOPICS[type],btns=[...document.querySelectorAll('[data-sub]')],sb=document.getElementById('subjectBox');function show(s){btns.forEach(b=>b.classList.toggle('on',b.dataset.sub===s));const d=t.subs[s];sb.innerHTML=`<h3>${s}에서 탐구할 핵심</h3><p>${d.q}</p>`;q1.textContent=d.q;diag.textContent=d.stuck;rq.textContent=d.rq;hintBox.innerHTML=`<b>${s} 질문 힌트</b><br>${d.hint}`;hintBox.classList.remove('on')}btns.forEach(b=>b.onclick=()=>show(b.dataset.sub));show(btns[0].dataset.sub)}
const hb=document.getElementById('hintBtn');if(hb)hb.onclick=()=>document.getElementById('hintBox').classList.toggle('on');document.querySelectorAll('.iq').forEach(b=>b.onclick=()=>document.getElementById('answer').innerHTML='<h2>AI 분석 결과</h2><p class="muted">'+b.dataset.a+'</p>');
if(type==='quest'){let hp=72,potions=2,last=Date.now(),step=0;const conv=[['학생','먼저 +5를 없애고 싶어요. 양쪽에서 5를 빼면 되죠?'],['생각자국 AI','왜 양쪽에서 같은 5를 빼야 등식이 유지될까?'],['학생','양쪽 값이 같다는 관계를 그대로 유지해야 하기 때문이에요.'],['생각자국 AI','좋아. 그러면 3x=15가 됐을 때 x 하나의 값을 구하려면 다음에는 무엇을 해야 할까?'],['학생','양쪽을 3으로 나눠서 x=5로 만들어요.']];const draw=()=>{hpNum.textContent=hp;hpBar.style.width=hp+'%'};const activity=()=>{last=Date.now();hpStatus.textContent='학습활동 중 · 5초간 쉬면 HP 회복이 시작됩니다.'};nextTalk.onclick=()=>{if(step<conv.length){const [w,m]=conv[step++];gameChat.insertAdjacentHTML('beforeend',`<div class="bubble ${w==='학생'?'student':'ai'}"><span class="who">${w}</span>${m}</div>`);hp=Math.max(0,hp-4);activity();draw();if(step===conv.length)nextTalk.textContent='퀘스트 대화 완료 ✓'}else hpStatus.textContent='퀘스트 대화를 완료했습니다. 잠시 쉬면서 HP를 회복해 보세요.'};potion.onclick=()=>{if(potions>0&&hp<100){potions--;pCount.textContent=potions;hp=Math.min(100,hp+20);hpStatus.textContent='🧪 회복포션 사용 · HP +20';last=Date.now();draw()}};['keydown','pointerdown'].forEach(ev=>document.addEventListener(ev,e=>{if(!e.target.closest('#potion'))last=Date.now()}));setInterval(()=>{if(Date.now()-last>=5000&&hp<100){hp=Math.min(100,hp+2);hpStatus.textContent='🌿 휴식 감지 · HP가 +2 회복되었습니다.';draw()}},1000);draw()}
</script></body></html>
