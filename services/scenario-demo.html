<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시나리오 시연 | 생각자국 AI</title><style>:root{--n:#00288a;--b:#017bc5;--c:#00b1d8;--g:#17a36b;--r:#e84242;--o:#f59e0b;--t:#10233f;--m:#68798e;--l:#dce7f1;--p:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--p);color:var(--t)}button,a{font:inherit}button{cursor:pointer}main{width:min(1180px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{padding:7px 10px;border-radius:999px;background:#e8f4ff;color:var(--n);font-size:12px;font-weight:900}.hero{margin-top:12px;padding:24px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#02134d,var(--n),var(--b))}.hero h1{margin:7px 0;font-size:clamp(27px,4vw,42px)}.hero p{margin:0;color:rgba(255,255,255,.82);line-height:1.65}.grade{display:inline-flex;margin-top:10px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.13);font-size:12px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px;border:1px solid var(--l);border-radius:19px;background:#fff}.panel h2{margin:0 0 7px}.muted{color:var(--m);line-height:1.6}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:12px;border:1px solid var(--l);border-radius:13px;background:#fff;text-align:left;font-weight:800}.choice:hover,.choice.on{border-color:var(--c);background:#f0fbff}.chat{display:grid;gap:10px}.msg{max-width:90%;padding:12px 14px;border-radius:15px;line-height:1.6}.ai{background:#f3f8fc;border:1px solid var(--l)}.me{margin-left:auto;color:#fff;background:linear-gradient(135deg,var(--n),var(--b))}.hintrow{display:flex;align-items:center;gap:8px;margin-top:12px}.hintbtn{padding:8px 10px;border:1px solid #f0c96b;border-radius:11px;background:#fff8e8;color:#775414;font-weight:900}.hint{display:none;margin-top:8px;padding:10px;border-radius:12px;background:#fff8e8;color:#775414;line-height:1.55}.hint.on{display:block}.map{display:flex;flex-wrap:wrap;gap:7px}.node{padding:9px 11px;border:0;border-radius:12px;background:#edf7ff;color:var(--n);font-weight:850;cursor:pointer}.node.on{color:#fff;background:linear-gradient(135deg,var(--b),var(--c))}.subjectbox{margin-top:12px;padding:15px;border-radius:16px;background:#f8fbfe;border:1px solid var(--l)}.subjectbox h3{margin:0 0 6px}.subjectbox p{margin:0;color:var(--m);line-height:1.6}.hp{height:14px;border-radius:999px;background:#e9eef3;overflow:hidden}.hp i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--g),#6bd28e)}.skills{display:flex;flex-wrap:wrap;gap:7px}.skill{padding:8px 10px;border-radius:11px;background:#eef8ff;color:var(--b);font-size:12px;font-weight:850}.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--r);color:#fff;font-weight:950}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);text-align:left}.warn{background:#fff8ec}.ok{background:#effaf5}.btn{display:inline-block;margin-top:10px;padding:9px 12px;border:0;border-radius:11px;color:#fff;background:var(--b);text-decoration:none;font-weight:900}.btn.alt{background:#edf4fa;color:var(--n)}.taskrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--l)}.taskrow:last-child{border-bottom:0}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><b>생각자국 AI · 시나리오 시연</b><span class="tag" id="typeTag">프로토타입</span></div><section class="hero"><small id="kicker">시연</small><h1 id="title">시나리오를 불러오는 중</h1><p id="desc"></p><span class="grade" id="grade">기준 학년 · 중학교 2학년</span></section><div id="content"></div></main><script>
const q=new URLSearchParams(location.search),type=q.get('type')||'electric';
const TOPICS={
 electric:{title:'전기차는 정말 환경에 더 좋을까?',desc:'한 질문에서 과학·사회·윤리·수학·국어를 연결하는 중2 생각스튜디오 시연입니다.',start:['전기차는 기름을 안 쓰니까 무조건 친환경 아닌가요?','운전할 때만 보면 그럴 수 있어. 그런데 자동차를 만들고, 전기를 생산하고, 배터리를 폐기하는 과정까지 포함하면 어떨까?'],subjects:{'과학':{q:'배터리를 만드는 과정에서도 환경 부담이 생길까?',a:'배터리를 만들 때 필요한 금속, 전기, 운송 과정까지 생각해보면 무엇을 확인해야 할까?','hint':'“사용할 때”만 보지 말고 “만들기부터 버리기까지” 범위를 넓혀봐.'},'사회':{q:'전기차 보조금은 왜 주고, 누구에게 가장 도움이 될까?',a:'정부가 세금으로 보조금을 주는 이유와 혜택을 받는 사람을 나눠 생각해볼까?','hint':'정책의 목적과 혜택을 받는 사람을 따로 질문해봐.'},'윤리':{q:'환경을 위해 개인에게 불편이나 비용을 요구해도 될까?',a:'환경 보호라는 공동의 이익과 개인의 선택권이 충돌한다면 어떤 기준이 필요할까?','hint':'서로 충돌하는 두 가치를 먼저 찾아봐.'},'수학':{q:'전기차와 휘발유차를 숫자로 비교하려면 무엇을 재야 할까?',a:'1년 주행거리, 연료비, 전기요금, 탄소배출량처럼 비교 가능한 항목을 정해볼까?','hint':'같은 기준과 같은 기간으로 비교해야 공정해.'},'국어':{q:'“친환경 자동차”라는 표현은 언제 맞고 언제 과장일까?',a:'주장에 사용된 단어의 뜻과 근거가 일치하는지 살펴보자. “친환경”의 기준을 문장으로 정의해볼래?','hint':'핵심 단어의 뜻을 먼저 분명하게 만들어봐.'}}},
 smartphone:{title:'학교에서 스마트폰을 사용해도 될까?',desc:'규칙·권리·집중·데이터·논증을 연결하는 중2 생각스튜디오 시연입니다.',start:['수업시간에는 스마트폰을 다 금지해야 해요.','“다 금지”라는 말에 예외가 있을까? 학습에 필요한 경우도 같은 규칙을 적용해야 할까?'],subjects:{'국어':{q:'찬성과 반대는 어떤 근거를 들 수 있을까?',a:'각 입장에서 가장 강한 근거를 하나씩 찾은 뒤 어느 근거가 더 설득력 있는지 비교해보자.','hint':'내 주장만 강화하지 말고 반대편의 가장 강한 근거도 찾아봐.'},'사회':{q:'학교 규칙과 학생의 권리는 어디까지 조정할 수 있을까?',a:'학교가 규칙을 만드는 목적과 학생이 가진 권리를 함께 놓고 기준을 만들어보자.','hint':'규칙의 목적이 무엇인지 먼저 질문해봐.'},'윤리':{q:'자유롭게 사용할 권리에는 어떤 책임이 따라올까?',a:'자유가 다른 학생의 수업권이나 안전에 영향을 준다면 어떤 책임이 생길까?','hint':'내 자유가 다른 사람에게 미치는 영향까지 생각해봐.'},'과학':{q:'스마트폰 사용이 집중에 영향을 주는지 어떻게 확인할까?',a:'사용시간, 알림 횟수, 과제완료시간 같은 관찰 가능한 자료를 정해보자.','hint':'느낌 대신 확인할 수 있는 변수를 정해봐.'},'수학':{q:'사용시간과 학습시간의 관계를 어떻게 볼 수 있을까?',a:'하루 사용시간과 학습시간을 표로 모아 그래프나 평균으로 비교할 수 있어. 어떤 자료가 필요할까?','hint':'두 값의 관계를 보려면 같은 기간의 데이터를 모아야 해.'}}},
 meal:{title:'학교 급식은 학생이 원하는 메뉴만 제공하면 안 될까?',desc:'영양·예산·공동체·데이터·설득을 연결하는 중2 생각스튜디오 시연입니다.',start:['학생들이 좋아하는 메뉴만 주면 급식 만족도가 올라가지 않을까요?','만족도는 올라갈 수 있어. 그런데 급식이 해결해야 하는 목표가 “좋아하는 메뉴” 하나뿐일까?'],subjects:{'과학':{q:'좋아하는 음식만 먹어도 필요한 영양을 채울 수 있을까?',a:'탄수화물·단백질·지방뿐 아니라 비타민과 무기질까지 균형을 생각해보자.','hint':'맛과 영양이라는 두 기준을 분리해서 생각해봐.'},'사회':{q:'급식 예산은 누구의 돈이고 어떻게 써야 공정할까?',a:'한정된 예산 안에서 모든 학생에게 필요한 식사를 제공해야 한다면 어떤 기준이 필요할까?','hint':'예산은 한정되어 있다는 조건을 넣어 질문해봐.'},'윤리':{q:'개인의 선택과 공동체의 건강은 어떻게 균형을 잡을까?',a:'학생의 선택권을 존중하면서도 건강을 지키려면 어떤 절충안이 가능할까?','hint':'둘 중 하나만 고르지 말고 둘을 함께 살리는 방법을 찾아봐.'},'수학':{q:'잔반량과 인기 메뉴의 관계를 어떻게 확인할까?',a:'메뉴별 배식량과 잔반량을 며칠간 모아 비율로 비교하면 무엇을 알 수 있을까?','hint':'절대량보다 비율로 비교하면 공정할 수 있어.'},'국어':{q:'학생 의견을 학교에 제안하려면 어떤 글이 필요할까?',a:'주장, 근거, 예상되는 반대 의견, 해결안을 포함한 제안문을 구성해보자.','hint':'“좋아해요”가 아니라 근거가 있는 제안문으로 바꿔봐.'}}},
 aihomework:{title:'AI가 숙제를 대신해 주면 왜 안 될까?',desc:'학업윤리·정보검증·사회문제·데이터·글쓰기를 연결하는 중2 생각스튜디오 시연입니다.',start:['AI가 글을 더 잘 써주는데 그냥 제출하면 안 돼요?','과제의 목적이 결과물만 제출하는 것일까, 네가 생각하고 배우는 과정도 포함될까?'],subjects:{'국어':{q:'내 글과 AI가 만든 글의 차이를 어떻게 알 수 있을까?',a:'네 경험과 근거가 들어간 문장인지, 출처와 표현을 스스로 설명할 수 있는지 확인해보자.','hint':'“이 문장을 내가 설명할 수 있는가?”를 물어봐.'},'윤리':{q:'AI 도움과 부정행위의 경계는 어디일까?',a:'아이디어를 얻는 것, 문장을 고치는 것, 전체 답을 대신 만드는 것을 단계별로 나누면 기준을 만들 수 있을까?','hint':'AI 사용을 0 또는 100으로 보지 말고 단계로 나눠봐.'},'사회':{q:'AI 대필이 널리 퍼지면 사회에는 어떤 문제가 생길까?',a:'평가의 신뢰, 자격의 공정성, 책임 소재가 어떻게 달라질지 생각해보자.','hint':'개인 편리함을 넘어 제도 전체에 미치는 영향을 물어봐.'},'수학':{q:'AI 사용이 실제 성적에 도움이 되는지 어떻게 비교할까?',a:'AI 사용시간, 자력 풀이시간, 시험점수 같은 변수를 같은 기간에 모아볼 수 있어.','hint':'연습 성과와 AI 없이 보는 시험 성과를 따로 봐야 해.'},'정보':{q:'AI는 왜 틀린 답도 자신 있게 말할까?',a:'생성형 AI가 확률적으로 다음 말을 만들어낸다는 점을 생각하면 왜 검증이 필요한지 설명할 수 있을까?','hint':'AI의 답은 “근거가 확인된 사실”과 같지 않다는 점을 기억해.'}}}
};
function topicHtml(key){const t=TOPICS[key],subs=Object.keys(t.subjects);return `<div class="grid"><section class="panel"><h2>교과 연결맵</h2><div class="map">${subs.map((s,i)=>`<button class="node ${i===0?'on':''}" data-subject="${s}">${s}</button>`).join('')}</div><p class="muted">교과를 누르면 같은 주제가 해당 과목의 질문과 자료 방향으로 바뀝니다.</p><div id="subjectBox" class="subjectbox"></div></section><section class="panel"><h2>생각스튜디오 · 질문형 대화</h2><div class="chat"><div class="msg me">${t.start[0]}</div><div class="msg ai">${t.start[1]}</div><div class="msg me" id="subjectStudent"></div><div class="msg ai" id="subjectAi"></div></div><div class="hintrow"><button class="hintbtn" id="hintBtn">💡 질문 힌트</button><small class="muted">정답이 아니라 다음 생각 방향만 보여줍니다.</small></div><div class="hint" id="hintBox"></div></section></div>`}
const D={
 electric:{tag:'학생 시연',title:TOPICS.electric.title,desc:TOPICS.electric.desc,html:()=>topicHtml('electric'),topic:'electric'},
 smartphone:{tag:'학생 시연',title:TOPICS.smartphone.title,desc:TOPICS.smartphone.desc,html:()=>topicHtml('smartphone'),topic:'smartphone'},
 meal:{tag:'학생 시연',title:TOPICS.meal.title,desc:TOPICS.meal.desc,html:()=>topicHtml('meal'),topic:'meal'},

 question:{tag:'질문학교',title:'소크라테스 질문학교 · 힌트 엔진',desc:'중2 학생이 질문의 종류를 외우는 대신 채팅 속 작은 힌트를 통해 질문법을 익혀가는 시연입니다.',html:()=>`<div class="grid"><section class="panel"><h2>중2 학생 채팅</h2><div class="chat"><div class="msg me">학교 스마트폰 사용은 무조건 금지해야 해요.</div><div class="msg ai">네 생각을 조금 더 살펴보자. 다음 질문은 네가 만들어볼래?</div></div><div class="hintrow"><button class="hintbtn" id="hintBtn">💡 질문 힌트</button><small class="muted">작게 표시되는 보조 기능</small></div><div class="hint" id="hintBox">이번 단계의 힌트: <b>“예외가 있는가?”</b><br>질문 예시를 그대로 답으로 주지 않고, “학습 목적처럼 예외가 있을 수 있는 상황을 떠올려봐” 정도의 방향만 줍니다.</div><div class="subjectbox"><b>학생이 직접 만든 질문 예</b><p>“수업에 꼭 필요한 경우에도 스마트폰을 금지해야 할까?”</p></div></section><section class="panel"><h2>질문법 내면화</h2><div class="map"><span class="node">AI가 질문</span><span>→</span><span class="node on">학생이 힌트로 질문</span><span>→</span><span class="node">학생이 스스로 질문</span></div><p class="muted">학생의 질문 생성 능력이 높아질수록 힌트 노출 빈도와 구체성을 줄이는 구조입니다.</p></section></div>`},
 growth:{tag:'성장·성취',title:'성장나침반 · 중2 기준',desc:'중학교 2학년 학생의 학교 공식 성취정보와 질문력·연결력·학습흥미, 난이도 조정 필요를 함께 보여줍니다.',html:()=>`<div class="grid"><section class="panel"><h2>중2 · 김생각</h2><table class="table"><tr><th>국어</th><td>A</td><td>서술형 +8점</td></tr><tr><th>수학</th><td>B</td><td>문제해결 +5점</td></tr><tr><th>과학</th><td>A</td><td>탐구평가 +9점</td></tr><tr><th>질문력</th><td>78</td><td>+11</td></tr><tr><th>연결력</th><td>72</td><td>+8</td></tr><tr><th>학습흥미</th><td>81</td><td>+7</td></tr></table><p class="muted">예시 데이터입니다. 실제 서비스에서는 학교 공식 평가와 생각자국 활동기록을 구분 저장합니다.</p></section><section class="panel"><h2>조정 필요 학생</h2><div class="warn" style="padding:12px;border-radius:12px"><b>▲ 김생각 · Lv.2 → Lv.3 상향 권고</b><p class="muted">최근 4주 응용문항 정답률 84%, 질문력 +11.</p><a class="btn" href="./teacher-task-detail.html?task=up&v=20260807c">처리하기</a></div><div class="warn" style="padding:12px;border-radius:12px;margin-top:8px"><b>▼ 박성장 · Lv.3 → Lv.2 하향 권고</b><p class="muted">최근 3회 응용단계 정체, 힌트 요청 증가.</p><a class="btn" href="./teacher-task-detail.html?task=down&v=20260807c">처리하기</a></div><div class="skills" style="margin-top:12px"><span class="skill">Lv.1 기초 · 개념확인/충분한 힌트</span><span class="skill">Lv.2 기본 · 개념적용/이유설명</span><span class="skill">Lv.3 응용 · 조건변화/반례/연결</span><span class="skill">Lv.4 심화 · 교과연결/자기질문/자기검증</span></div></section></div>`},
 quest:{tag:'퀘스트',title:'중2 성취기준 기반 퀘스트 맵',desc:'중2 학생이 성취기준을 달성하면 다음 퀘스트가 열리고, HP는 학습과 휴식 리듬을 시각화합니다.',html:()=>`<section class="panel"><div class="map"><span class="node">일차함수 개념 ✓</span><span>→</span><span class="node">그래프 해석 ✓</span><span>→</span><span class="node on">실생활 변화율 퀘스트</span><span>→</span><span class="node">융합 데이터 탐구 🔒</span></div><h2 style="margin-top:18px">HP 68 / 100</h2><div class="hp"><i id="hpbar"></i></div><p class="muted">학습 중 HP가 감소하고, 키보드·마우스 활동이 일정 시간 없으면 휴식으로 판단해 조금씩 회복됩니다. HP가 낮아지면 휴식 경고가 뜹니다.</p><div class="skills"><span class="skill">🧪 회복포션 ×2</span><span class="skill">근거 설명 Lv.4</span><span class="skill">수학 데이터해석 Lv.5</span><span class="skill">협업 Lv.3</span></div><p class="muted">포션은 퀘스트 목표 달성, 자기성찰, 규칙적 휴식, 스터디 협업 등 건강한 학습행동으로 얻습니다. 종합레벨은 만들지 않고 분야별 성장만 보여줍니다.</p></section>`},
 teacher:{tag:'선생님 지원',title:'선생님 대시보드 · 실제 처리할 일',desc:'빨간 원의 흰 숫자에서 실제 해당 업무 처리 화면까지 연결됩니다.',html:()=>`<div class="grid"><section class="panel"><h2>프로필 옆 처리할 일 <span class="badge">6</span></h2><div class="taskrow"><div><b>▲ 김생각 난이도 상향</b><br><small class="muted">Lv.2 → Lv.3 권고</small></div><a class="btn" href="./teacher-task-detail.html?task=up&v=20260807c">처리하기</a></div><div class="taskrow"><div><b>▼ 박성장 난이도 하향</b><br><small class="muted">Lv.3 → Lv.2 권고</small></div><a class="btn" href="./teacher-task-detail.html?task=down&v=20260807c">처리하기</a></div><div class="taskrow"><div><b>🗺️ 로컬퀘스트 승인</b><br><small class="muted">중2 지역교통 안전 프로젝트</small></div><a class="btn" href="./teacher-task-detail.html?task=local&v=20260807c">처리하기</a></div><div class="taskrow"><div><b>📝 수행평가 확인</b><br><small class="muted">국어 주장글쓰기</small></div><a class="btn" href="./teacher-task-detail.html?task=assessment&v=20260807c">처리하기</a></div><div class="taskrow"><div><b>💚 학부모 리포트 확인</b></div><a class="btn" href="./teacher-task-detail.html?task=parent&v=20260807c">처리하기</a></div></section><section class="panel"><h2>📅 학급통지서</h2><p class="muted">연간 교육계획에서 전날 자동으로 생성된 업무입니다.</p><div class="ok" style="padding:12px;border-radius:12px">내일 · 중2 과학 수행평가 준비 안내</div><a class="btn" href="./teacher-task-detail.html?task=notice&v=20260807c">통지서 처리하기</a></section></div>`},
 parent:{tag:'학부모',title:'중2 학부모 성장리포트',desc:'점수와 사고과정을 함께 설명하는 중2 김생각 학생의 예시 리포트입니다.',html:()=>`<section class="panel"><h2>중2 김생각 · 이번 달 변화</h2><table class="table"><tr><th>국어 성취</th><td>B → A</td></tr><tr><th>과학 탐구</th><td>+9점</td></tr><tr><th>질문력</th><td>67 → 78</td></tr><tr><th>연결력</th><td>64 → 72</td></tr><tr><th>학습흥미</th><td>74 → 81</td></tr><tr><th>선생님 확인</th><td>완료</td></tr></table><div class="subjectbox"><b>가정 대화 제안</b><p>“이번 달에 네 생각이 가장 많이 바뀐 질문은 뭐였어?”</p></div></section>`},
 career:{tag:'진로',title:'중2 진로성장 AI · 추천 근거까지',desc:'중2 현재까지 누적된 질문·답변·퀘스트·로컬퀘스트·스터디·성취·선택을 바탕으로 진로가설을 제안합니다.',html:()=>`<div class="grid"><section class="panel"><h2>추천 직업군 · 도시계획·공공정책</h2><p class="muted">해당 직업군 필요역량: 시스템 연결, 데이터 해석, 이해관계자 공감, 장기계획.</p><div class="skills"><span class="skill">연결력 84</span><span class="skill">공감력 81</span><span class="skill">사회문제 질문 27회</span><span class="skill">로컬퀘스트 4회</span></div><div class="subjectbox"><b>추천 이유</b><p>학생 활동에서 여러 교과를 연결하고 이해관계자의 관점을 반영하는 패턴이 반복되어 해당 직업군이 요구하는 역량과 겹칩니다.</p></div></section><section class="panel"><h2>선택과 기록</h2><table class="table"><tr><th>AI 추천</th><td>도시계획·정책</td></tr><tr><th>학생 선택</th><td>정책기획 관심</td></tr><tr><th>학부모 선택</th><td>도시공학 탐색</td></tr><tr><th>선생님 의견</th><td>지역문제 프로젝트 권장</td></tr></table><p class="muted">직업카드는 하는 일, 필요한 역량, 관련학과, 전망, 공식 출처 기반 연봉정보, 검증된 블로그·영상 간접체험으로 이어집니다.</p></section></div>`},
 institution:{tag:'기관분석',title:'학교·지원청·교육청 AI 분석',desc:'중2를 포함한 집단의 교과성취와 사고역량을 함께 보고, 자연어 질의 결과를 같은 맥락으로 제시합니다.',html:()=>`<section class="panel"><h2>자연어 질의 예시</h2><div class="choices"><button class="choice iq" data-answer="중2 A학교군은 질문력 +9.4, 국어 서술형 +6.1점이 함께 상승했습니다. 다만 연관성 분석이며 인과관계를 확정하지 않습니다.">질문력이 가장 상승한 중2 학교군에서 국어 성취도도 함께 상승했습니까?</button><button class="choice iq" data-answer="난이도 하향 후 4주 내 성취 회복 집단은 선수개념 재확인과 힌트 사용 감소가 함께 나타났습니다.">수학 난이도 하향조정 학생 중 성취가 회복된 집단의 특징은?</button><button class="choice iq" data-answer="로컬퀘스트 참여집단은 타인 관점 질문과 공감력 지표가 함께 높아지는 경향을 보였습니다. 실제 실증에서는 표본수와 비교집단을 함께 제시합니다.">로컬퀘스트 참여와 공감력 상승의 관계는?</button></div><div id="ianswer" class="ok" style="margin-top:12px;padding:12px;border-radius:12px"><b>AI 분석 예시</b><p class="muted">질문을 선택하면 그 질문에 맞는 분석결과가 표시됩니다.</p></div></section>`}
};
const d=D[type]||D.electric;typeTag.textContent=d.tag;kicker.textContent=d.tag;title.textContent=d.title;desc.textContent=d.desc;content.innerHTML=d.html();
function bindTopic(topicKey){const t=TOPICS[topicKey];if(!t)return;const buttons=[...document.querySelectorAll('[data-subject]')],box=document.getElementById('subjectBox'),me=document.getElementById('subjectStudent'),ai=document.getElementById('subjectAi'),hint=document.getElementById('hintBox');function show(sub){buttons.forEach(b=>b.classList.toggle('on',b.dataset.subject===sub));const s=t.subjects[sub];box.innerHTML=`<h3>${sub}에서 생각해볼 질문</h3><p>${s.q}</p>`;me.textContent=s.q;ai.textContent=s.a;hint.textContent='💡 '+s.hint;hint.classList.remove('on')}buttons.forEach(b=>b.onclick=()=>show(b.dataset.subject));show(buttons[0].dataset.subject);document.getElementById('hintBtn').onclick=()=>hint.classList.toggle('on')}
if(d.topic)bindTopic(d.topic);const hb=document.getElementById('hintBtn'),hbox=document.getElementById('hintBox');if(hb&&!d.topic)hb.onclick=()=>hbox.classList.toggle('on');document.querySelectorAll('.iq').forEach(b=>b.onclick=()=>{document.getElementById('ianswer').innerHTML='<b>AI 분석 예시</b><p class="muted">'+b.dataset.answer+'</p>'});
</script></body></html>
