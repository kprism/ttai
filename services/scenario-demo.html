<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시나리오 시연 | 생각자국 AI</title><style>:root{--n:#00288a;--b:#017bc5;--c:#00b1d8;--g:#17a36b;--r:#e84242;--o:#f59e0b;--t:#10233f;--m:#68798e;--l:#dce7f1;--p:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--p);color:var(--t)}button,a{font:inherit}button{cursor:pointer}main{width:min(1180px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{padding:7px 10px;border-radius:999px;background:#e8f4ff;color:var(--n);font-size:12px;font-weight:900}.hero{margin-top:12px;padding:24px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#02134d,var(--n),var(--b))}.hero h1{margin:7px 0;font-size:clamp(27px,4vw,42px)}.hero p{margin:0;color:rgba(255,255,255,.82);line-height:1.65}.grade{display:inline-flex;margin-top:10px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.13);font-size:12px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px;border:1px solid var(--l);border-radius:19px;background:#fff}.panel h2{margin:0 0 7px}.muted{color:var(--m);line-height:1.6}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:12px;border:1px solid var(--l);border-radius:13px;background:#fff;text-align:left;font-weight:800}.choice:hover,.choice.on{border-color:var(--c);background:#f0fbff}.chat{display:grid;gap:10px}.msg{max-width:90%;padding:12px 14px;border-radius:15px;line-height:1.6}.ai{background:#f3f8fc;border:1px solid var(--l)}.me{margin-left:auto;color:#fff;background:linear-gradient(135deg,var(--n),var(--b))}.hintrow{display:flex;align-items:center;gap:8px;margin-top:12px}.hintbtn{padding:8px 10px;border:1px solid #f0c96b;border-radius:11px;background:#fff8e8;color:#775414;font-weight:900}.hint{display:none;margin-top:8px;padding:10px;border-radius:12px;background:#fff8e8;color:#775414;line-height:1.55}.hint.on{display:block}.map{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.node{padding:9px 11px;border:0;border-radius:12px;background:#edf7ff;color:var(--n);font-weight:850}.node.on{color:#fff;background:linear-gradient(135deg,var(--b),var(--c))}.node.lock{opacity:.5}.subjectbox{margin-top:12px;padding:15px;border-radius:16px;background:#f8fbfe;border:1px solid var(--l)}.subjectbox h3{margin:0 0 6px}.subjectbox p{margin:0;color:var(--m);line-height:1.6}.hp{height:18px;border-radius:999px;background:#e9eef3;overflow:hidden}.hp i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--g),#6bd28e);transition:width .35s}.skills{display:flex;flex-wrap:wrap;gap:7px}.skill{padding:8px 10px;border-radius:11px;background:#eef8ff;color:var(--b);font-size:12px;font-weight:850}.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--r);color:#fff;font-weight:950}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);text-align:left}.warn{background:#fff8ec}.ok{background:#effaf5}.btn{display:inline-block;margin-top:10px;padding:9px 12px;border:0;border-radius:11px;color:#fff;background:var(--b);text-decoration:none;font-weight:900}.taskrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--l)}.game{background:radial-gradient(circle at top,#173e77,#08182f);color:#fff;border:0}.game .muted{color:#c5d4e8}.gamebox{padding:14px;border:1px solid rgba(255,255,255,.16);border-radius:15px;background:rgba(255,255,255,.07);margin-top:10px}.inventory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{min-height:72px;display:grid;place-items:center;text-align:center;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.08);font-size:12px}.potion{font-size:25px}.hpstatus{font-weight:950}.rest{color:#8ef0ff;font-weight:900}.warnhp{color:#ffd66b;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}.inventory{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="top"><b>생각자국 AI · 시나리오 시연</b><span class="tag" id="typeTag">프로토타입</span></div><section class="hero"><small id="kicker">시연</small><h1 id="title">시나리오</h1><p id="desc"></p><span class="grade">기준 학년 · 중학교 2학년</span></section><div id="content"></div></main><script>
const q=new URLSearchParams(location.search),type=q.get('type')||'electric';
const TOPICS={electric:{title:'전기차는 정말 환경에 더 좋을까?',subs:{과학:['배터리를 만드는 과정에서도 환경 부담이 생길까?','만들기부터 폐기까지 범위를 넓혀 확인해보자.'],사회:['전기차 보조금은 누구에게 가장 도움이 될까?','정책 목적과 혜택을 받는 사람을 나눠 생각해보자.'],윤리:['환경을 위해 개인에게 비용을 요구해도 될까?','공동의 이익과 개인의 선택권을 함께 보자.'],수학:['전기차와 휘발유차를 숫자로 어떻게 비교할까?','같은 기간의 비용·주행거리·배출량을 비교해보자.'],국어:['친환경이라는 표현은 언제 과장일까?','핵심 단어의 뜻과 근거가 일치하는지 살펴보자.']}},smartphone:{title:'학교에서 스마트폰을 사용해도 될까?',subs:{국어:['찬성과 반대는 어떤 근거를 들 수 있을까?','양쪽의 가장 강한 근거를 비교해보자.'],사회:['학교 규칙과 학생의 권리는 어디까지 조정할까?','규칙의 목적과 권리를 함께 보자.'],윤리:['자유에는 어떤 책임이 따라올까?','다른 학생의 수업권에 미치는 영향도 보자.'],과학:['집중에 영향을 주는지 어떻게 확인할까?','사용시간·알림·과제시간을 관찰해보자.'],수학:['사용시간과 학습시간의 관계를 어떻게 볼까?','같은 기간의 자료를 모아 비교해보자.']}},meal:{title:'학교 급식은 원하는 메뉴만 제공하면 안 될까?',subs:{과학:['좋아하는 음식만 먹어도 영양을 채울 수 있을까?','맛과 영양을 나눠 보자.'],사회:['급식 예산은 어떻게 써야 공정할까?','한정된 예산이라는 조건을 넣어보자.'],윤리:['개인 선택과 공동체 건강은 어떻게 균형을 잡을까?','두 가치를 함께 살리는 방법을 찾아보자.'],수학:['잔반량과 인기 메뉴의 관계를 어떻게 확인할까?','배식량 대비 잔반 비율을 비교해보자.'],국어:['학생 의견을 학교에 어떻게 제안할까?','주장·근거·반대의견·해결안을 넣어보자.']}},aihomework:{title:'AI가 숙제를 대신해 주면 왜 안 될까?',subs:{국어:['내 글과 AI 글의 차이는 무엇일까?','내가 문장을 설명하고 근거를 제시할 수 있는지 확인해보자.'],윤리:['AI 도움과 부정행위의 경계는 어디일까?','사용 단계를 나눠 기준을 만들어보자.'],사회:['AI 대필이 널리 퍼지면 어떤 문제가 생길까?','평가 신뢰와 자격의 공정성을 생각해보자.'],수학:['AI 사용이 성적에 도움이 되는지 어떻게 비교할까?','AI 없이 보는 시험성과와 연습성과를 나눠보자.'],정보:['AI는 왜 틀린 답도 자신 있게 말할까?','생성 결과와 검증된 사실은 다르다는 점을 보자.']}}};
function topicHtml(k){const t=TOPICS[k],ss=Object.keys(t.subs);return `<div class="grid"><section class="panel"><h2>교과 연결맵</h2><div class="map">${ss.map((s,i)=>`<button class="node ${i?'':'on'}" data-subject="${s}">${s}</button>`).join('')}</div><div id="subjectBox" class="subjectbox"></div></section><section class="panel"><h2>생각스튜디오 · 질문형 대화</h2><div class="chat"><div class="msg me">${t.title}</div><div class="msg ai">한 과목의 답으로 끝내지 말고 여러 관점에서 살펴보자.</div><div class="msg me" id="subjectStudent"></div><div class="msg ai" id="subjectAi"></div></div><div class="hintrow"><button class="hintbtn" id="hintBtn">💡 질문 힌트</button><small class="muted">다음 생각의 방향만 표시</small></div><div class="hint" id="hintBox">근거·예외·반대관점 중 하나를 골라 질문을 한 단계 더 깊게 만들어보세요.</div></section></div>`}
const simple={question:['질문학교','소크라테스 질문학교 · 힌트 엔진',`<div class="grid"><section class="panel"><h2>중2 학생 채팅</h2><div class="chat"><div class="msg me">학교 스마트폰 사용은 무조건 금지해야 해요.</div><div class="msg ai">다음 질문은 네가 만들어볼래?</div></div><div class="hintrow"><button class="hintbtn" id="hintBtn">💡 질문 힌트</button></div><div class="hint" id="hintBox"><b>이번 단계: 예외가 있는가?</b><br>학습 목적처럼 예외가 있을 수 있는 상황을 떠올려보세요.</div></section><section class="panel"><h2>질문법 내면화</h2><div class="map"><span class="node">AI 질문</span>→<span class="node on">힌트로 질문</span>→<span class="node">스스로 질문</span></div></section></div>`],growth:['성장·성취','성장나침반 · 중2 기준',`<div class="grid"><section class="panel"><h2>중2 · 김생각</h2><table class="table"><tr><th>국어</th><td>A</td><td>서술형 +8점</td></tr><tr><th>수학</th><td>B</td><td>문제해결 +5점</td></tr><tr><th>과학</th><td>A</td><td>탐구평가 +9점</td></tr><tr><th>질문력</th><td>78</td><td>+11</td></tr></table></section><section class="panel"><h2>조정 필요 학생</h2><div class="warn" style="padding:12px;border-radius:12px"><b>▲ 김생각 · Lv.2 → Lv.3 상향 권고</b><p class="muted">최근 4주 응용문항 정답률 84%, 질문력 +11.</p><a class="btn" href="./teacher-task-detail.html?task=up">처리하기</a></div></section></div>`],teacher:['선생님 지원','선생님 대시보드 · 실제 처리할 일',`<div class="grid"><section class="panel"><h2>프로필 옆 처리할 일 <span class="badge">6</span></h2><div class="taskrow"><div><b>▲ 김생각 난이도 상향</b></div><a class="btn" href="./teacher-task-detail.html?task=up">처리하기</a></div><div class="taskrow"><div><b>🗺️ 로컬퀘스트 승인</b></div><a class="btn" href="./teacher-task-detail.html?task=local">처리하기</a></div><div class="taskrow"><div><b>📝 수행평가 확인</b></div><a class="btn" href="./teacher-task-detail.html?task=assessment">처리하기</a></div></section><section class="panel"><h2>📅 학급통지서</h2><p class="muted">연간 교육계획에서 전날 자동 생성된 업무</p><a class="btn" href="./teacher-task-detail.html?task=notice">통지서 처리하기</a></section></div>`],parent:['학부모','중2 학부모 성장리포트',`<section class="panel"><h2>중2 김생각 · 이번 달 변화</h2><table class="table"><tr><th>국어</th><td>B → A</td></tr><tr><th>질문력</th><td>67 → 78</td></tr><tr><th>학습흥미</th><td>74 → 81</td></tr></table></section>`],career:['진로','중2 진로성장 AI',`<div class="grid"><section class="panel"><h2>추천 직업군 · 도시계획·공공정책</h2><div class="skills"><span class="skill">연결력 84</span><span class="skill">공감력 81</span><span class="skill">로컬퀘스트 4회</span></div><div class="subjectbox"><b>추천 이유</b><p>여러 교과를 연결하고 이해관계자의 관점을 반영하는 활동이 반복되어 해당 직업군의 요구역량과 겹칩니다.</p></div></section><section class="panel"><h2>선택과 기록</h2><table class="table"><tr><th>AI 추천</th><td>도시계획·정책</td></tr><tr><th>학생 선택</th><td>정책기획 관심</td></tr><tr><th>학부모 선택</th><td>도시공학 탐색</td></tr></table></section></div>`],institution:['기관분석','학교·지원청·교육청 AI 분석',`<section class="panel"><h2>자연어 질의 예시</h2><div class="choices"><button class="choice iq" data-answer="중2 A학교군은 질문력 +9.4, 국어 서술형 +6.1점이 함께 상승했습니다. 연관성 분석이며 인과관계를 확정하지 않습니다.">질문력이 상승한 학교군에서 국어 성취도도 함께 상승했습니까?</button><button class="choice iq" data-answer="난이도 하향 후 성취 회복 집단은 선수개념 재확인과 힌트 사용 감소가 함께 나타났습니다.">난이도 조정 후 성취가 회복된 학생의 특징은?</button></div><div id="ianswer" class="subjectbox">질문을 선택하면 분석 예시가 표시됩니다.</div></section>`]};
function questHtml(){return `<section class="panel game"><h2>🎮 중2 수학 · 성취기준 퀘스트 월드</h2><div class="gamebox"><b>🗺️ 퀘스트 맵</b><div class="map" style="margin-top:10px"><span class="node">일차함수 개념 ✓</span><span>→</span><span class="node">그래프 해석 ✓</span><span>→</span><span class="node on">실생활 변화율 ⚔️</span><span>→</span><span class="node lock">융합 데이터 탐구 🔒</span></div></div><div class="grid"><div class="gamebox"><div class="hpstatus">❤️ HP <span id="hpNum">68</span> / 100</div><div class="hp" style="margin-top:8px"><i id="hpbar"></i></div><p id="hpMsg" class="rest">5초 동안 활동이 없으면 휴식으로 판단해 HP가 실제로 회복됩니다.</p><button class="btn" id="studyBtn">⚡ 학습활동 해보기 (-6 HP)</button></div><div class="gamebox"><b>🎒 인벤토리</b><div class="inventory" style="margin-top:9px"><button class="slot" id="potion"><span><span class="potion">🧪</span><br>회복포션 ×<b id="pCount">2</b><br><small>클릭 +20</small></span></button><div class="slot">🏅<br>질문배지 ×4</div><div class="slot">💡<br>아이디어카드 ×3</div><div class="slot">📘<br>탐구기록 ×5</div></div></div></div><div class="gamebox"><b>분야별 스킬</b><div class="skills" style="margin-top:8px"><span class="skill">근거 설명 Lv.4</span><span class="skill">수학 데이터해석 Lv.5</span><span class="skill">협업 Lv.3</span></div><p class="muted">포션은 목표달성, 자기성찰, 규칙적 휴식, 스터디 협업 등 건강한 학습행동으로 얻습니다. 종합레벨로 학생을 줄 세우지 않습니다.</p></div></section>`}
let tag,title,desc,html,topic=null;if(TOPICS[type]){tag='학생 시연';title=TOPICS[type].title;desc='같은 현실 문제를 여러 교과의 질문으로 탐구하는 중2 생각스튜디오입니다.';html=topicHtml(type);topic=type}else if(type==='quest'){tag='퀘스트';title='중2 성취기준 기반 퀘스트 맵';desc='게임의 진행감을 활용하되 경쟁보다 학습 리듬과 분야별 성장을 보여줍니다.';html=questHtml()}else{const s=simple[type]||simple.question;[tag,title,html]=s;desc='생각자국 AI 기능 흐름을 확인하는 중2 기준 프로토타입입니다.'}typeTag.textContent=tag;kicker.textContent=tag;document.getElementById('title').textContent=title;document.getElementById('desc').textContent=desc;content.innerHTML=html;
if(topic){const t=TOPICS[topic],buttons=[...document.querySelectorAll('[data-subject]')],box=document.getElementById('subjectBox'),me=document.getElementById('subjectStudent'),ai=document.getElementById('subjectAi');function show(s){buttons.forEach(b=>b.classList.toggle('on',b.dataset.subject===s));const d=t.subs[s];box.innerHTML=`<h3>${s}에서 생각해볼 질문</h3><p>${d[0]}</p>`;me.textContent=d[0];ai.textContent=d[1]}buttons.forEach(b=>b.onclick=()=>show(b.dataset.subject));show(buttons[0].dataset.subject)}const hb=document.getElementById('hintBtn'),hbox=document.getElementById('hintBox');if(hb)hb.onclick=()=>hbox.classList.toggle('on');document.querySelectorAll('.iq').forEach(b=>b.onclick=()=>document.getElementById('ianswer').innerHTML='<b>AI 분석 예시</b><p>'+b.dataset.answer+'</p>');
if(type==='quest'){let hp=68,potions=2,lastActivity=Date.now();const bar=document.getElementById('hpbar'),num=document.getElementById('hpNum'),msg=document.getElementById('hpMsg'),pc=document.getElementById('pCount');function draw(){num.textContent=hp;bar.style.width=hp+'%';if(hp<=25)msg.innerHTML='<span class="warnhp">⚠ HP가 낮습니다. 잠시 쉬거나 포션을 사용해보세요.</span>'}function activity(){lastActivity=Date.now();msg.textContent='학습활동 감지 · 5초 뒤 휴식 회복이 시작됩니다.'}document.getElementById('studyBtn').onclick=()=>{hp=Math.max(0,hp-6);activity();draw()};document.getElementById('potion').onclick=()=>{if(potions>0&&hp<100){potions--;hp=Math.min(100,hp+20);pc.textContent=potions;msg.textContent='🧪 회복포션 사용 · HP +20';lastActivity=Date.now();draw()}};['keydown','pointerdown'].forEach(ev=>document.addEventListener(ev,e=>{if(!e.target.closest('#potion')&&!e.target.closest('#studyBtn'))activity()}));setInterval(()=>{if(Date.now()-lastActivity>=5000&&hp<100){hp=Math.min(100,hp+2);msg.textContent='🌿 휴식 감지 · HP가 회복 중입니다 (+2)';draw()}},1000);draw()}
</script></body></html>
