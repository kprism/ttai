<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시나리오 시연 | 생각자국 AI</title><style>:root{--n:#00288a;--b:#017bc5;--c:#00b1d8;--g:#17a36b;--r:#e84242;--o:#f59e0b;--t:#10233f;--m:#68798e;--l:#dce7f1;--p:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--p);color:var(--t)}main{width:min(1180px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{padding:7px 10px;border-radius:999px;background:#e8f4ff;color:var(--n);font-size:12px;font-weight:900}.hero{margin-top:12px;padding:24px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#02134d,var(--n),var(--b))}.hero h1{margin:7px 0;font-size:clamp(27px,4vw,42px)}.hero p{margin:0;color:rgba(255,255,255,.82);line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px;border:1px solid var(--l);border-radius:19px;background:#fff}.panel h2{margin:0 0 7px}.muted{color:var(--m);line-height:1.6}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:12px;border:1px solid var(--l);border-radius:13px;background:#fff;text-align:left;font-weight:800}.choice:hover{border-color:var(--c);background:#f0fbff}.chat{display:grid;gap:10px}.msg{max-width:88%;padding:12px 14px;border-radius:15px;line-height:1.6}.ai{background:#f3f8fc;border:1px solid var(--l)}.me{margin-left:auto;color:#fff;background:linear-gradient(135deg,var(--n),var(--b))}.hint{margin-top:10px;padding:10px;border-radius:12px;background:#fff8e8;color:#775414}.map{display:flex;flex-wrap:wrap;gap:7px}.node{padding:9px 11px;border-radius:12px;background:#edf7ff;color:var(--n);font-weight:850}.current{color:#fff;background:linear-gradient(135deg,var(--b),var(--c))}.hp{height:14px;border-radius:999px;background:#e9eef3;overflow:hidden}.hp i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--g),#6bd28e)}.skills{display:flex;flex-wrap:wrap;gap:7px}.skill{padding:8px 10px;border-radius:11px;background:#eef8ff;color:var(--b);font-size:12px;font-weight:850}.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--r);color:#fff;font-weight:950}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);text-align:left}.warn{background:#fff8ec}.ok{background:#effaf5}.btn{display:inline-block;margin-top:10px;padding:9px 12px;border-radius:11px;color:#fff;background:var(--b);text-decoration:none;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><b>생각자국 AI · 시나리오 시연</b><span class="tag" id="typeTag">프로토타입</span></div><section class="hero"><small id="kicker">시연</small><h1 id="title">시나리오를 불러오는 중</h1><p id="desc"></p></section><div id="content"></div></main><script>const q=new URLSearchParams(location.search),type=q.get('type')||'electric';const D={electric:{tag:'학생 시연',title:'전기차는 정말 환경에 더 좋을까?',desc:'중2 수준의 한 질문을 여러 교과로 확장하는 생각스튜디오 시나리오입니다.',html:`<div class="grid"><section class="panel"><h2>교과 연결맵</h2><div class="map"><span class="node current">과학</span><span class="node">사회</span><span class="node">윤리</span><span class="node">수학</span><span class="node">국어</span></div><p class="muted">학생은 원하는 교과부터 선택할 수 있고, 활동이 끝나면 다른 교과로 이어집니다.</p><div class="choices"><button class="choice">과학 · 배터리를 만드는 과정에서도 탄소가 나올까?</button><button class="choice">사회 · 전기차 보조금은 누구에게 왜 필요할까?</button><button class="choice">윤리 · 환경을 위해 개인에게 불편을 요구해도 될까?</button><button class="choice">수학 · 1년 연료비와 탄소배출량을 숫자로 비교할 수 있을까?</button><button class="choice">국어 · “친환경 자동차”라는 표현은 항상 맞는 말일까?</button></div></section><section class="panel"><h2>질문형 대화</h2><div class="chat"><div class="msg me">전기차는 기름을 안 쓰니까 무조건 친환경 아닌가요?</div><div class="msg ai">운전할 때만 보면 그럴 수 있어. 그런데 자동차를 만들고, 전기를 만들고, 배터리를 버리는 과정까지 포함하면 어떨까?</div><div class="msg me">배터리 만드는 과정도 봐야 할 것 같아요.</div><div class="msg ai">좋아. 그럼 “친환경”이라고 판단하려면 어떤 자료가 더 필요할까?</div></div><div class="hint">💡 질문 힌트 · “근거가 충분한가?”를 생각해봐.</div></section></div>`},smartphone:{tag:'학생 시연',title:'학교에서 스마트폰을 사용해도 될까?',desc:'국어·사회·윤리·과학·수학이 한 주제 안에서 연결되는 시나리오입니다.',html:`<div class="grid"><section class="panel"><h2>중2 탐구경로</h2><div class="choices"><button class="choice">국어 · 찬성과 반대의 근거를 각각 한 가지씩 찾아보기</button><button class="choice">사회 · 학교 규칙과 학생의 권리는 어디까지 조정할 수 있을까?</button><button class="choice">윤리 · 자유에는 어떤 책임이 따라올까?</button><button class="choice">과학 · 스마트폰 사용이 집중에 미치는 영향을 어떻게 확인할까?</button><button class="choice">수학 · 사용시간과 학습시간 데이터를 그래프로 비교해보기</button></div></section><section class="panel"><h2>생각스튜디오</h2><div class="chat"><div class="msg me">수업시간에는 스마트폰을 다 금지해야 해요.</div><div class="msg ai">“다 금지”라는 말에 예외가 있을까? 학습용으로 쓰는 경우도 같은 규칙을 적용해야 할까?</div><div class="msg me">학습용은 예외가 있어야 할 것 같아요.</div><div class="msg ai">그럼 금지보다 “어떤 조건에서 허용할지”를 설계하는 문제가 될 수도 있겠네. 어떤 조건이 필요할까?</div></div></section></div>`},meal:{tag:'학생 시연',title:'학교 급식은 학생이 원하는 메뉴만 제공하면 안 될까?',desc:'생활 속 주제를 예산·영양·공동체·데이터·설득으로 확장합니다.',html:`<div class="grid"><section class="panel"><h2>교과 연결</h2><div class="map"><span class="node">과학 · 영양</span><span class="node">사회 · 예산</span><span class="node">윤리 · 선택과 공동체</span><span class="node">수학 · 잔반량</span><span class="node">국어 · 제안서</span></div><p class="muted">퀘스트 완료 시 “데이터 근거”, “공감질문” 스킬 경험치가 쌓입니다.</p></section><section class="panel"><h2>질문 힌트</h2><div class="chat"><div class="msg ai">학생이 원하는 메뉴만 제공하면 좋아할 사람은 누구일까?</div><div class="msg me">학생들이요.</div><div class="msg ai">그럼 영양, 예산, 음식물쓰레기를 책임지는 사람의 입장에서는 어떤 질문을 할까?</div></div><div class="hint">💡 다른 사람의 입장에서 질문해봐.</div></section></div>`},aihomework:{tag:'학생 시연',title:'AI가 숙제를 대신해 주면 왜 안 될까?',desc:'AI 윤리와 학습의 의미를 학생 스스로 생각하게 하는 시나리오입니다.',html:`<div class="grid"><section class="panel"><h2>교과 연결</h2><div class="choices"><button class="choice">국어 · 내 문장과 AI 문장을 구분할 수 있을까?</button><button class="choice">윤리 · 도움과 부정행위의 경계는 어디일까?</button><button class="choice">사회 · AI 대필이 널리 퍼지면 어떤 문제가 생길까?</button><button class="choice">수학 · AI 사용 전후 학습시간과 점수 변화를 비교해보자</button><button class="choice">정보 · 생성형 AI는 왜 틀린 답을 자신 있게 말하기도 할까?</button></div></section><section class="panel"><h2>생각스튜디오</h2><div class="chat"><div class="msg me">AI가 잘 써주면 그냥 제출해도 되는 거 아닌가요?</div><div class="msg ai">과제의 목적이 결과물을 만드는 것뿐일까, 네가 생각하는 과정을 확인하는 것도 포함될까?</div><div class="msg me">생각하는 과정을 보는 것도 있겠네요.</div><div class="msg ai">그렇다면 AI를 “대신 하는 도구”가 아니라 “생각을 돕는 도구”로 쓰려면 어떤 규칙이 필요할까?</div></div></section></div>`},question:{tag:'질문학교',title:'소크라테스 질문학교 · 힌트 엔진',desc:'정답을 주지 않고 어떤 질문을 해야 할지 작은 힌트만 제공합니다.',html:`<div class="grid"><section class="panel"><h2>학생 화면</h2><div class="chat"><div class="msg me">학교 스마트폰 사용은 무조건 금지해야 해요.</div><div class="msg ai">네 생각을 더 단단하게 만들어볼까?</div></div><button class="choice">💡 질문 힌트 보기</button><div class="hint">이번에는 “예외가 있는가?”를 묻는 질문을 만들어봐.<br>예: “학습에 필요한 경우에도 금지해야 할까?”</div></section><section class="panel"><h2>내면화 과정</h2><p class="muted">초기에는 힌트를 자주 제공하고, 학생의 질문 생성 능력이 높아질수록 빈도를 줄입니다.</p><div class="map"><span class="node">AI가 질문</span><span>→</span><span class="node current">학생이 힌트로 질문</span><span>→</span><span class="node">학생이 스스로 질문</span></div></section></div>`},growth:{tag:'성장·성취',title:'성장나침반 · 사고와 성적을 함께 본다',desc:'학교 공식 성취정보와 질문력·사고력·학습흥미를 함께 추적합니다.',html:`<div class="grid"><section class="panel"><h2>중2 김생각</h2><table class="table"><tr><th>국어</th><td>A</td><td>서술형 +8점</td></tr><tr><th>수학</th><td>B</td><td>문제해결 +5점</td></tr><tr><th>과학</th><td>A</td><td>탐구평가 +9점</td></tr><tr><th>질문력</th><td>78</td><td>+11</td></tr><tr><th>연결력</th><td>72</td><td>+8</td></tr><tr><th>학습흥미</th><td>81</td><td>+7</td></tr></table><p class="muted">예시 데이터이며 실제 서비스에서는 학교 공식평가와 활동기록을 구분해 저장합니다.</p></section><section class="panel"><h2>난이도 조절 기록</h2><div class="ok" style="padding:12px;border-radius:12px"><b>▲ Lv.2 → Lv.3 상향 권고</b><p class="muted">최근 4주 교과성취와 질문력 상승. 선생님 확인 후 적용.</p></div><div class="skills"><span class="skill">Lv.1 기초</span><span class="skill">Lv.2 기본</span><span class="skill">Lv.3 응용</span><span class="skill">Lv.4 심화</span></div></section></div>`},quest:{tag:'퀘스트',title:'성취기준 기반 퀘스트 맵',desc:'시간이 아니라 성취기준 달성으로 다음 퀘스트가 열립니다.',html:`<section class="panel"><div class="map"><span class="node">분수의 의미 ✓</span><span>→</span><span class="node">분수 비교 ✓</span><span>→</span><span class="node current">분수 나눗셈</span><span>→</span><span class="node">실생활 적용 🔒</span></div><h2 style="margin-top:18px">HP 68 / 100</h2><div class="hp"><i></i></div><p class="muted">학습활동 중 HP가 조금씩 줄고, 키보드·마우스 활동이 없으면 휴식으로 판단해 서서히 회복됩니다. 낮은 HP에서는 휴식 경고가 뜹니다.</p><div class="skills"><span class="skill">🧪 회복포션 ×2</span><span class="skill">근거 설명 Lv.4</span><span class="skill">수학 탐구 Lv.5</span></div><p class="muted">포션은 목표 달성, 자기성찰, 규칙적 휴식, 협업활동 등 건강한 학습행동으로 획득합니다.</p></section>`},teacher:{tag:'선생님 지원',title:'선생님 대시보드 · 처리할 일 6건',desc:'빨간 원 속 흰 숫자를 누르면 업무목록으로 이동하고, 각 업무는 실제 처리 시나리오로 연결됩니다.',html:`<div class="grid"><section class="panel"><h2>오늘 처리할 일 <span class="badge">6</span></h2><table class="table"><tr class="warn"><td>▲ 김생각 난이도 상향</td><td>Lv.2→3</td></tr><tr class="warn"><td>▼ 박성장 난이도 하향</td><td>Lv.3→2</td></tr><tr><td>로컬퀘스트 승인</td><td>1건</td></tr><tr><td>수행평가 확인</td><td>2건</td></tr><tr><td>학부모 리포트</td><td>1건</td></tr></table><a class="btn" href="./teacher-tasks.html">실제 처리할 일 화면 열기</a></section><section class="panel"><h2>학급통지서</h2><p class="muted">연간 교육계획에서 내일 해야 할 일을 자동 생성합니다.</p><div class="ok" style="padding:12px;border-radius:12px">내일 · 과학 수행평가 준비물 안내<br>내일 · 로컬퀘스트 안전검토<br>모레 · 학부모 리포트 발행</div></section></div>`},parent:{tag:'학부모',title:'학부모 성장리포트',desc:'점수만이 아니라 아이가 어떻게 생각하고 성장하는지를 설명합니다.',html:`<section class="panel"><h2>이번 달 변화</h2><table class="table"><tr><th>국어 성취</th><td>B → A</td></tr><tr><th>질문력</th><td>67 → 78</td></tr><tr><th>학습흥미</th><td>74 → 81</td></tr><tr><th>선생님 확인</th><td>완료</td></tr></table><p class="muted">가정 대화 제안: “이번 달에 네 생각이 가장 많이 바뀐 질문은 뭐였어?”</p></section>`},career:{tag:'진로',title:'진로성장 AI · 왜 이 직업을 추천하는가',desc:'누적 질문·성취·퀘스트·로컬퀘스트·스터디·선택기록을 근거로 진로가설을 제시합니다.',html:`<div class="grid"><section class="panel"><h2>추천 직업군 · 도시계획·공공정책</h2><p class="muted">필요 역량: 시스템 연결, 데이터 해석, 이해관계자 공감, 장기계획.</p><div class="skills"><span class="skill">연결력 84</span><span class="skill">공감력 81</span><span class="skill">사회문제 질문 27회</span><span class="skill">로컬퀘스트 4회</span></div><p class="muted">학생의 활동에서 위 역량이 반복적으로 나타나 직업군과의 적합성을 ‘가설’로 제안합니다.</p></section><section class="panel"><h2>선택과 기록</h2><table class="table"><tr><th>AI 추천</th><td>도시계획·정책</td></tr><tr><th>학생 선택</th><td>정책기획 관심</td></tr><tr><th>학부모 선택</th><td>도시공학 탐색</td></tr><tr><th>선생님 의견</th><td>지역문제 프로젝트 권장</td></tr></table><p class="muted">직업카드에서는 하는 일, 필요한 역량, 관련학과, 전망, 공식 출처 연봉정보와 검증된 간접체험 콘텐츠를 연결합니다.</p></section></div>`},institution:{tag:'기관분석',title:'학교·지원청·교육청 AI 분석',desc:'개인이 아니라 집단 수준에서 성취와 사고역량의 변화를 함께 봅니다.',html:`<section class="panel"><h2>자연어 질의 예시</h2><div class="choices"><button class="choice">질문력이 가장 상승한 중2 학교군에서 국어 성취도도 함께 상승했습니까?</button><button class="choice">수학 난이도 하향조정 학생 중 성취가 회복된 집단의 특징은?</button><button class="choice">로컬퀘스트 참여와 공감력 상승의 관계는?</button></div><div class="ok" style="margin-top:12px;padding:12px;border-radius:12px"><b>AI 분석 예시</b><p class="muted">중2 A학교군에서 질문력 +9.4, 국어 서술형 +6.1점이 함께 상승했습니다. 단, 활동 간 연관성으로 인과관계를 확정할 수는 없습니다.</p></div></section>`}};const d=D[type]||D.electric;document.getElementById('typeTag').textContent=d.tag;document.getElementById('kicker').textContent=d.tag;document.getElementById('title').textContent=d.title;document.getElementById('desc').textContent=d.desc;document.getElementById('content').innerHTML=d.html;</script></body></html>
