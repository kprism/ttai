<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#00288a">
  <meta
    name="description"
    content="학생의 질문, 학습, 진로, 성장과 지역 프로젝트를 연결하는 생각자국 AI 프로토타입"
  >

  <title>생각자국 AI 프로토타입</title>

  <link rel="stylesheet" href="./css/brand.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text-primary);
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(0, 177, 216, 0.17),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(253, 166, 52, 0.14),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          var(--surface-page),
          #ffffff
        );
      font-family:
        Pretendard,
        "Noto Sans KR",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .launch-card {
      width: min(760px, 100%);
      padding: clamp(30px, 6vw, 64px);
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 40, 138, 0.1);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(16px);
    }

    .brand-logo {
      display: block;
      width: min(460px, 90%);
      height: auto;
      margin: 0 auto 28px;
    }

    .fallback-logo {
      margin: 0 0 20px;
      color: var(--brand-navy-800);
      font-size: clamp(34px, 7vw, 68px);
      font-weight: 850;
      letter-spacing: -0.06em;
    }

    .fallback-logo span {
      color: var(--brand-cyan-500);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 42px);
      letter-spacing: -0.04em;
    }

    p {
      max-width: 570px;
      margin: 18px auto 0;
      color: var(--text-secondary);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.75;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 28px;
      padding: 11px 17px;
      color: var(--brand-navy-800);
      background: var(--brand-blue-100);
      border-radius: 999px;
      font-weight: 750;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: var(--brand-cyan-500);
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(0, 177, 216, 0.14);
    }

    @media (max-width: 540px) {
      body {
        padding: 14px;
      }

      .launch-card {
        padding: 30px 20px;
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="launch-card">
    <img
      class="brand-logo"
      src="./assets/images/brand/saenggakjaguk-ai-logo.png"
      alt="생각자국 AI"
      onerror="
        this.hidden = true;
        document.querySelector('.fallback-logo').hidden = false;
      "
    >

    <div class="fallback-logo" hidden>
      생각자국 <span>AI</span>
    </div>

    <h1>생각자국 AI 프로토타입</h1>

    <p>
      학생의 질문과 학습, 교사의 피드백, 진로 탐색과
      지역 프로젝트를 하나의 성장 흐름으로 연결합니다.
    </p>

    <div class="status">
      <span class="status-dot" aria-hidden="true"></span>
      프로토타입 기반 구조를 만드는 중입니다
    </div>
  </main>
</body>
</html>
