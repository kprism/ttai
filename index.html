<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00288a"><title>생각자국 AI</title><style>
:root{--n:#00288a;--d:#02134d;--b:#017bc5;--c:#00b1d8;--t:#10233f;--m:#68798e;--l:#dce7f1;--p:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:var(--t);background:radial-gradient(circle at 8% 8%,rgba(0,177,216,.12),transparent 28%),var(--p)}main{width:min(1120px,100%);margin:auto;padding:24px 16px 70px}.hero{padding:32px;border-radius:28px;color:#fff;background:linear-gradient(135deg,var(--d),var(--n) 58%,var(--b));box-shadow:0 18px 42px rgba(0,40,138,.18)}.brand{font-size:28px;font-weight:950}.brand span{color:#6fe8ff}.hero h1{margin:28px 0 9px;font-size:clamp(38px,6vw,70px);line-height:1.03;letter-spacing:-.06em}.hero p{max-width:760px;color:rgba(255,255,255,.82);line-height:1.7}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.role{display:block;padding:18px;border:1px solid var(--l);border-radius:18px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 7px 20px rgba(16,35,63,.06);transition:.16s}.role:hover{transform:translateY(-3px);border-color:#9ccde9}.role .icon{font-size:27px}.role b{display:block;margin-top:9px}.role small{display:block;margin-top:4px;color:var(--m)}.brief{margin-top:14px;padding:22px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#122b72,var(--b),var(--c));display:flex;align-items:center;justify-content:space-between;gap:16px}.brief h2{margin:0 0 5px;font-size:27px}.brief p{margin:0;color:rgba(255,255,255,.8)}.brief a{flex:0 0 auto;padding:12px 16px;border-radius:13px;background:#fff;color:var(--n);text-decoration:none;font-weight:950}.login{display:inline-block;margin-top:15px;color:var(--b);font-weight:900;text-decoration:none}@media(max-width:820px){.roles{grid-template-columns:repeat(2,1fr)}.brief{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.roles{grid-template-columns:1fr}.hero{padding:25px 19px}}
</style></head><body><main><section class="hero"><div class="brand">생각자국 <span>AI</span></div><h1>질문에서 시작해<br>성장으로 이어집니다</h1><p>역할별 프로토타입 화면을 바로 확인하거나, BRIEF에서 대상별 설명과 실제 기능 시연을 한 흐름으로 진행할 수 있습니다.</p></section><section class="roles"><a class="role" href="./app.html?role=student&grade=m2"><span class="icon">🧑‍🎓</span><b>학생</b><small>중2 데모로 시작</small></a><a class="role" href="./app.html?role=teacher&grade=m2"><span class="icon">👩‍🏫</span><b>선생님</b><small>수업·학생지원</small></a><a class="role" href="./app.html?role=parent&grade=m2"><span class="icon">👨‍👩‍👧</span><b>학부모</b><small>성장리포트</small></a><a class="role" href="./app.html?role=school&grade=m2"><span class="icon">🏫</span><b>학교 관리자</b><small>학교 운영분석</small></a><a class="role" href="./app.html?role=district&grade=m2"><span class="icon">🗺️</span><b>교육지원청</b><small>지역 통합분석</small></a><a class="role" href="./app.html?role=province&grade=m2"><span class="icon">🏛️</span><b>시·도교육청</b><small>정책성과 분석</small></a><a class="role" href="./app.html?role=admin&grade=m2"><span class="icon">⚙️</span><b>플랫폼 관리자</b><small>전체 운영관리</small></a><a class="role" href="./login.html"><span class="icon">🔐</span><b>전체 시연 로그인</b><small>학년까지 선택</small></a></section><section class="brief"><div><h2>📣 BRIEF</h2><p>설명 대상에 맞는 브리핑자료와 실제 시연화면을 인프레임으로 연결합니다.</p></div><a href="./brief/index.html">BRIEF 시작 →</a></section><a class="login" href="./login.html">기존 빠른 시연 로그인으로 이동 →</a></main></body></html>
